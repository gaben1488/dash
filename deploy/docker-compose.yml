# AEMR production stack
# Запуск:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build

name: aemr

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging: *bounded-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-:80}
      # ключ читается из --env-file .env.production; Caddyfile инжектит его
      # в Authorization для /api/* (сервер fail-closed требует этот ключ)
      - AEMR_API_KEY=${AEMR_API_KEY:-}
      # вход по паролю на периметре: логин и bcrypt-хэш из .env.production
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-aemr}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:-}
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
    networks: [aemr]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: aemr-web:latest
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 192m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logging
    expose: ["80"]
    networks: [aemr]

  report-worker:
    profiles: [reports]
    image: aemr-server:latest
    restart: unless-stopped
    mem_limit: 2304m
    memswap_limit: 2816m
    mem_reservation: 256m
    cpus: 1.00
    cpu_shares: 256
    pids_limit: 128
    logging: *bounded-logging
    init: true
    command:
      - /opt/report-env/bin/proc-report
      - worker
      - --registry
      - /app/packages/server/data/reports/inputs/registry.json
      - --ledger
      - /app/packages/server/data/reports/inputs/ledger.json
      - --state
      - /app/packages/server/data/reports
      - --interval-seconds
      - "0"
    env_file:
      - ./.env.production
    environment:
      REPORT_SOURCE_COORDINATOR_URL: http://server:3000
    volumes:
      - server_data:/app/packages/server/data
    networks: [aemr]
    healthcheck:
      disable: true
    stop_grace_period: 75s
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: aemr-server:latest
    restart: unless-stopped
    mem_limit: 2560m
    memswap_limit: 3072m
    mem_reservation: 512m
    cpus: 1.75
    cpu_shares: 1024
    pids_limit: 256
    logging: *bounded-logging
    expose: ["3000"]
    env_file:
      - ./.env.production
    environment:
      REPORT_SOURCE_COORDINATOR_URL: http://127.0.0.1:3000
      SOURCE_AUTO_REFRESH_MINUTES: "0"
    volumes:
      - server_data:/app/packages/server/data
    networks: [aemr]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  server_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  aemr:
    driver: bridge
