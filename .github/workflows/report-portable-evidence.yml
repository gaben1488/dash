name: Report portable source evidence

on:
  push:
    branches: [codex/report-universal-acceptance]
    paths: [.github/workflows/report-portable-evidence.yml]

permissions:
  contents: write

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact public source edits
        run: |
          python3 .github/report-universal-patch.py
          python3 .github/report-universal-finish.py
      - name: Install and verify candidate
        run: |
          python3 -m pip install -e 'packages/report-engine[test]'
          python3 -m ruff check packages/report-engine --fix
          python3 .github/report-universal-finish.py --check
          git diff --check
          mkdir -p evidence
          python3 -m pytest packages/report-engine/tests -q --junitxml=evidence/python-tests.xml
      - name: Save verified Git tree object, not a production ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert paths and all(p.startswith('packages/report-engine/') for p in paths)
          entries = []
          for name in paths:
              path = Path(name)
              assert path.is_file() and not path.is_symlink()
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'content': path.read_text()})
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          body = json.dumps({'base_tree': base_tree, 'tree': entries}).encode()
          request = Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees',
              data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28'})
          with urlopen(request, timeout=60) as response:
              tree = json.load(response)['sha']
          subprocess.run(['git', 'add', '-A', 'packages/report-engine'], check=True)
          expected = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == expected, (tree, expected)
          Path('evidence/CANDIDATE_TREE.txt').write_text(tree + '\n')
          print('CANDIDATE_TREE_SHA=' + tree)
          with Path('evidence/source.tar.gz').open('wb') as stream:
              subprocess.run(['git', 'archive', '--format=tar.gz', '--prefix=dash/', tree], stdout=stream, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: report-candidate-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
