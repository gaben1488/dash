name: Report read-only upgrade rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/report-engine/**'
      - '.github/workflows/report-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: report-readonly-rehearsal
  cancel-in-progress: true

jobs:
  frozen-replay:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/report-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replay saved production evidence without changing service or data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          # Bash owns failure handling; per-line SSH injection breaks shell blocks.
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in
              *[!0-9a-f]*|'') exit 2 ;;
            esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            echo "=== production rehearsal storage diagnostic ==="
            df -h . /tmp 2>/dev/null || true
            df -i . /tmp 2>/dev/null || true
            git count-objects -vH || true
            docker system df || true
            echo "=== end storage diagnostic ==="
            # The production report volume can fill the root filesystem before
            # Git can even fetch the current candidate. For this one repair, use
            # the already-fetched, CI-green retention implementation from
            # adc6c815... out of Git objects and /tmp (tmpfs). It is wrapped in
            # the same shared run.lock, so report generation cannot race cleanup.
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            cd ..
            free_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "${free_kb:-0}" -lt 1048576 ]; then
              retention_seed='adc6c815d4a9b607921e8550b47d979fa9017b3b'
              git cat-file -e "$retention_seed^{commit}"
              seed_work=$(mktemp -d /tmp/report-retention-seed.XXXXXX)
              git archive "$retention_seed" packages/report-engine | tar -x -C "$seed_work"
              echo "Filesystem critically full before Git fetch; applying previously CI-verified bounded retention under run.lock."
              docker run --rm --network none --read-only \
                --volumes-from "$server":rw \
                -v "$seed_work/packages/report-engine:/retention:ro" \
                -e PYTHONPATH=/retention/src \
                --entrypoint /opt/report-env/bin/python "$image" \
                -c 'import fcntl,json; from pathlib import Path; from procurement_engine.retention import plan_transient_attempt_retention,apply_transient_attempt_retention; state="/app/packages/server/data/reports"; lock=(Path(state)/"run.lock").open("a"); fcntl.flock(lock,fcntl.LOCK_EX); plan=plan_transient_attempt_retention(state); summary={k:v for k,v in plan.items() if k!="compact_attempts"}; print(json.dumps({"seed_retention_dry_run":summary},ensure_ascii=False,sort_keys=True)); assert plan.get("bytes_reclaimable",0)>=2*1024**3,"RETENTION_RECLAIMABLE_SPACE_TOO_SMALL"; result=apply_transient_attempt_retention(state,expected_attempts=plan["compact_attempts"]); safe={k:v for k,v in result.items() if k!="compact_attempts"}; print(json.dumps({"seed_retention_apply":safe},ensure_ascii=False,sort_keys=True)); assert result.get("status")=="COMPACTED" and result.get("bytes_reclaimed",0)>=1024**3,"RETENTION_APPLY_DID_NOT_FREE_REQUIRED_SPACE"'
              rm -rf "$seed_work"
              df -h . /tmp
              free_kb=$(df -Pk . | awk 'NR==2 {print $4}')
              test "${free_kb:-0}" -ge 1048576
            fi

            git fetch --quiet origin "$candidate"
            work=$(mktemp -d /tmp/report-rehearsal.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            git archive "$candidate" packages/report-engine | tar -x -C "$work"
            cd deploy
            echo "=== report state aggregate footprint (no source contents) ==="
            docker run --rm --network none --read-only \
              --volumes-from "$server":ro \
              --entrypoint /bin/sh "$image" \
              -ec 'root=/app/packages/server/data/reports;
                   for name in attempts published archives archive_intake inputs; do
                     if [ -e "$root/$name" ]; then
                       kb=$(du -sk "$root/$name" 2>/dev/null | cut -f1);
                       echo "$name ${kb:-0} KiB";
                     fi;
                   done;
                   printf "attempt_dirs "; find "$root/attempts" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l;
                   printf "release_dirs "; find "$root/published/releases" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l;
                   printf "weekly_dirs "; find "$root/archives" -mindepth 1 -maxdepth 1 -type d -name "WEEKLY-*" 2>/dev/null | wc -l'
            echo "=== latest live release aggregate footprint ==="
            docker run --rm --network none --read-only \
              --volumes-from "$server":ro \
              --entrypoint /opt/report-env/bin/python "$image" \
              -c 'import json,sqlite3; from pathlib import Path; root=Path("/app/packages/server/data/reports/published"); db=sqlite3.connect(root/"publications.sqlite"); rows=db.execute("SELECT receipt FROM publications ORDER BY report_date DESC, cutoff_at DESC, release_id DESC"); receipt=next((json.loads(row[0]) for row in rows if "archive_origin" not in json.loads(row[0])),None); release=root/"releases"/receipt["release_id"] if receipt else None; size=lambda p: sum(x.stat().st_size for x in p.rglob("*") if x.is_file()) if p and p.exists() else 0; print(json.dumps({"report_date": receipt.get("report_date") if receipt else None, "release_bytes": size(release), "identity_bytes": (release/"identity.sqlite").stat().st_size if release and (release/"identity.sqlite").is_file() else 0, "snapshot_bundle_bytes": size(release/"snapshot_bundle") if release else 0, "main_docx_bytes": (release/"main_report.docx").stat().st_size if release and (release/"main_report.docx").is_file() else 0, "management_docx_bytes": (release/"management_report.docx").stat().st_size if release and (release/"management_report.docx").is_file() else 0}, ensure_ascii=False, sort_keys=True))'
            echo "=== candidate retention dry run ==="
            docker run --rm --network none --read-only \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /opt/report-env/bin/python "$image" \
              -c 'import json; from procurement_engine.retention import plan_transient_attempt_retention as p; r=p("/app/packages/server/data/reports"); r.pop("compact_attempts", None); print(json.dumps(r, ensure_ascii=False, sort_keys=True))'
            echo "=== end report state footprint ==="

            # One-time bounded remediation for the current full filesystem. The
            # candidate retention code is deliberately narrower than a generic
            # rm/prune: it keeps audit status/error files, current/new attempts,
            # every unsealed Thursday source and the source attempt of every
            # sealed WEEKLY archive. published/, archives/, inputs/ and identity
            # state are outside its deletion surface. The apply phase also takes
            # the same run.lock as report generation and compares against the
            # immediately preceding dry-run plan.
            free_kb=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "${free_kb:-0}" -lt 1048576 ]; then
              echo "Filesystem critically full; applying bounded transient-attempt retention from the exact candidate."
              docker run --rm --network none --read-only \
                --volumes-from "$server":rw \
                -v "$work/packages/report-engine:/candidate:ro" \
                -e PYTHONPATH=/candidate/src \
                --entrypoint /opt/report-env/bin/python "$image" \
                -c 'import json; from procurement_engine.retention import plan_transient_attempt_retention, apply_transient_attempt_retention; state="/app/packages/server/data/reports"; plan=plan_transient_attempt_retention(state); summary={k:v for k,v in plan.items() if k != "compact_attempts"}; print(json.dumps({"retention_dry_run":summary}, ensure_ascii=False, sort_keys=True)); assert plan.get("bytes_reclaimable",0) >= 2*1024**3, "RETENTION_RECLAIMABLE_SPACE_TOO_SMALL"; result=apply_transient_attempt_retention(state, expected_attempts=plan["compact_attempts"]); safe={k:v for k,v in result.items() if k != "compact_attempts"}; print(json.dumps({"retention_apply":safe}, ensure_ascii=False, sort_keys=True)); assert result.get("status") == "COMPACTED" and result.get("bytes_reclaimed",0) >= 1024**3, "RETENTION_APPLY_DID_NOT_FREE_REQUIRED_SPACE"'
              df -h . /tmp
              free_kb=$(df -Pk . | awk 'NR==2 {print $4}')
              test "${free_kb:-0}" -ge 1048576
            fi

            echo "Rehearsing candidate $candidate on frozen evidence, with production volumes read-only and network disabled."
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /opt/report-env/bin/python "$image" \
              -m procurement_engine.rehearsal --state /app/packages/server/data/reports --coverage

  historical-revision-preflight:
    needs: frozen-replay
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/report-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact historical master revisions with production read-only credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in
              *[!0-9a-f]*|'') exit 2 ;;
            esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d /tmp/report-revision-probe.XXXXXX)
            candidate_env=$(mktemp -d /tmp/report-candidate-env.XXXXXX)
            trap 'rm -rf "$work" "$candidate_env"' EXIT
            git archive "$candidate" packages/report-engine | tar -x -C "$work"
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")

            # The deployed image can be older than the PR and therefore can lack
            # a newly declared Python runtime dependency. Build an ephemeral venv
            # from the exact candidate without exposing production credentials.
            echo "Preparing exact candidate report-engine dependencies in disposable storage."
            docker run --rm --read-only --user 0:0 \
              --tmpfs /tmp:rw,nosuid,nodev,size=512m \
              -v "$work/packages/report-engine:/candidate:ro" \
              -v "$candidate_env:/candidate-env" \
              -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
              --entrypoint /bin/sh "$image" \
              -ec 'python3 -m venv /candidate-env &&
                   /candidate-env/bin/pip install --quiet --no-cache-dir /candidate'

            echo "Checking exact historical master revisions read-only; no production files or Drive data are changed."
            docker run --rm --read-only \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,size=512m \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -v "$candidate_env:/candidate-env:ro" \
              --env-file .env.production \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /candidate-env/bin/python "$image" \
              -m procurement_engine.cli probe-master-revisions \
              --registry /app/packages/server/data/reports/inputs/registry.json \
              --ledger /app/packages/server/data/reports/inputs/ledger.json
