name: Report read-only upgrade rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/report-engine/**'
      - '.github/workflows/report-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: report-readonly-rehearsal
  cancel-in-progress: true

jobs:
  latest-private-error-probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/report-')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Emit only sanitized latest report failure metadata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/aemr/dash/deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -c 'import json,re; from pathlib import Path; root=Path("data/reports"); status=json.loads((root/"status.json").read_text()); attempt=status.get("attempt_id"); error=json.loads((root/"attempts"/attempt/"error.json").read_text()) if isinstance(attempt,str) else {}; typ=error.get("error_type"); typ=typ if isinstance(typ,str) and re.fullmatch(r"[A-Za-z][A-Za-z0-9_]{0,80}",typ) else "OtherError"; message=error.get("message") if isinstance(error.get("message"),str) else ""; prefix=message.split(":",1)[0]; code=prefix if re.fullmatch(r"[A-Z][A-Z0-9_]{2,96}",prefix) else None; sqlite=error.get("sqlite_error"); sqlite=sqlite if isinstance(sqlite,str) and re.fullmatch(r"SQLITE_[A-Z0-9_]+",sqlite) else None; frames=[]; pattern=re.compile(r"File \"[^\"]*/procurement_engine/([A-Za-z0-9_]+)\.py\", line ([0-9]+), in ([A-Za-z0-9_]+)"); [frames.append({"module":m.group(1),"line":int(m.group(2)),"function":m.group(3)}) for m in pattern.finditer(error.get("traceback") or "")]; print(json.dumps({"status":status.get("status"),"failure_stage":status.get("failure_stage"),"error_type":typ,"internal_code":code,"sqlite_error":sqlite,"frames":frames[-8:]},sort_keys=True))'

  frozen-replay:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/report-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Replay saved production evidence without changing service or data
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          # Bash owns failure handling; per-line SSH injection breaks shell blocks.
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in
              *[!0-9a-f]*|'') exit 2 ;;
            esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            echo "=== production rehearsal storage diagnostic ==="
            df -h . /tmp 2>/dev/null || true
            df -i . /tmp 2>/dev/null || true
            git count-objects -vH || true
            docker system df || true
            echo "=== end storage diagnostic ==="
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            cd ..
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d /tmp/report-rehearsal.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            git archive "$candidate" packages/report-engine | tar -x -C "$work"
            cd deploy
            echo "=== report state aggregate footprint (no source contents) ==="
            docker run --rm --network none --read-only \
              --volumes-from "$server":ro \
              --entrypoint /bin/sh "$image" \
              -ec 'root=/app/packages/server/data/reports;
                   for name in attempts published archives archive_intake inputs; do
                     if [ -e "$root/$name" ]; then
                       kb=$(du -sk "$root/$name" 2>/dev/null | cut -f1);
                       echo "$name ${kb:-0} KiB";
                     fi;
                   done;
                   printf "attempt_dirs "; find "$root/attempts" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l;
                   printf "release_dirs "; find "$root/published/releases" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l;
                   printf "weekly_dirs "; find "$root/archives" -mindepth 1 -maxdepth 1 -type d -name "WEEKLY-*" 2>/dev/null | wc -l'
            echo "=== latest live release aggregate footprint ==="
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=128m \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /opt/report-env/bin/python "$image" \
              -c 'import json; from pathlib import Path; from procurement_engine.publication_store import PublicationStore; from procurement_engine.readonly_catalog import copied_catalog; root=Path("/app/packages/server/data/reports/published"); store=PublicationStore(root,readonly=True); context=copied_catalog(store.database_path); catalog=context.__enter__(); store.database_path=catalog; receipt=store.latest(); release=root/"releases"/receipt["release_id"] if receipt else None; size=lambda p: sum(x.stat().st_size for x in p.rglob("*") if x.is_file()) if p and p.exists() else 0; print(json.dumps({"report_date":receipt.get("report_date") if receipt else None,"release_bytes":size(release),"identity_bytes":(release/"identity.sqlite").stat().st_size if release and (release/"identity.sqlite").is_file() else 0,"snapshot_bundle_bytes":size(release/"snapshot_bundle") if release else 0,"main_docx_bytes":(release/"main_report.docx").stat().st_size if release and (release/"main_report.docx").is_file() else 0,"management_docx_bytes":(release/"management_report.docx").stat().st_size if release and (release/"management_report.docx").is_file() else 0},ensure_ascii=False,sort_keys=True)); context.__exit__(None,None,None)'
            echo "=== candidate retention dry run ==="
            docker run --rm --network none --read-only \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /opt/report-env/bin/python "$image" \
              -c 'import json; from procurement_engine.retention import plan_transient_attempt_retention as p; r=p("/app/packages/server/data/reports"); r.pop("compact_attempts", None); print(json.dumps(r, ensure_ascii=False, sort_keys=True))'
            echo "=== end report state footprint ==="

            echo "Rehearsing candidate $candidate on frozen evidence, with production volumes read-only and network disabled."
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=1g \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              -e PYTHONPATH=/candidate/src \
              --entrypoint /opt/report-env/bin/python "$image" \
              -m procurement_engine.rehearsal --state /app/packages/server/data/reports --coverage

  historical-revision-preflight:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'codex/report-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact historical master revisions with production read-only credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in
              *[!0-9a-f]*|'') exit 2 ;;
            esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d /tmp/report-revision-probe.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            git archive "$candidate" packages/report-engine | tar -x -C "$work"
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")

            # The deployed image can be older than the PR and therefore can lack
            # a newly declared Python runtime dependency. Prepare the exact candidate
            # entirely inside disposable tmpfs, then run the revision probe in the
            # same container. Production volumes remain mounted read-only.
            echo "Preparing exact candidate dependencies and checking historical master revisions read-only."
            docker run --rm --read-only \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,exec,nosuid,nodev,size=768m \
              --volumes-from "$server":ro \
              -v "$work/packages/report-engine:/candidate:ro" \
              --env-file .env.production \
              -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
              --entrypoint /bin/sh "$image" \
              -ec '/opt/report-env/bin/python -m pip install --quiet --no-cache-dir --target /tmp/candidate-deps "openpyxl>=3.1.5,<4" &&
                   export PYTHONPATH=/candidate/src:/tmp/candidate-deps &&
                   exec /opt/report-env/bin/python -m procurement_engine.cli probe-master-revisions \
                     --registry /app/packages/server/data/reports/inputs/registry.json \
                     --ledger /app/packages/server/data/reports/inputs/ledger.json'
