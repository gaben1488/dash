name: Owner-approved UD source refresh receipt

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  refresh-ud:
    if: >-
      github.event.label.name == 'maintenance: ud-source-refresh' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 79 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Refresh the already deployed runtime and read back UD numbering
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 14m
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/aemr/dash/deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            docker compose --env-file .env.production exec -T server node - <<'NODE'
            const base = 'http://127.0.0.1:3000';
            const key = process.env.AEMR_API_KEY;
            if (!key) throw new Error('INSTALLED_RUNTIME_API_AUTH_NOT_CONFIGURED');
            const headers = { authorization: `Bearer ${key}` };
            const read = async (method, path) => {
              const res = await fetch(base + path, { method, headers, signal: AbortSignal.timeout(540000) });
              if (!res.ok) throw new Error(`RUNTIME_API_${method}_${res.status}`);
              return await res.json();
            };
            (async () => {
              const health = await fetch(base + '/api/health', {signal: AbortSignal.timeout(15000)});
              if (!health.ok) throw new Error('INSTALLED_RUNTIME_NOT_HEALTHY');
              const refresh = await read('POST', '/api/refresh?formulas=true');
              const departments = (refresh.sources || []).filter(s => s.type === 'department');
              if (!refresh.success || departments.length !== 8 || departments.some(s => !s.loaded)) {
                throw new Error('SOURCE_REFRESH_INCOMPLETE');
              }
              const ud = departments.find(s => s.name === 'УД');
              if (!ud || !ud.rowCount) throw new Error('UD_SOURCE_UNAVAILABLE');
              const dashboard = await read('GET', '/api/dashboard?compact=1');
              const snapshot = dashboard.snapshot;
              if (!snapshot || !Array.isArray(snapshot.issues)) throw new Error('NO_CURRENT_SNAPSHOT_ISSUES');
              const currentNumbering = snapshot.issues.filter(issue =>
                (issue.category === 'row_numbering' || issue.checkId === 'row_numbering') &&
                (issue.departmentId === 'ud' || issue.sheet === 'УД') &&
                issue.status !== 'false_positive' && issue.status !== 'resolved'
              );
              console.log(JSON.stringify({
                result: currentNumbering.length === 0 ? 'UD_NUMBERING_PASS' : 'UD_NUMBERING_FAIL',
                source: 'УД',
                source_read: true,
                source_row_count: ud.rowCount,
                snapshot_id: snapshot.id,
                snapshot_at: snapshot.createdAt,
                numbering_open: currentNumbering.length,
                changed_google_sheets: false,
                restarted_services: false,
              }));
              if (currentNumbering.length > 0) process.exitCode = 2;
            })().catch(err => { console.error(String(err.message || err).slice(0,160)); process.exitCode = 1; });
            NODE
