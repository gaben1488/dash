name: Report root-cause evidence
on:
  push:
    branches: [codex/report-root-causes-and-actions]
    paths: [.github/workflows/report-root-cause-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            cd /home/aemr/dash
            candidate='${{ github.sha }}'
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d /tmp/report-inspect.XXXXXX)
            trap 'rm -rf "$work"' EXIT
            git show "$candidate:.github/report-root-cause-inspect.py" > "$work/root_probe.py"
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=256m \
              --volumes-from "$server":ro \
              -v "$work:/probe:ro" \
              --entrypoint /opt/report-env/bin/python "$image" /probe/root_probe.py
