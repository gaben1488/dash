name: Report archive candidate verification
on:
  push:
    branches: [codex/report-root-causes-and-actions]
    paths: [.github/workflows/report-archive-candidate.yml]
permissions:
  contents: write
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact public source patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,subprocess
          from urllib.request import Request,urlopen
          def blob(sha):
              request=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urlopen(request,timeout=40) as response: result=json.load(response)
              assert result['sha']==sha and result['encoding']=='base64'
              return base64.b64decode(''.join(result['content'].split()),validate=True)
          parts=['735e4132362184a710289ddffdba0b131e295357','1f5130e5035acbc16ee7693f68b22a4981f4bef0','61856537d34a4bbe453419bdbe05f13e83e94838']
          for data,expected in [(b''.join(blob(sha) for sha in parts),'0f866c25cabd3250b6cbf87657210ac8feb5d777c72043218ab2c7643624e609'),(blob('b8ed22b0b7cb8c3affc2668ca12c11cbfdcc74ee'),'3b669761640e63deacad9d34e2999fbb1d87f16d3c1cd62efb464312120ad2ad')]:
              assert hashlib.sha256(data).hexdigest()==expected
              patch=lzma.decompress(data)
              subprocess.run(['git','apply','--check','-'],input=patch,check=True)
              subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Python and publication tests
        run: |
          python -m pip install -e 'packages/report-engine[test]'
          python -m ruff check packages/report-engine
          git diff --check
          mkdir -p evidence
          python -m pytest packages/report-engine/tests -q --junitxml=evidence/python-tests.xml
      - name: Application verification
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm -r test
          pnpm build
      - name: Store verified source tree without moving production refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from urllib.request import Request,urlopen
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          names.discard('evidence/python-tests.xml')
          assert len(names)==28, sorted(names)
          hashes={};entries=[]
          for name in sorted(names):
              assert name.startswith(('packages/report-engine/','packages/server/','packages/web/','packages/shared/','docs/decisions/')),name
              path=Path(name);assert path.is_file() and not path.is_symlink()
              content=path.read_bytes();hashes[name]=hashlib.sha256(content).hexdigest()
              entries.append({'path':name,'mode':'100644','type':'blob','content':content.decode('utf-8')})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',data=json.dumps({'base_tree':base,'tree':entries}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urlopen(request,timeout=60) as response: tree=json.load(response)['sha']
          subprocess.run(['git','add','--',*sorted(names)],check=True)
          assert tree==subprocess.check_output(['git','write-tree'],text=True).strip()
          Path('evidence/CANDIDATE_TREE.txt').write_text(tree+'\n')
          Path('evidence/SOURCE_SHA256.json').write_text(json.dumps(hashes,indent=2))
          print('CANDIDATE_TREE_SHA='+tree)
          with Path('evidence/source.tar.gz').open('wb') as out:
              subprocess.run(['git','archive','--format=tar.gz','--prefix=dash/',tree],stdout=out,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-archive-candidate-${{ github.sha }}
          path: evidence/
          retention-days: 3
          if-no-files-found: warn
