name: Source deep-check regression

on:
  pull_request:
    branches: [main, codex/dash-audit-integrated-20261010]
    paths:
      - 'packages/shared/src/sequence-integrity.ts'
      - 'packages/shared/src/sequence-integrity.test.ts'
      - 'packages/shared/src/rule-book.ts'
      - 'packages/core/src/pipeline/classify.ts'
      - 'packages/core/src/pipeline/classify.test.ts'
      - 'packages/core/src/pipeline/row-numbering.test.ts'
      - 'packages/core/src/pipeline/formula-integrity.ts'
      - 'packages/core/src/pipeline/formula-integrity.test.ts'
      - 'packages/server/src/routes/source-integrity.ts'
      - 'packages/server/src/routes/source-integrity.test.ts'
      - 'packages/server/src/services/metadata-watch.ts'
      - 'packages/server/src/services/source-refresh.ts'
      - 'packages/web/src/api.ts'
      - 'packages/web/src/pages/Settings.tsx'
      - 'packages/web/src/pages/Settings.deep-check.test.tsx'
      - '.github/workflows/source-deep-check.yml'

permissions:
  contents: read

jobs:
  deep-check:
    name: Source integrity API and UI (no Google requests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript source integrity
        run: pnpm typecheck
      - name: Composite procurement identities, classification and numbering
        run: |
          pnpm --filter @aemr/shared exec vitest run src/sequence-integrity.test.ts
          pnpm --filter @aemr/core exec vitest run src/pipeline/classify.test.ts src/pipeline/row-numbering.test.ts
      - name: Core formula header boundary regression
        run: pnpm --filter @aemr/core exec vitest run src/pipeline/formula-integrity.test.ts
      - name: API deep-check regression
        run: pnpm --filter @aemr/server exec vitest run src/routes/source-integrity.test.ts
      - name: Sources button regression
        run: pnpm --filter @aemr/web exec vitest run src/pages/Settings.deep-check.test.tsx
