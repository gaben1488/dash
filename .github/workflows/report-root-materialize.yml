name: Materialize reviewed report candidate
on:
  push:
    branches: [codex/report-root-causes]
    paths: [.github/workflows/report-root-materialize.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply checksum-pinned public source patch
        env:
          PATCH_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7f88-81f4-a489-7adc7fd5d777/raw?se=2026-09-30T13%3A39%3A51Z&sp=r&sv=2026-02-06&sr=b&scid=0310157f-0d5d-59a7-9328-18f4a92abd64&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-30T09%3A38%3A34Z&ske=2026-10-01T09%3A38%3A34Z&sks=b&skv=2026-02-06&sig=RnJI/EUb9zo3OC6jxJnayKUkXaH%2BEjOyx8byR39c5Z4%3D'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 90 "$PATCH_URL" -o /tmp/source.patch.gz
          echo 'f324b905e787b96700934b2b1b0ea1b2a42b0333d5cccec86e4c1a8fcf884ca9  /tmp/source.patch.gz' | sha256sum -c -
          gzip -dc /tmp/source.patch.gz > /tmp/source.patch
          echo 'a127276234bb38a6dc2e1385dda45b2f98009f756ba01371b1bf336c8a09baf1  /tmp/source.patch' | sha256sum -c -
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
          # GITHUB_TOKEN cannot write workflows. Connector applies/removes those separately.
          git restore --source=HEAD --staged --worktree .github
          mkdir -p /tmp/evidence
      - name: Record candidate tree without moving any branch (not acceptance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          subprocess.run(['git', 'add', '-A'], check=True)
          names = subprocess.check_output(['git','diff','--cached','--name-only','HEAD'],text=True).splitlines()
          allowed = ('packages/report-engine/', 'packages/shared/', 'packages/web/', 'docs/decisions/')
          assert names and all(name.startswith(allowed) for name in names)
          entries = []
          for name in names:
              path = Path(name)
              assert not path.is_symlink()
              item = {'path':name, 'mode':'100644', 'type':'blob'}
              if path.exists(): item['content'] = path.read_text()
              else: item['sha'] = None
              entries.append(item)
          base = subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request = Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees',
              data=json.dumps({'base_tree':base,'tree':entries}).encode(), method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urlopen(request,timeout=60) as response: tree = json.load(response)['sha']
          local = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == local, (tree, local)
          Path('/tmp/evidence/TREE.txt').write_text(tree+'\n')
          print('CANDIDATE_TREE=' + tree)
          with Path('/tmp/evidence/public-source.tar.gz').open('wb') as output:
              subprocess.run(['git','archive','--format=tar.gz','--prefix=dash/',tree],stdout=output,check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Python verification
        run: |
          python -m pip install -e 'packages/report-engine[test]' > /tmp/evidence/python-install.log 2>&1
          python -m ruff check packages/report-engine
          python -m pytest packages/report-engine/tests -q --junitxml=/tmp/evidence/python-tests.xml > /tmp/evidence/python-tests.log 2>&1 || { tail -50 /tmp/evidence/python-tests.log; exit 1; }
          tail -3 /tmp/evidence/python-tests.log
      - name: Application verification
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile > /tmp/evidence/install.log 2>&1
          pnpm lint > /tmp/evidence/lint.log 2>&1 || { tail -30 /tmp/evidence/lint.log; exit 1; }
          pnpm typecheck > /tmp/evidence/typecheck.log 2>&1 || { tail -40 /tmp/evidence/typecheck.log; exit 1; }
          pnpm -r test > /tmp/evidence/app-tests.log 2>&1 || { tail -80 /tmp/evidence/app-tests.log; exit 1; }
          pnpm build > /tmp/evidence/build.log 2>&1 || { tail -30 /tmp/evidence/build.log; exit 1; }
          git diff --check
          echo 'Application verification passed.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-candidate-evidence
          path: /tmp/evidence/
          retention-days: 7
          if-no-files-found: error
