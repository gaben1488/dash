name: CI

on:
  push:
    branches: [codex/release-observe-20261015]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [metadata, browser, proof-recovery, transport-probe, continue-check, continue-release, fresh-release, weekly-stage, monitoring-preview, registry-proof, registry-apply, api-timing, worker-observe]
        default: metadata
        description: "Read-only operational metadata or authenticated real-domain browser"
      release_sha:
        description: "Exact 40-character main SHA to release"
        type: string
        required: true
      backup_root:
        description: "Absolute private backup directory outside repository and server_data"
        type: string
        required: true
      backup_name:
        description: "Previously verified immutable backup name in that directory"
        type: string
        required: true

permissions:
  contents: read
  actions: read
jobs:
  weekly-preview:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == 'Preview weekly retention for accepted 43f10742' ||
       github.event.head_commit.message == 'Prepare identity copy for accepted 43f10742' ||
       github.event.head_commit.message == 'Apply prepared identity metadata for accepted 43f10742' ||
       github.event.head_commit.message == 'Apply weekly retention for accepted 43f10742' ||
       github.event.head_commit.message == 'Verify retained publications for accepted 43f10742' ||
       github.event.head_commit.message == 'Finalize reviewed publications for accepted 43f10742' ||
       github.event.head_commit.message == 'Verify finalized publications for accepted 43f10742')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Bind reviewed read-only operator
        run: |
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          body=Path('.github/ci/weekly_publication_operator.py').read_bytes()
          assert len(body)<=40960
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('WEEKLY_CODE='+base64.b64encode(body).decode()+'\n')
              target.write('WEEKLY_SHA='+hashlib.sha256(body).hexdigest()+'\n')
              check=Path('.github/ci/weekly_publication_readback.py').read_bytes();assert len(check)<=16384
              target.write('WEEKLY_READBACK_CODE='+base64.b64encode(check).decode()+'\n')
              target.write('WEEKLY_READBACK_SHA='+hashlib.sha256(check).hexdigest()+'\n')
          PY
      - name: Verify exact runtime and perform the explicitly selected metadata operation
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEEKLY_CODE: ${{ env.WEEKLY_CODE }}
          WEEKLY_SHA: ${{ env.WEEKLY_SHA }}
          WEEKLY_READBACK_CODE: ${{ env.WEEKLY_READBACK_CODE }}
          WEEKLY_READBACK_SHA: ${{ env.WEEKLY_READBACK_SHA }}
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: WEEKLY_CODE,WEEKLY_SHA,WEEKLY_READBACK_CODE,WEEKLY_READBACK_SHA
          command_timeout: 16m
          script: |
            set -euo pipefail
            sudo -n --preserve-env=WEEKLY_CODE,WEEKLY_SHA,WEEKLY_READBACK_CODE,WEEKLY_READBACK_SHA python3 -IB - <<'PY'
            import base64,hashlib,json,os,re,shutil,stat,subprocess
            from pathlib import Path
            def reviewed_finalize_token(proof):
                assert set(proof)=={'runtime_source','tool_source','plan_revision','readback_source_sha256','operator_run','result'}
                assert proof['runtime_source']=='43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
                assert proof['tool_source']=='268f9e5a15fe5345c04b69c8163ae7ac3fe55801'
                assert proof['operator_run']=='38901759065'
                assert proof['readback_source_sha256']=='10bb2caaaeef07757de7804fbb82ff3f8a8af7a5c5153c35174fe56cdf1cbb1d'
                revision='a9b010a8710e97634231f0beeb0086b7cf5986997dc91a598c67bf1af423db03'
                assert proof['plan_revision']==revision
                result=proof['result']
                assert set(result)=={'status','verified_roots','compacted_roots','protected_roots','word_artifacts','dashboard_artifacts','original_catalog_equivalent','journal_sha256','marker_sha256'}
                assert result['status']=='RETAINED_STATE_VERIFIED' and result['original_catalog_equivalent'] is True
                expected={'verified_roots':99,'compacted_roots':92,'protected_roots':7,'word_artifacts':297,'dashboard_artifacts':99}
                assert all(type(result[k]) is int and result[k]==v for k,v in expected.items())
                assert all(isinstance(result[k],str) and re.fullmatch('[a-f0-9]{64}',result[k]) for k in ('journal_sha256','marker_sha256'))
                return '83b813ab250b4533d1b80ba9e306afaa8bc5f383:'+revision+':'+result['journal_sha256']+':'+result['marker_sha256']
            def load_reviewed_finalize_token():
                proof_path=Path('/root/codex-fixes/weekly-38895891036/retained-readback-38901759065.json')
                for parent in proof_path.parents:
                    info=parent.lstat();assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
                with os.fdopen(os.open(proof_path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as stream:
                    info=os.fstat(stream.fileno())
                    assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=8192
                    return reviewed_finalize_token(json.load(stream))
            run='${{ github.run_id }}';assert run.isdigit()
            mode='${{ github.event.head_commit.message == 'Prepare identity copy for accepted 43f10742' && 'identity' || github.event.head_commit.message == 'Apply prepared identity metadata for accepted 43f10742' && 'identity-apply' || github.event.head_commit.message == 'Apply weekly retention for accepted 43f10742' && 'compaction-apply' || github.event.head_commit.message == 'Verify retained publications for accepted 43f10742' && 'readback' || github.event.head_commit.message == 'Finalize reviewed publications for accepted 43f10742' && 'finalize' || github.event.head_commit.message == 'Verify finalized publications for accepted 43f10742' && 'finalized-readback' || 'plan' }}'
            root=Path('/root/codex-fixes')/('weekly-check-'+run)
            root.mkdir(mode=0o700);os.umask(0o077)
            body=base64.b64decode(os.environ['WEEKLY_CODE'],validate=True)
            assert len(body)<=40960 and hashlib.sha256(body).hexdigest()==os.environ['WEEKLY_SHA']
            path=root/'operator.py';path.write_bytes(body);path.chmod(0o600)
            check=base64.b64decode(os.environ['WEEKLY_READBACK_CODE'],validate=True)
            assert len(check)<=16384 and hashlib.sha256(check).hexdigest()==os.environ['WEEKLY_READBACK_SHA']
            readback=root/'readback.py';readback.write_bytes(check);readback.chmod(0o600)
            stage=Path('/root/codex-fixes/weekly-38902081199')
            python=stage/'venv/bin/python'
            probe='import sysconfig;print(sysconfig.get_path("purelib"))'
            site=subprocess.check_output([str(python),'-IB','-c',probe],timeout=15,text=True).strip()
            assert re.fullmatch(re.escape(str(stage))+r'/venv/lib/python[0-9.]+/site-packages',site)
            unit='aemr-weekly-compaction-'+run+'.service'
            command=['systemd-run','--quiet','--wait','--unit',unit,'--property','Type=exec',
                '--property','KillMode=process','--property','ExitType=cgroup','--property','UMask=0077',
                '--property','RuntimeMaxSec=900','--property','TimeoutStopSec=10',
                '--property','MemoryMax=1G','--property','MemorySwapMax=256M','--property','CPUQuota=40%',
                '--property','Nice=19','--property','StandardOutput=append:'+str(root/'operator.log'),
                '--property','StandardError=append:'+str(root/'operator.log'),
                str(python),'-IB',str(path),'--operator-run',run,'--tree',str(stage/'source'),
                '--python',str(python),'--reader-package',site+'/procurement_engine',
                '--ci-evidence',str(stage/'ci.json'),'--source-receipt',str(stage/'source-receipt.json'),
                '--worker-acceptance','/var/lib/aemr/worker-quarantine/acceptance-38860353565-1/result.json',
                '--backup-reference','worker-38831492016/backup','--operation','apply','--expected-revision','live','--check']
            if mode in {'compaction-apply','finalize'}:
                # Measured361 CPU seconds exhausted900s at the old0.4 quota.
                # Low weight/nice preserve API priority; do not extend runtime.
                command[command.index('CPUQuota=40%')]='CPUQuota=100%'
                command[command.index(str(python)):command.index(str(python))]=['--property','CPUWeight=10']
            if mode in {'compaction-apply','readback','finalized-readback'}:
                # Bind only after successful private plan and independent review.
                revision='a9b010a8710e97634231f0beeb0086b7cf5986997dc91a598c67bf1af423db03'
                assert re.fullmatch('[a-f0-9]{64}',revision)
                if mode=='compaction-apply':command.remove('--check')
                else:command+=['--retained-readback',str(readback)]
                command[command.index('--expected-revision')+1]=revision
                if mode=='finalized-readback':command.append('--finalized-readback')
            if mode=='finalize':
                # Independent proof remains at its original268 stage; its source
                # is never relabelled as the new83 finalizer.
                token=load_reviewed_finalize_token()
                command.remove('--check')
                command[command.index('--operation')+1]='finalize'
                command[command.index('--expected-revision')+1]=token.split(':')[1]
                command+=['--finalize-review',token]
            if mode=='identity':command.append('--identity-copy')
            if mode=='identity-apply':command.remove('--check');command.append('--identity-apply')
            if mode=='finalized-readback':load_reviewed_finalize_token()
            free_before=shutil.disk_usage(root).free
            result=subprocess.run(command,capture_output=True,timeout=920,check=False)
            if mode=='finalize':print(json.dumps({'storage_free_before':free_before,'storage_free_after':shutil.disk_usage(root).free}))
            for line in (root/'operator.log').read_text().splitlines():
                if line in {'HOST_NATIVE_PREFLIGHT_PASS_NO_COMPACTION','HOST_NATIVE_PREFLIGHT_PASS','WEEKLY_OPERATOR_BLOCKED',
                            'IDENTITY_COPY_PREPARATION_PASS_NO_PRIMARY_WRITES','EXISTING_NATIVE_COMPACTION_AND_RECOVERY_COMPLETE','RETAINED_STATE_READBACK_PASS'}:
                    print(line)
                elif line.startswith('{'):
                    try:value=json.loads(line)
                    except ValueError:continue
                    keys={'catalog_revision','publication_count','keep_count','retire_count','bytes_reclaimable'}
                    if set(value)==keys and re.fullmatch('[a-f0-9]{64}',value['catalog_revision']):print(json.dumps(value,sort_keys=True))
                    readback_keys={'status','verified_roots','compacted_roots','protected_roots','word_artifacts','dashboard_artifacts','original_catalog_equivalent'}
                    if set(value)==readback_keys and value['status']=='RETAINED_STATE_VERIFIED':print(json.dumps(value,sort_keys=True))
                    post_keys=(readback_keys-{'original_catalog_equivalent'})|{'retained_files_verified'}
                    if set(value)==post_keys and value['status']=='FINALIZED_RETAINED_STATE_VERIFIED':print(json.dumps(value,sort_keys=True))
                    final_keys={'status','quarantine_bytes_reclaimed','quarantine_logical_bytes_retired','quarantine_reclaim_basis'}
                    if set(value)==final_keys and value['status']=='FINALIZED':print(json.dumps(value,sort_keys=True))
                    identity_keys={'identity_copy_preparation','snapshots','updated_observations','updated_fields',
                                   'protected_data_unchanged','protected_digest'}
                    if set(value)==identity_keys and value['identity_copy_preparation']=='PASS':print(json.dumps(value,sort_keys=True))
                    if set(value)=={'identity_metadata_apply'} and set(value['identity_metadata_apply'])=={'updated_observations','updated_fields','verified_observations'}:print(json.dumps(value,sort_keys=True))
            for role in ('MemoryPeak','Result','ExecMainStatus'):
                value=subprocess.check_output(['systemctl','show',unit,'--property='+role,'--value'],timeout=10,text=True).strip()
                if re.fullmatch('[a-z0-9-]+',value):print(json.dumps({'unit_property':role,'value':value}))
            prefix={'identity-apply':'IDENTITY_METADATA_APPLY','compaction-apply':'REVERSIBLE_WEEKLY_COMPACTION','readback':'INDEPENDENT_RETAINED_READBACK','finalize':'REVIEWED_PUBLICATION_FINALIZE','finalized-readback':'FINALIZED_RETAINED_READBACK'}.get(mode,'READ_ONLY_WEEKLY_PREFLIGHT')
            print(prefix+'_PASS' if result.returncode==0 else prefix+'_FAILED')
            raise SystemExit(0 if result.returncode==0 else 2)
            PY
  unused-images:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == 'Plan unused image retirement for accepted 43f10742' ||
       github.event.head_commit.message == 'Apply unused image retirement for accepted 43f10742')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Bind reviewed image retention code
        run: |
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          body=Path('.github/ci/unused_image_retention.py').read_bytes()
          assert len(body)<=24576
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('IMAGE_RETENTION_CODE='+base64.b64encode(body).decode()+'\n')
              target.write('IMAGE_RETENTION_SHA='+hashlib.sha256(body).hexdigest()+'\n')
          PY
      - name: Check exact sampled image IDs and all retained runtime references
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_RETENTION_CODE: ${{ env.IMAGE_RETENTION_CODE }}
          IMAGE_RETENTION_SHA: ${{ env.IMAGE_RETENTION_SHA }}
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_RETENTION_CODE,IMAGE_RETENTION_SHA
          command_timeout: 4m
          script: |
            set -euo pipefail
            sudo -n --preserve-env=IMAGE_RETENTION_CODE,IMAGE_RETENTION_SHA python3 -IB - <<'PY'
            import base64,hashlib,os,sys
            body=base64.b64decode(os.environ['IMAGE_RETENTION_CODE'],validate=True)
            assert len(body)<=24576 and hashlib.sha256(body).hexdigest()==os.environ['IMAGE_RETENTION_SHA']
            sys.argv=['-', '${{ github.event.head_commit.message == 'Apply unused image retirement for accepted 43f10742' && 'apply' || 'plan' }}']
            exec(compile(body,'<reviewed-image-retention>','exec'),{'__name__':'__main__'})
            PY
  source-drift:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == 'Inspect exact source drift for accepted 43f10742' ||
       github.event.head_commit.message == 'Inspect weekly formula closure for accepted 43f10742' ||
       github.event.head_commit.message == 'Inspect snapshot stages for accepted 43f10742' ||
       github.event.head_commit.message == 'Compare scoped retention for accepted 43f10742' ||
       github.event.head_commit.message == 'Prove streamed plan revision for accepted 43f10742' ||
       github.event.head_commit.message == 'Inspect exact signature gaps for accepted 43f10742' ||
       github.event.head_commit.message == 'Inspect backup root coverage for accepted 43f10742')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bind public diagnostic source
        env:
          REVISION_PROBE: ${{ github.event.head_commit.message == 'Prove streamed plan revision for accepted 43f10742' || github.event.head_commit.message == 'Inspect exact signature gaps for accepted 43f10742' || github.event.head_commit.message == 'Inspect backup root coverage for accepted 43f10742' }}
        run: |
          python - <<'PY'
          import ast,base64,hashlib,os,subprocess
          from pathlib import Path
          body=Path('.github/ci/source_drift_probe.py').read_bytes()
          if os.environ['REVISION_PROBE']=='true':
              sha='1666a09205ef0e70b521b728aabef685ca1c2730'
              subprocess.run(['git','fetch','--quiet','origin',sha],check=True,capture_output=True)
              source=subprocess.check_output(['git','show',sha+':packages/report-engine/src/procurement_engine/retention.py']).decode()
              functions=[node for node in ast.parse(source).body if isinstance(node,ast.FunctionDef) and node.name=='_catalog_revision']
              assert len(functions)==1
              body=ast.get_source_segment(source,functions[0]).encode()+b'\n'+Path('.github/ci/publication_revision_probe.py').read_bytes()
          assert len(body)<=20480
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('DRIFT_PROBE='+base64.b64encode(body).decode()+'\n')
              target.write('DRIFT_PROBE_SHA='+hashlib.sha256(body).hexdigest()+'\n')
          PY
      - name: Read frozen and live input comparisons without changing runtime
        uses: appleboy/ssh-action@v1.2.0
        env:
          DRIFT_PROBE: ${{ env.DRIFT_PROBE }}
          DRIFT_PROBE_SHA: ${{ env.DRIFT_PROBE_SHA }}
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DRIFT_PROBE,DRIFT_PROBE_SHA
          command_timeout: 4m
          script: |
            set -euo pipefail
            sudo -n --preserve-env=DRIFT_PROBE,DRIFT_PROBE_SHA python3 -IB - <<'PY'
            import base64,hashlib,json,os,re,stat,subprocess
            from pathlib import Path
            record=json.loads(subprocess.check_output(['docker','inspect','aemr-server-1'],timeout=15))[0]
            assert record['Image']=='sha256:e5d8535fd30b9624cf0b3791cab447e326effe16fb847300837bc2e21024ec0d'
            assert record['State']['Status']=='running' and record['State']['Health']['Status']=='healthy'
            body=base64.b64decode(os.environ['DRIFT_PROBE'],validate=True)
            assert len(body)<=20480 and hashlib.sha256(body).hexdigest()==os.environ['DRIFT_PROBE_SHA']
            mode='${{ github.event.head_commit.message == 'Inspect weekly formula closure for accepted 43f10742' && 'weekly' || github.event.head_commit.message == 'Inspect snapshot stages for accepted 43f10742' && 'snapshot' || github.event.head_commit.message == 'Compare scoped retention for accepted 43f10742' && 'retention' || github.event.head_commit.message == 'Prove streamed plan revision for accepted 43f10742' && 'revision' || github.event.head_commit.message == 'Inspect exact signature gaps for accepted 43f10742' && 'identity' || github.event.head_commit.message == 'Inspect backup root coverage for accepted 43f10742' && 'coverage' || 'f20d108be83441189c665b5eca3fe7e1' }}'
            assert mode in {'weekly','snapshot','retention','revision','identity','coverage','f20d108be83441189c665b5eca3fe7e1'}
            command=['docker','exec','-i','--user','1000:1000',record['Id'],'/usr/bin/timeout']
            if mode in {'weekly','snapshot','retention','revision','identity','coverage'}:
                mounts=[m for m in record['Mounts'] if m['Type']=='volume' and m['Destination']=='/app/packages/server/data']
                assert len(mounts)==1 and re.fullmatch('[A-Za-z0-9_.-]+',mounts[0]['Name'])
                # Full frozen dependency validation is isolated from the live
                # API cgroup. It cannot write state or consume unbounded RAM.
                command=['docker','run','--rm','-i','--network','none','--read-only','--memory','768m',
                    '--memory-swap','768m','--cpus','0.5','--pids-limit','64','--user','1000:1000',
                    '--mount','type=volume,src='+mounts[0]['Name']+',dst=/app/packages/server/data,readonly',
                    '--entrypoint','/usr/bin/timeout',record['Image']]
                if mode in {'revision','identity','coverage'}:
                    reference=Path('/root/codex-fixes/weekly-38881380220/retention-plan-38884224354.json')
                    info=reference.lstat()
                    assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=1024*1024
                    original=json.loads(reference.read_bytes())
                    root=Path('/root/codex-fixes/revision-probe-${{ github.run_id }}')
                    os.umask(0o077);root.mkdir(mode=0o700)
                    private=root/'reference.json'
                    private.write_text(json.dumps({k:original[k] for k in ('keep_release_ids','retire_release_ids','catalog_revision')}))
                    private.chmod(0o400);os.chown(private,1000,1000)
                    command[-1:-1]=['--mount','type=bind,src='+str(private)+',dst=/reference.json,readonly']
                    if mode=='coverage':
                        saved=Path('/home/aemr/.dash-private-backups/worker-38831492016/backup/manifest.json')
                        assert not any(p.is_symlink() for p in (saved,*saved.parents))
                        info=saved.stat();assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=16*1024*1024
                        raw=saved.read_bytes();assert hashlib.sha256(raw).hexdigest()=='4e6cdf147150e362425973f9c831763d429c64f5b677cfe0b2c5dc6ce2767588'
                        copy=root/'backup-manifest.json';copy.write_bytes(raw);copy.chmod(0o400);os.chown(copy,1000,1000)
                        command[-1:-1]=['--mount','type=bind,src='+str(copy)+',dst=/backup-manifest.json,readonly']
            result=subprocess.run([*command,'-k','5s','175s','/opt/report-env/bin/python','-IB','-',mode],input=body,capture_output=True,timeout=190,check=False)
            assert len(result.stdout)<=32768
            # The trusted script emits only fixed keys, booleans, counts and coordinates.
            for line in result.stdout.splitlines():
                value=json.loads(line)
                if mode=='identity':
                    (root/'private-result.json').write_bytes(result.stdout)
                    (root/'private-result.json').chmod(0o600)
                    value.pop('private_signature_gaps',None)
                print(json.dumps(value),flush=True)
            if result.returncode:
                names={'AssertionError','PermissionError','FileNotFoundError','KeyError','TypeError','ImportError','ModuleNotFoundError','ValueError'}
                errors=sorted(set(re.findall(rb'^([A-Za-z]+Error):',result.stderr,re.M)))
                print(json.dumps({'source_drift_probe_failed':True,'native_exit':result.returncode,
                    'exception_types':[item.decode() for item in errors if item.decode() in names]}),flush=True)
                raise SystemExit(2)
            PY
  weekly-stage:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly-stage' &&
        inputs.release_sha == '43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa') ||
       (github.event_name == 'push' && github.event.head_commit.message == 'Stage weekly tools for accepted 43f10742'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: weekly-public-code-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact public code and isolated host dependencies only
        env:
          VPS_USER: ${{ secrets.DEPLOY_USER }}
          VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/weekly-stage.XXXXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' SOURCE_CI > "$private/phase"
          cat > "$private/stage.sh" <<'SHSTAGE'
          set -euo pipefail
          private=$1
            candidate=83b813ab250b4533d1b80ba9e306afaa8bc5f383
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
            root="/root/codex-fixes/weekly-$GITHUB_RUN_ID"
            # Green maintenance source is separate from installed43. The host
