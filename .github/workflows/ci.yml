name: CI

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [metadata, browser, proof-recovery, transport-probe, continue-check, continue-release, fresh-release, weekly-stage]
        default: metadata
        description: "Read-only operational metadata or authenticated real-domain browser"
      release_sha:
        description: "Exact 40-character main SHA to release"
        type: string
        required: true
      backup_root:
        description: "Absolute private backup directory outside repository and server_data"
        type: string
        required: true
      backup_name:
        description: "Previously verified immutable backup name in that directory"
        type: string
        required: true

permissions:
  contents: read
  actions: read
jobs:
  weekly-stage:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' && inputs.mode == 'weekly-stage' &&
      inputs.release_sha == '43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: weekly-public-code-stage
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact public code and isolated host dependencies only
        env:
          VPS_USER: ${{ secrets.DEPLOY_USER }}
          VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/weekly-stage.XXXXXXXX")
          trap 'rm -rf -- "$private"' EXIT
          printf '%s\n' SOURCE_CI > "$private/phase"
          cat > "$private/stage.sh" <<'SHSTAGE'
          set -euo pipefail
          private=$1
            candidate=43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
            root="/root/codex-fixes/weekly-$GITHUB_RUN_ID"
            test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$candidate"
            git fetch --quiet origin "$candidate"
            ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$candidate&event=pull_request" \
              --jq '.workflow_runs | map(select(.name == "CI")) | first | .id // empty')
            test -n "$ci_run"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" > "$private/ci.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$private/jobs.json"
            git show "$candidate:.github/ci/source_ci_gate.py" > "$private/source_ci_gate.py"
            python3 - "$private" <<'PYSOURCECI' | python3 "$private/source_ci_gate.py" "$candidate"
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          print(json.dumps({'run':json.loads((root/'ci.json').read_text()),'jobs':json.loads((root/'jobs.json').read_text())['jobs']}))
          PYSOURCECI
            printf '%s\n' PACKAGE > "$private/phase"
            git -c tar.umask=0077 archive "$candidate" packages/report-engine \
              deploy/plan-weekly-publications.py deploy/stateful_backup.py > "$private/source.tar"
            python3 - "$candidate" <<'PYHASHES' > "$private/source-hashes.json"
          import hashlib,json,subprocess,sys
          sha=sys.argv[1]
          paths=['packages/report-engine/src/procurement_engine','deploy/plan-weekly-publications.py','deploy/stateful_backup.py']
          names=subprocess.check_output(['git','ls-tree','-r','--name-only',sha,'--',*paths],text=True).splitlines()
          print(json.dumps({'candidate':sha,'hashes':{name:hashlib.sha256(subprocess.check_output(['git','show',sha+':'+name])).hexdigest() for name in names if name.endswith('.py')}}))
          PYHASHES
            cp .github/ci/weekly_publication_operator.py "$private/weekly_publication_operator.py"
            cat > "$private/setup.sh" <<'SHSETUP'
          set -euo pipefail
          umask 077
          root=$1
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin TMPDIR="$root/tmp" PYTHONDONTWRITEBYTECODE=1
          printf '%s\n' HOST_SETUP > "$root/setup.phase"
          mkdir -m 700 "$root/source" "$TMPDIR"
          python3 -IB - "$root" <<'PYEXTRACT'
          import shutil,sys,tarfile
          from pathlib import Path
          root=Path(sys.argv[1])
          assert shutil.disk_usage(root).free>=1536*1024**2
          with tarfile.open(root/'source.tar') as archive:
              for item in archive.getmembers():
                  name=item.name.rstrip('/')
                  assert not Path(name).is_absolute() and '..' not in Path(name).parts
                  assert name in {'packages','packages/report-engine','deploy','deploy/plan-weekly-publications.py','deploy/stateful_backup.py'} or name.startswith('packages/report-engine/')
                  assert item.isdir() or item.isfile()
                  item.mode&=0o700 if item.isdir() else 0o600
              archive.extractall(root/'source',filter='data')
          PYEXTRACT
          python3 -m venv --copies "$root/venv"
          "$root/venv/bin/python" -IB -m pip --isolated --disable-pip-version-check install \
            --no-cache-dir --no-compile --only-binary=:all: --retries 1 --timeout 15 \
            "$root/source/packages/report-engine"
          printf '%s\n' VERIFY > "$root/setup.phase"
          "$root/venv/bin/python" -IB "$root/verify.py" "$root"
          SHSETUP
            cat > "$private/verify.py" <<'PYVERIFY'
          import hashlib,importlib.util,json,stat,sys,sysconfig
          from pathlib import Path
          root=Path(sys.argv[1]);source=root/'source'
          expected=json.loads((root/'source-hashes.json').read_text())
          assert expected['candidate']=='43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
          def hashes(package):
              assert package.is_dir() and not package.is_symlink()
              assert not any(p.is_symlink() for p in package.rglob('*'))
              result={}
              for path in package.rglob('*.py'):
                  info=path.lstat()
                  assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
                  result[path.relative_to(package).as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
              return result
          prefix='packages/report-engine/src/procurement_engine/'
          original={prefix+name:value for name,value in hashes(source/prefix).items()}
          for name in ('deploy/plan-weekly-publications.py','deploy/stateful_backup.py'):
              original[name]=hashlib.sha256((source/name).read_bytes()).hexdigest()
          assert original==expected['hashes']
          installed=Path(sysconfig.get_path('purelib'))/'procurement_engine'
          assert hashes(installed)=={name[len(prefix):]:value for name,value in original.items() if name.startswith(prefix)}
          assert sum(p.lstat().st_blocks*512 for p in root.rglob('*') if p.is_file() and not p.is_symlink())<=256*1024**2
          # Native imports happen only after both actual source trees match.
          import procurement_engine.runtime
          import docx
          spec=importlib.util.spec_from_file_location('exact_public_planner',source/'deploy/plan-weekly-publications.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.verify_reader_compatibility(installed)
          print('STAGED_CODE_ONLY_NOT_ADMITTED')
          PYVERIFY
            tar -cf "$private/transport.tar" -C "$private" source.tar source-hashes.json \
              weekly_publication_operator.py setup.sh verify.py
            digest=$(sha256sum "$private/transport.tar" | cut -d' ' -f1)
            python3 - "$root" "$digest" <<'PYTRANSFER' > "$private/transfer-command"
          import shlex,sys
          program='''import hashlib,io,os,stat,sys,tarfile
          from pathlib import Path
          root=Path(sys.argv[1]);assert root.parent==Path('/root/codex-fixes') and root.name.startswith('weekly-') and root.name[7:].isdigit()
          for path in (root.parent,*root.parent.parents):
           info=path.lstat();assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
          body=sys.stdin.buffer.read(33554433);assert len(body)<=33554432 and hashlib.sha256(body).hexdigest()==sys.argv[2]
          os.umask(0o077);root.mkdir(mode=0o700)
          expected={'source.tar','source-hashes.json','weekly_publication_operator.py','setup.sh','verify.py'}
          with tarfile.open(fileobj=io.BytesIO(body)) as archive:
           items=archive.getmembers();assert len(items)==len(expected) and {m.name for m in items}==expected
           for item in items:
            assert item.isfile() and item.size<=33554432
            with os.fdopen(os.open(root/item.name,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600),'wb') as output:
             output.write(archive.extractfile(item).read());output.flush();os.fsync(output.fileno())
          fd=os.open(root/'setup.log',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600);os.close(fd)
          '''
          print(shlex.join(['sudo','-n','python3','-IB','-c',program,*sys.argv[1:]]))
          PYTRANSFER
            printf '%s\n' TRANSFER > "$private/phase"
            printf '%s\n' "$VPS_KEY" > "$private/key"
            ssh-keyscan -T 10 -H 193.233.91.162 > "$private/known_hosts" 2>/dev/null
            test -s "$private/known_hosts"
            remote() {
              ssh -i "$private/key" -o BatchMode=yes -o ConnectTimeout=15 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                -o UserKnownHostsFile="$private/known_hosts" -o StrictHostKeyChecking=yes \
                "$VPS_USER@193.233.91.162" "$@"
            }
            test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$candidate"
            remote "$(cat "$private/transfer-command")" < "$private/transport.tar"
            printf '%s\n' HOST_SETUP > "$private/phase"
            if ! remote sudo -n systemd-run --quiet --wait --collect --unit "aemr-weekly-stage-$GITHUB_RUN_ID" \
              --property Type=exec --property UMask=0077 --property RuntimeMaxSec=360 \
              --property TimeoutStopSec=10 --property MemoryMax=256M --property CPUQuota=40% --property Nice=19 \
              --property "StandardOutput=append:$root/setup.log" --property "StandardError=append:$root/setup.log" \
              /bin/bash "$root/setup.sh" "$root"; then
              host_phase=$(remote sudo -n head -c 32 "$root/setup.phase" 2>/dev/null || true)
              case "$host_phase" in HOST_SETUP|VERIFY) printf '%s\n' "$host_phase" > "$private/phase" ;; esac
              exit 2
            fi
            printf '%s\n' VERIFY > "$private/phase"
          SHSTAGE
          if ! bash "$private/stage.sh" "$private" > "$private/runner.log" 2>&1; then
            phase=$(head -c 32 "$private/phase" 2>/dev/null || true)
            case "$phase" in SOURCE_CI|PACKAGE|TRANSFER|HOST_SETUP|VERIFY) ;; *) phase=UNKNOWN ;; esac
            printf 'WEEKLY_PUBLIC_CODE_STAGE_FAILED_%s\n' "$phase"
            exit 2
          fi
          echo STAGED_CODE_ONLY_NOT_ADMITTED
  fresh-release:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' && inputs.mode == 'fresh-release' &&
      inputs.release_sha == '43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      RECOVERY_SHA: 43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa
      RECOVERY_RUN: ${{ github.run_id }}
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa
      - name: Admit exact current candidate before any maintenance
        run: |
          set -euo pipefail
          umask 077
          [[ "$RECOVERY_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RECOVERY_RUN" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$RECOVERY_SHA"
          mkdir -m 700 "$RUNNER_TEMP/release"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/release/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$RUNNER_TEMP/release/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/release/known_hosts"
          cat > "$RUNNER_TEMP/release/ssh.sh" <<'SH'
          remote() {
            ssh -i "$RUNNER_TEMP/release/key" -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o UserKnownHostsFile="$RUNNER_TEMP/release/known_hosts" -o StrictHostKeyChecking=yes \
              "$VPS_USER@193.233.91.162" "$@"
          }
          window() {
            if test "$1" = prepare; then
              remote "sudo -n bash -c '. /root/codex-fixes/release-$RECOVERY_RUN/deploy/maintenance-lock.sh; maintenance_lock_acquire 45 && exec bash -s -- \"\$@\"' release-window prepare $RECOVERY_SHA $RECOVERY_RUN /home/aemr/dash /home/aemr/.dash-private-backups --quiesce-worker --release-controller" \
                < deploy/report-backup-window.sh
            else
              remote sudo -n bash -s -- "$1" "$RECOVERY_SHA" "$RECOVERY_RUN" \
                /home/aemr/dash /home/aemr/.dash-private-backups --quiesce-worker --release-controller \
                < deploy/report-backup-window.sh
            fi
          }
          SH
          ready=false
          for attempt in $(seq 1 30); do
            ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&event=pull_request" \
              --jq '.workflow_runs | map(select(.name == "CI")) | first | .id // empty')
            if test -n "$ci_run"; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" > "$RUNNER_TEMP/release/run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$RUNNER_TEMP/release/jobs.json"
              python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'release'
          r=json.loads((p/'run.json').read_text());j=json.loads((p/'jobs.json').read_text())['jobs']
          value={'run':{k:r[k] for k in ('head_sha','name','event','path','head_repository')},
                 'jobs':[{k:x[k] for k in ('name','status','conclusion')} for x in j]}
          (p/'source-ci.json').write_text(json.dumps(value))
          PY
              if python3 .github/ci/source_ci_gate.py "$RECOVERY_SHA" < "$RUNNER_TEMP/release/source-ci.json"; then ready=true; break; fi
            fi
            sleep 20
          done
          test "$ready" = true
      - name: Match the production Docker engine and image store
        id: release-docker
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4 # v4
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Bind privileged trial commands to the same pinned runner daemon
        env:
          RELEASE_DOCKER_SOCKET: ${{ steps.release-docker.outputs.sock }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS:$RUNNER_OS" = true:Linux
          selected_cli=$(command -v docker)
          selected_socket=${RELEASE_DOCKER_SOCKET#unix://}
          test -S "$selected_socket"
          # Ephemeral hosted runner only. Recovery deliberately uses the fixed
          # /usr/bin/docker + default socket, without inherited endpoint variables.
          sudo systemctl stop docker.service docker.socket
          if test "$(readlink -f "$selected_cli")" != /usr/bin/docker; then sudo install -m 755 "$selected_cli" /usr/bin/docker; fi
          sudo ln -sfn "$selected_socket" /var/run/docker.sock
          sudo install -d -m 700 /etc/aemr/docker
          expected=$(docker info --format '{{.ID}}')
          actual=$(sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/etc/aemr/docker /usr/bin/docker info --format '{{.ID}}')
          test "$expected" = "$actual"
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          docker info --format '{{json .DriverStatus}}' | python3 -c 'import json,sys; assert ["driver-type","io.containerd.snapshotter.v1"] in json.load(sys.stdin)'
          # The stopped, preinstalled daemon's cache is disposable on this hosted
          # runner. The active pinned daemon stores everything in a different tree.
          sdk_root=$(docker info --format '{{.DockerRootDir}}')
          case "$sdk_root" in /home/runner/setup-docker-action/*/data) ;; *) exit 2 ;; esac
          test "$(systemctl is-active docker.service || true)" = inactive
          test "$(systemctl is-active docker.socket || true)" = inactive
          test ! -L /var/lib/docker
          sudo rm -rf -- /var/lib/docker
          test "$(docker info --format '{{.ID}}')" = "$expected"
          echo RUNNER_ENGINE_AND_PRIVILEGED_ENDPOINT_MATCH
      - name: Export existing exact-source immutable candidates and previous images before downtime
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          test "$GITHUB_ACTIONS:$RUNNER_OS" = true:Linux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          remote sudo -n python3 -EsB - <<'PYIMAGESET' > "$RUNNER_TEMP/release/existing-images.json"
          import hashlib,json,os,re,stat,sys
          from pathlib import Path
          tools=Path('/usr/local/libexec/aemr')
          window_path=Path('/home/aemr/.dash-private-backups/worker-38821521319/release-window.json')
          assert not any(p.is_symlink() for p in (window_path,*window_path.parents,tools,*tools.parents))
          with os.fdopen(os.open(window_path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as file:
           info=os.fstat(file.fileno());assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=1048576
           window=json.load(file)
          assert window['candidate']=='43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
          for name,pin in window['module_sha256'].items():
           assert name in {'release-controller.py','release_recovery.py','release_trial.py','stateful_backup.py','source_ci_gate.py'}
           path=tools/name
           with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as file:
            info=os.fstat(file.fileno());assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and not info.st_mode&0o022
            assert hashlib.sha256(file.read(1048577)).hexdigest()==pin
          assert len(window['module_sha256'])==5
          sys.path.insert(0,str(tools));import release_recovery as r
          stage=json.loads(r.read_owned(r.RUNTIME_DIR/'stage.json'))
          assert stage['release_sha']=='43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
          result={key:stage[key] for key in ('images','candidate_images')}
          assert all(re.fullmatch('sha256:[a-f0-9]{64}',identity) for item in result.values() for identity in item.values())
          print(json.dumps(result))
          PYIMAGESET
          python3 - <<'PYIMAGEIDS' > "$RUNNER_TEMP/release/images.txt"
          import json,os
          from pathlib import Path
          value=json.loads((Path(os.environ['RUNNER_TEMP'])/'release/existing-images.json').read_text())
          print('\n'.join(sorted(set(value['images'].values())|set(value['candidate_images'].values()))))
          PYIMAGEIDS
          while IFS= read -r identity; do
            remote sudo -n docker save "$identity" < /dev/null | docker load > "$RUNNER_TEMP/release/export-image-load.log" 2>&1
            test "$(sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/etc/aemr/docker /usr/bin/docker image inspect "$identity" --format '{{.Id}}')" = "$identity"
          done < "$RUNNER_TEMP/release/images.txt"
          python3 - <<'PYTAG'
          import json,os,subprocess
          from pathlib import Path
          value=json.loads((Path(os.environ['RUNNER_TEMP'])/'release/existing-images.json').read_text())['candidate_images']
          for service in ('server','web'):
           subprocess.run(['docker','tag',value[service],'aemr-'+service+':release-'+os.environ['RECOVERY_SHA']],check=True)
          PYTAG
          docker image inspect "aemr-server:release-$RECOVERY_SHA" "aemr-web:release-$RECOVERY_SHA" > "$RUNNER_TEMP/release/candidate-images.json"
          echo EXISTING_EXACT_SOURCE_IMAGES_EXPORTED_AND_PRIVILEGED_IDS_MATCH
      - name: Check real latest Word envelope with candidate schemas before downtime
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          # Raw response travels only over the private pipe; neither side logs it.
          program=$(cat <<'JSREPORT'
          (async()=>{
            const fail=code=>{console.log(code);process.exitCode=2;};
            let size=0;const parts=[];
            for await(const part of process.stdin){size+=part.length;if(size>33554432)return fail('LIVE_REPORT_BODY_TOO_LARGE');parts.push(part);}
            if(!size)return fail('LIVE_REPORT_BODY_EMPTY');
            let value;try{value=JSON.parse(Buffer.concat(parts).toString('utf8'));}catch{return fail('LIVE_REPORT_JSON_INVALID');}
            let shared;try{shared=await import('@aemr/shared');}catch{return fail('LIVE_REPORT_SCHEMA_IMPORT_FAILED');}
            if(typeof shared.ReportReleaseStatusSchema?.safeParse!=='function')return fail('LIVE_REPORT_SCHEMA_IMPORT_FAILED');
            if(value&&typeof value==='object'&&!Object.hasOwn(value,'latest'))return fail('LIVE_REPORT_LATEST_MISSING');
            if(value?.latest===null)return fail('LIVE_REPORT_LATEST_NULL');
            if(!shared.ReportReleaseStatusSchema.safeParse(value).success)return fail('LIVE_REPORT_SCHEMA_INVALID');
            console.log('LIVE_LATEST_REPORT_SCHEMA_PASS');
          })().catch(()=>{console.log('LIVE_REPORT_CHECK_FAILED');process.exitCode=2;});
          JSREPORT
          )
          set +e
          remote sudo -n docker exec -i aemr-server-1 python3 -I - 2> "$RUNNER_TEMP/release/live-envelope-read.log" <<'PY' | \
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m -i \
              --entrypoint node "aemr-server:release-$RECOVERY_SHA" --import tsx --eval "$program" \
              > "$RUNNER_TEMP/release/live-envelope-check.log" 2> "$RUNNER_TEMP/release/live-schema-runtime.log"
          import os,sys,urllib.request
          try:
           key=os.environ.get('AEMR_API_KEY','')
           if not key:raise ValueError('auth')
           request=urllib.request.Request('http://127.0.0.1:3000/api/report-releases',headers={'Authorization':'Bearer '+key})
           with urllib.request.urlopen(request,timeout=25) as response:
            if response.status!=200:raise ValueError('status')
            body=response.read(32*1024*1024+1)
           if len(body)>32*1024*1024:raise ValueError('size')
           sys.stdout.buffer.write(body)
          except Exception:
           print('LIVE_REPORT_READ_FAILED',file=sys.stderr);raise SystemExit(2) from None
          PY
          outcome=("${PIPESTATUS[@]}")
          set -e
          if test "${outcome[0]}" != 0; then echo LIVE_REPORT_READ_FAILED; fi
          if test "${outcome[1]}" != 0; then
            grep -E '^LIVE_REPORT_(BODY_TOO_LARGE|BODY_EMPTY|JSON_INVALID|SCHEMA_IMPORT_FAILED|LATEST_MISSING|LATEST_NULL|SCHEMA_INVALID|CHECK_FAILED)$' \
              "$RUNNER_TEMP/release/live-envelope-check.log" || echo LIVE_REPORT_NODE_BOOTSTRAP_FAILED
          fi
          test "${outcome[0]}:${outcome[1]}" = 0:0
