            def accepted_cycle_metadata():
             from datetime import datetime
             name=os.environ.get('WORKER_ACCEPTANCE','')
             if not name:
              print(json.dumps({'accepted_worker':False,'state':'NOT_ACCEPTED','reason':'CURRENT_RECEIPT_NOT_SELECTED'}),flush=True)
              return
