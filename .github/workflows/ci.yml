              if value.get('attempt_id')==match[1] and value.get('status') in {'NOT_ISSUED','VERIFIED','VERIFIED_WITH_WARNINGS'} and value.get('finished_at'):terminal.add(match[1])
             for name,expected in files.items():
              match=re.fullmatch(r'reports/attempts/([a-f0-9]{32})/bundle/snapshot_bundle/payloads/[^/]+\.json',name)
              published=re.fullmatch(r'reports/published/releases/REL-[a-f0-9]{64}/snapshot_bundle/payloads/[^/]+\.json',name)
              if not (published or (match and match[1] in terminal)) or expected.get('bytes',0)<1024**2:continue
              path=base/name
              if not path.is_file() or path.is_symlink():continue
              info=path.stat()
              if (info.st_size,info.st_uid,info.st_gid,stat.S_IMODE(info.st_mode))!=tuple(expected[k] for k in ('bytes','uid','gid','mode')):continue
              key=tuple(expected[k] for k in ('sha256','bytes','uid','gid','mode'))
              groups.setdefault(key,[]).append((info,bool(match)))
             eligible=[values for values in groups.values() if len(values)>1 and any(attempt for _,attempt in values)]
             possible=0
             for values in eligible:
              inodes={(v.st_dev,v.st_ino):v for v,_ in values}
              possible+=max(0,sum(v.st_blocks*512 for v in inodes.values())-min(v.st_blocks*512 for v in inodes.values()))
             print(json.dumps({'attempt_json_readonly_estimate':True,'terminal_attempts':len(terminal),'groups':len(eligible),
              'possible_physical_bytes':possible,'hashes_reverified':False}),flush=True)

