name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, TypeScript, Tests, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  lint-biome:
    name: Biome lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # advisory during Phase 0 transition (ESLint still primary)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome:check || true

  deploy:
    name: Deploy to VPS
    needs: verify                       # выкатываем только если lint/tsc/test/build/audit зелёные
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:                        # не допускаем параллельные деплои (последний побеждает)
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH (git reset --hard origin/main + docker compose up --build + health)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 18m
          script_stop: true             # упасть на первой же ошибке шага
          script: |
            set -euo pipefail
            cd /home/aemr/dash
            # Точка возврата. Реестр багов 09.07.2026, PLAUSIBLE «нет отката:
            # образы только :latest, выкат затирает единственный рабочий»:
            # сборка шла поверх работающих образов, и вернуться было некуда —
            # оставалось чинить на живом стенде. Теперь перед сборкой рабочие
            # образы получают метку :previous, а слепок кода запоминается в
            # файле. Порядок обязателен: метка ставится ДО git reset, иначе
            # запомнится уже новый слепок. Откат — deploy/rollback.sh.
            git rev-parse HEAD > deploy/.last-known-good
            for img in aemr-server aemr-web; do
              if docker image inspect "$img:latest" >/dev/null 2>&1; then
                docker tag "$img:latest" "$img:previous"
              fi
            done
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git log --oneline -1
            cd /home/aemr/dash/deploy
            docker compose --env-file .env.production up -d --build
            sleep 8
            # Проверка идёт ВНУТРЬ контейнера, а не через край периметра:
            # при работе по домену запрос на 127.0.0.1 не совпадает с именем
            # сайта и получает отказ, а при пароле на периметре — требование
            # войти. Ни то, ни другое не говорит о здоровье продукта.
            docker compose --env-file .env.production exec -T server \
              curl -fsS -m 15 http://127.0.0.1:3000/api/health && echo " — deploy OK"
