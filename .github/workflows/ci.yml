name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character main SHA to release"
        type: string
        required: true
      backup_root:
        description: "Absolute private backup directory outside repository and server_data"
        type: string
        required: true
      backup_name:
        description: "Previously verified immutable backup name in that directory"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push must not interrupt a running deployment/state migration.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, TypeScript, Tests, Build, Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify patched dependency security guard
        run: pnpm verify:braces-patch

      - name: Verify deployment scope (no production writes)
        run: python3 -m unittest discover -s .github/ci -p 'test_deploy_scope.py' -v

      - name: Verify stateful backup and scratch restore (synthetic; no VPS)
        run: python3 -m unittest discover -s .github/ci -p 'test_stateful_backup.py' -v
      - name: Verify exact-candidate report schema probe (synthetic; no VPS)
        run: python3 .github/ci/test_report_schema_probe.py

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --audit-level moderate

  report-engine:
    name: Report engine, publication and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report engine
        run: python -m pip install -e 'packages/report-engine[test]'
      - name: Python lint
        run: python -m ruff check packages/report-engine deploy/runtime_guard.py .github/ci/test_runtime_guard.py
      - name: Synthetic VPS retention and runtime guard regressions
        run: |
          python .github/ci/test_report_backup_window.py
          python .github/ci/test_worker_recovery.py
          python .github/ci/test_vps_cache_cleanup.py
          python .github/ci/test_runtime_state_probe.py
          python .github/ci/test_runtime_guard.py
          python .github/ci/test_weekly_identity_proof.py
      - name: Python tests
        run: python -m pytest packages/report-engine/tests -q

  server-image:
    name: Production image with report runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build server and report engine image
        run: docker build -f deploy/Dockerfile.server -t aemr-server:ci .
      - name: Verify installed publication reader
        run: |
          docker run --rm --entrypoint /opt/report-env/bin/proc-report aemr-server:ci \
            read-publication --state /tmp/report-state --view status > /tmp/report-reader.json
          python3 -c 'import json; assert json.load(open("/tmp/report-reader.json")) == {"latest": None, "attempt": None}'

  lint-biome:
    name: Biome lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true  # advisory during Phase 0 transition (ESLint still primary)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome:check || true

  deploy_scope:
    name: Classify push before deploying
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.compare.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes; refuse unknown revisions
        id: compare
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/ci/deploy_scope.py

  deploy:
    name: Deploy to VPS
    needs: [verify, report-engine, server-image, deploy_scope]
    # No unattended production writes on a main push. Only a separately
    # approved, exact-SHA dispatch with a verified backup is eligible.
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.release_sha == github.sha &&
      needs.verify.result == 'success' &&
      needs.report-engine.result == 'success' &&
      needs.server-image.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      # Deployment address confirmed by the owner; do not rely on a stale secret.
      VPS_HOST: 193.233.91.162
    concurrency:                        # не допускаем параллельные деплои (последний побеждает)
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Validate explicit release intent
        id: release_inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          BACKUP_ROOT: ${{ inputs.backup_root }}
          BACKUP_NAME: ${{ inputs.backup_name }}
        run: |
          case "$RELEASE_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#RELEASE_SHA}" -eq 40
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          case "$BACKUP_ROOT" in
            /*) ;;
            *) exit 2 ;;
          esac
          case "$BACKUP_ROOT" in
            *[!A-Za-z0-9_./-]*) exit 2 ;;
          esac
          case "$BACKUP_NAME" in
            ''|'.'|'..'|*[!A-Za-z0-9_.-]*) exit 2 ;;
          esac
          # These values contain only the checked safe alphabet (no quotes,
          # newlines or shell metacharacters). Publish only sanitized outputs.
          printf 'backup_root=%s\nbackup_name=%s\n' "$BACKUP_ROOT" "$BACKUP_NAME" >> "$GITHUB_OUTPUT"
          echo 'Explicit exact-SHA release input validated; production state still untouched.'

      - name: Check deployment configuration without exposing credentials
        env:
          PREVIOUS_DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          python3 - <<'PY'
          import os
          configured = os.environ.get('PREVIOUS_DEPLOY_HOST', '').strip()
          target = os.environ['VPS_HOST']
          print('Configured host matches owner-confirmed VPS:', configured == target)
          required = ('DEPLOY_USER', 'DEPLOY_SSH_KEY')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing deployment configuration: ' + ', '.join(missing))
          print('Deployment user and SSH key are configured. SSH port: 22.')
          PY
      - name: Deploy tested commit over SSH and verify native report exports
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 40m
          script_stop: false            # Bash owns fail-fast; per-line SSH guards bypass EXIT recovery
          script: |
            set -euo pipefail
            umask 077
            cd /home/aemr/dash
            cd deploy
            [ ! -L /run/lock/aemr-maintenance.lock ] || { echo AEMR_MAINTENANCE_LOCK_INVALID >&2; exit 1; }
            exec 9>/run/lock/aemr-maintenance.lock
            flock -n 9 || { echo AEMR_MAINTENANCE_BUSY >&2; exit 1; }
            # External programs cannot retain fd9 after the shell owner dies.
            docker() { command docker "$@" 9>&-; }
            git() { command git "$@" 9>&-; }
            python3() { command python3 "$@" 9>&-; }
            sleep() { command sleep "$@" 9>&-; }
            df() { command df "$@" 9>&-; }
            systemctl() { command systemctl "$@" 9>&-; }
            rm() { command rm "$@" 9>&-; }
            previous_worker=$(exec 9>&-; docker compose --env-file .env.production --profile reports ps --status running --quiet report-worker)
            original_server=
            original_quiesced=false
            runtime_mutation_started=false
            original_code=
            original_web_image=
            report_release_started=false
            verification_dir=
            resume_original_api() {
              docker start "$original_server" >/dev/null || return 1
              for attempt in $(exec 9>&-; seq 1 60); do
                if [ "$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$original_server")" = running ] &&
                   [ "$(exec 9>&-; docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$original_server")" = healthy ]; then
                  original_quiesced=false
                  return 0
                fi
                sleep 2
              done
              echo RELEASE_ORIGINAL_API_NOT_HEALTHY >&2
              return 1
            }
            restore_worker_on_failure() {
              result=$?
              trap - EXIT
              if [ "$result" -ne 0 ] && [ "$original_quiesced" = true ] && [ "$runtime_mutation_started" = false ]; then
                resume_original_api || { echo RELEASE_ORIGINAL_API_RECOVERY_FAILED >&2; result=2; }
              fi
              if [ "$result" -ne 0 ] && [ "$report_release_started" = true ] && [ -n "$previous_worker" ]; then
                if ! docker compose -f /home/aemr/dash/deploy/docker-compose.yml \
                  --env-file /home/aemr/dash/deploy/.env.production --profile reports \
                  start report-worker >/dev/null 2>&1; then
                  echo 'REPORT_WORKER_RESTART_COMMAND_FAILED' >&2
                fi
                restored_worker=$(exec 9>&-; docker compose -f /home/aemr/dash/deploy/docker-compose.yml \
                  --env-file /home/aemr/dash/deploy/.env.production --profile reports \
                  ps --status running --quiet report-worker 2>/dev/null || true)
                if [ "$restored_worker" != "$previous_worker" ]; then
                  echo 'REPORT_WORKER_RESTORE_FAILED: the previous worker is not running.' >&2
                fi
              fi
              if [ -n "$verification_dir" ]; then
                rm -rf "$verification_dir"
              fi
              exit "$result"
            }
            trap restore_worker_on_failure EXIT
            trap 'exit 130' HUP INT TERM

            # Backup and scratch restore must succeed BEFORE any production
            # image, code, source, report state or scheduler is modified.
            verified_backup_root='${{ steps.release_inputs.outputs.backup_root }}'
            verified_backup_name='${{ steps.release_inputs.outputs.backup_name }}'
            test -f "$verified_backup_root/$verified_backup_name/manifest.json"
            verification_dir=$(exec 9>&-; mktemp -d /tmp/aemr-release-check.XXXXXX)
            release_sha='${{ github.sha }}'
            cd ..
            git fetch --quiet origin "$release_sha"
            git show "$release_sha:deploy/stateful_backup.py" > "$verification_dir/stateful_backup.py"
            cd deploy
            # The earlier backup job MUST have resumed its original API and released
            # its guardian. This owner validates and quiesces the running API itself.
            worker=$(exec 9>&-; docker compose --env-file .env.production --profile reports ps --all --quiet report-worker)
            if [ -n "$worker" ]; then
              worker_state=$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$worker")
              case "$worker_state" in
                exited|created) ;;
                *) echo 'BACKUP_REQUIRES_WORKER_QUIESCENCE' >&2; exit 2 ;;
              esac
            fi
            original_server=$(exec 9>&-; docker compose --env-file .env.production ps --all --quiet server)
            [[ "$original_server" =~ ^[a-f0-9]{64}$ ]]
            [ "$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$original_server")" = running ] &&
            [ "$(exec 9>&-; docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$original_server")" = healthy ] || {
              echo 'RELEASE_REQUIRES_ORIGINAL_API_HEALTHY' >&2; exit 2;
            }
            source_volume=$(exec 9>&-; docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/packages/server/data"}}{{if eq .Type "volume"}}{{.Name}}{{end}}{{end}}{{end}}' "$original_server")
            case "$source_volume" in ''|*[!a-zA-Z0-9_.-]*) echo BACKUP_SOURCE_VOLUME_NOT_VERIFIED >&2; exit 2 ;; esac
            server_image=$(exec 9>&-; docker inspect --format '{{.Image}}' "$original_server")
            [[ "$server_image" =~ ^sha256:[a-f0-9]{64}$ ]]
            original_code=$(exec 9>&-; git rev-parse HEAD)
            [[ "$original_code" =~ ^[a-f0-9]{40}$ ]]
            original_web=$(exec 9>&-; docker compose --env-file .env.production ps --status running --quiet web)
            [[ "$original_web" =~ ^[a-f0-9]{64}$ ]]
            original_web_image=$(exec 9>&-; docker inspect --format '{{.Image}}' "$original_web")
            [[ "$original_web_image" =~ ^sha256:[a-f0-9]{64}$ ]]
            python3 - "$verified_backup_root/runtime.json" "$original_server" "$worker" "$source_volume" "$server_image" <<'PYRUNTIME'
            import json,re,sys
            from pathlib import Path
            try:
                x=json.loads(Path(sys.argv[1]).read_text())
                assert [x[k] for k in ('server','worker','volume','image')] == sys.argv[2:]
                assert re.fullmatch('[a-f0-9]{40}',x['candidate'])
            except (OSError,ValueError,KeyError,TypeError,AssertionError):
                print('RELEASE_BACKUP_RUNTIME_MISMATCH',file=sys.stderr);sys.exit(2)
            PYRUNTIME
            release_run='${{ github.run_id }}'
            release_attempt='${{ github.run_attempt }}'
            [[ "$release_run" =~ ^[0-9]+$ ]] && [[ "$release_attempt" =~ ^[0-9]+$ ]]
            checkpoint_name="release-$release_sha-$release_run-$release_attempt"
            [ ! -e "$verified_backup_root/$checkpoint_name" ] || { echo RELEASE_CHECKPOINT_EXISTS >&2; exit 2; }
            # Read-only gzip count and scratch filesystem admission, before API stop.
            docker run --rm --network none --read-only --user 0 \
              --mount "type=volume,src=$source_volume,dst=/source,readonly" \
              --mount "type=bind,src=$verified_backup_root,dst=/backups,readonly" \
              --mount "type=bind,src=$verification_dir/stateful_backup.py,dst=/tool.py,readonly" \
              --mount type=volume,dst=/scratch \
              --entrypoint /opt/report-env/bin/python "$server_image" /tool.py release-capacity \
              --source /source --backup-parent /backups --prior-backup "/backups/$verified_backup_name" --scratch-parent /scratch > "$verification_dir/capacity.json"
            reserve_scratch_arg=$(exec 9>&-; python3 - "$verification_dir/capacity.json" <<'PYCAPACITY'
            import json,sys
            x=json.load(open(sys.argv[1]));assert x['state']=='RELEASE_STORAGE_PREFLIGHT'
            assert x['free_bytes']>=x['required_bytes'] and x['scratch_free_bytes']>=x['scratch_required_bytes']
            print('--reserve-scratch' if x['shared_filesystem'] else '')
            PYCAPACITY
            )
            # The retained external copy is restored as history, never labelled current.
            docker run --rm --network none --read-only --user 0 \
              --mount "type=bind,src=$verified_backup_root,dst=/backups,readonly" \
              --mount "type=bind,src=$verification_dir/stateful_backup.py,dst=/tool.py,readonly" \
              --mount type=volume,dst=/scratch \
              --entrypoint /opt/report-env/bin/python "$server_image" /tool.py verify \
              --backup "/backups/$verified_backup_name" --scratch-parent /scratch > "$verification_dir/prior-restore.json"
            # Known installed guard is the finite owner-loss recovery path.
            systemctl is-active --quiet aemr-runtime-guard.timer
            [ "$(exec 9>&-; systemctl show --property=FragmentPath --value aemr-runtime-guard.service)" = /etc/systemd/system/aemr-runtime-guard.service ]
            [ "$(exec 9>&-; systemctl show --property=FragmentPath --value aemr-runtime-guard.timer)" = /etc/systemd/system/aemr-runtime-guard.timer ]
            [ "$(exec 9>&-; systemctl show --property=NeedDaemonReload --value aemr-runtime-guard.timer)" = no ]
            [ -z "$(exec 9>&-; systemctl show --property=DropInPaths --value aemr-runtime-guard.timer)" ]
            [ "$(exec 9>&-; systemctl show --property=NeedDaemonReload --value aemr-runtime-guard.service)" = no ]
            [ -z "$(exec 9>&-; systemctl show --property=DropInPaths --value aemr-runtime-guard.service)" ]
            git show "$release_sha:deploy/runtime_guard.py" > "$verification_dir/runtime_guard.py"
            git show "$release_sha:deploy/systemd/aemr-runtime-guard.service" > "$verification_dir/guard.service"
            git show "$release_sha:deploy/systemd/aemr-runtime-guard.timer" > "$verification_dir/guard.timer"
            cmp "$verification_dir/runtime_guard.py" /usr/local/libexec/aemr/runtime_guard.py 9>&-
            cmp "$verification_dir/guard.service" /etc/systemd/system/aemr-runtime-guard.service 9>&-
            cmp "$verification_dir/guard.timer" /etc/systemd/system/aemr-runtime-guard.timer 9>&-
            if [ "$(exec 9>&-; id -u)" = 0 ]; then
              cat /etc/aemr/runtime-policy.json > "$verification_dir/guard-policy.json" 9>&-
            else
              sudo -n cat /etc/aemr/runtime-policy.json > "$verification_dir/guard-policy.json" 9>&-
            fi
            original_name=$(exec 9>&-; docker inspect --format '{{.Name}}' "$original_server")
            python3 - "$verification_dir/guard-policy.json" "$original_name" <<'PYGUARD'
            import json,sys
            x=json.load(open(sys.argv[1]));assert x['project']=='aemr'
            assert x['services']['server']['container']==sys.argv[2].removeprefix('/')
            assert x.get('worker_enabled',False) is False
            PYGUARD
            original_quiesced=true
            docker stop --time 75 "$original_server" >/dev/null
            [ "$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$original_server")" = exited ] || { echo BACKUP_REQUIRES_SERVER_QUIESCENCE >&2; exit 2; }
            # Capture all current state, including legitimate startup/WAL/timestamp changes.
            docker run --rm --network none --read-only --user 0 \
              --mount "type=volume,src=$source_volume,dst=/source,readonly" \
              --mount "type=bind,src=$verified_backup_root,dst=/backups" \
              --mount "type=bind,src=$verification_dir/stateful_backup.py,dst=/tool.py,readonly" \
              --entrypoint /opt/report-env/bin/python "$server_image" /tool.py create \
              --source /source --backup "/backups/$checkpoint_name" --compressed --compression-level 1 $reserve_scratch_arg > "$verification_dir/capture.json"
            # Only archive container ownership changes; source attributes remain in tar/manifest.
            docker run --rm --network none --read-only --user 0 \
              --mount "type=bind,src=$verified_backup_root,dst=/backups" \
              --entrypoint /opt/report-env/bin/python "$server_image" -B -c \
              'import os,sys; from pathlib import Path; root=Path("/backups")/sys.argv[1]; [os.chown(p,int(sys.argv[2]),int(sys.argv[3])) for p in [root,*root.iterdir()]]' "$checkpoint_name" "$(exec 9>&-; id -u)" "$(exec 9>&-; id -g)"
            docker run --rm --network none --read-only --user 0 \
              --mount "type=volume,src=$source_volume,dst=/source,readonly" \
              --mount "type=bind,src=$verified_backup_root,dst=/backups,readonly" \
              --mount "type=bind,src=$verification_dir/stateful_backup.py,dst=/tool.py,readonly" \
              --mount type=volume,dst=/scratch \
              --entrypoint /opt/report-env/bin/python "$server_image" /tool.py verify \
              --backup "/backups/$checkpoint_name" --scratch-parent /scratch --source /source > "$verification_dir/current-restore.json"
            [ "$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$original_server")" = exited ]
            case "$(exec 9>&-; docker inspect --format '{{.State.Status}}' "$worker")" in
              exited|created) ;;
              *) echo BACKUP_REQUIRES_WORKER_QUIESCENCE >&2; exit 2 ;;
            esac
            python3 - "$verification_dir" "$verified_backup_root" "$checkpoint_name" "$release_sha" "$original_server" "$worker" "$source_volume" "$server_image" "$original_web_image" "$original_code" <<'PYPROOF'
            import hashlib,json,os,sys
            from pathlib import Path
            v,root=map(Path,sys.argv[1:3]);name,sha,server,worker,volume,image,web,code=sys.argv[3:]
            prior=json.loads((v/'prior-restore.json').read_text());current=json.loads((v/'current-restore.json').read_text())
            assert prior['state']==current['state']=='VERIFIED_IN_SCRATCH' and current['source_matched'] is True
            manifest=root/name/'manifest.json'
            proof={'release_sha':sha,'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
                   'checkpoint':name,'prior_restore':prior,'restore':current,
                   'runtime':{'server':server,'worker':worker,'volume':volume},
                   'rollback':{'server_image':image,'web_image':web,'code_sha':code}}
            with (root/f'{name}.receipt.json').open('x') as output:
                json.dump(proof,output,sort_keys=True);output.flush();os.fsync(output.fileno())
            PYPROOF
            echo 'BACKUP_AND_SCRATCH_RESTORE_PASS'

            # Storage is a deployment prerequisite, not a post-failure repair.
            # Keep rollback-tagged images and reusable build layers. Removing
            # all build cache on every deploy forces a slow full frontend build.
            # Never stop the report scheduler or change the report history during
            # disk/image preparation. Both belong to the separately gated
            # report release, after stateful backup + restore acceptance.
            docker image prune --force >/dev/null
            free_kb=$(exec 9>&-; df -Pk / | awk 'NR==2 {print $4}')
            if [ "${free_kb:-0}" -lt 8388608 ]; then
              echo "Less than 8 GiB free; reclaiming unused build cache."
              docker builder prune --all --force >/dev/null
              free_kb=$(exec 9>&-; df -Pk / | awk 'NR==2 {print $4}')
            fi
            df -h /
            if [ "${free_kb:-0}" -lt 4194304 ]; then
              echo "Deployment aborted: less than 4 GiB free after safe recovery." >&2
              exit 1
            fi
            cd ..

            # Healthy pre-stop runtime is the rollback point; stopped health is not evidence.
            [ "$(exec 9>&-; docker inspect --format '{{.Image}}' "$original_server")" = "$server_image" ]
            [ "$(exec 9>&-; git rev-parse HEAD)" = "$original_code" ]
            docker tag "$server_image" aemr-server:previous
            docker tag "$original_web_image" aemr-web:previous
            printf '%s\n' "$original_code" > deploy/.last-known-good
            git fetch origin
            git checkout main
            tested_commit='${{ github.sha }}'
            git cat-file -e "$tested_commit^{commit}"
            git reset --hard "$tested_commit"
            test "$(exec 9>&-; git rev-parse HEAD)" = "$tested_commit"
            git log --oneline -1
            cd /home/aemr/dash/deploy
            # Even if COMPOSE_PROFILES=reports is set, preserve the existing
            # worker until its separate preflight can safely replace it.
            docker compose --env-file .env.production build server web
            runtime_mutation_started=true
            if ! docker compose --env-file .env.production up -d --no-build server web caddy; then
              df -h /
              server_id=$(exec 9>&-; docker compose --env-file .env.production ps --all --quiet server)
              if [ -n "$server_id" ]; then
                docker inspect --format 'server_state={{.State.Status}} exit_code={{.State.ExitCode}} oom={{.State.OOMKilled}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$server_id" || true
              fi
              exit 1
            fi
            sleep 8
            # Проверка идёт ВНУТРЬ контейнера, а не через край периметра:
            # при работе по домену запрос на 127.0.0.1 не совпадает с именем
            # сайта и получает отказ, а при пароле на периметре — требование
            # войти. Ни то, ни другое не говорит о здоровье продукта.
            docker compose --env-file .env.production exec -T server \
              curl -fsS -m 15 http://127.0.0.1:3000/api/health && echo " — deploy OK"
            # Private inputs and audit output stay in server_data, not Actions logs.
            # Start the scheduler only after a successful service-account release.
            report_release_started=true
            bash enable-reports.sh
            trap - EXIT

  browser-report-contract:
    name: Read-only browser Word readiness and Caddy edge diagnosis
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Compare actual production response against browser schema (no writes)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 4m
          # Bash owns failure handling: injected per-line stops corrupt Python/JS blocks.
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            cd /home/aemr/dash/deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            # JS uses the Zod schema imported by browser code, but only GETs
            # an existing release through Fastify, without invoking refresh.
            docker compose --env-file .env.production exec -T server node --import tsx --input-type=module -e '
              import { execFileSync } from "node:child_process";
              import { SelectedReportReleaseStatusSchema } from "@aemr/shared";
              void(async()=>{
                // Probe the SAME product-local current date the browser selects,
                // not status.json: an in-flight RUNNING attempt has no report_date.
                const now=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Kamchatka",
                  year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
                const yyyy=now.slice(0,4),mm=now.slice(5,7);
                const url="http://127.0.0.1:3000/api/report-releases?date="+now+
                  "&year="+yyyy+"&quarter="+Math.ceil(Number(mm)/3);
                const resp=await fetch(url,{headers:{Authorization:"Bearer "+(process.env.AEMR_API_KEY||"")},signal:AbortSignal.timeout(25000)});
                if(resp.status!==200){console.log(JSON.stringify({kind:"browser_word_status",result:"HTTP_ERROR",status:resp.status}));return;}
                const parsed=SelectedReportReleaseStatusSchema.safeParse(await resp.json());
                console.log(JSON.stringify({kind:"browser_word_status",result:parsed.success?"CONTRACT_PASS":"CONTRACT_FAIL",
                  field_errors:parsed.success?[]:parsed.error.issues.slice(0,8).map(e=>({path:e.path.map(String).join(".").replace(/[^A-Za-z0-9_.]/g,""),code:e.code}))
                }));
              })().catch(()=>console.log(JSON.stringify({kind:"browser_word_status",result:"DIAGNOSTIC_UNAVAILABLE"})));
            ' 2>&1 | python3 -c 'import sys,json; out=sys.stdin.read(); labels=("CONTRACT_PASS","CONTRACT_FAIL","HTTP_ERROR","INVALID_SELECTED_DATE","DIAGNOSTIC_UNAVAILABLE","ERR_MODULE_NOT_FOUND","ERR_PACKAGE_PATH_NOT_EXPORTED","SyntaxError","ReferenceError","TypeError"); found=next((x for x in labels if x in out),"UNKNOWN"); issues=[{"path":"".join(ch for ch in str(entry.get("path","")) if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_.")[:90],"code":"".join(ch for ch in str(entry.get("code","")) if ch in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz_")[:30]} for entry in json.loads(next((ln for ln in out.splitlines() if ln.startswith("{") and "browser_word_status" in ln),"{}")).get("field_errors",[])][:8]; print(json.dumps({"kind":"browser_contract_probe","result":found,"invalid_fields":issues},sort_keys=True))' || echo 'browser_node_probe=FAILED'
            # Python makes an independent read-only request using the existing
            # production service token; output only status and schema shape.
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -B - <<'PYREPORT' 2>/dev/null || echo 'browser_python_probe=UNAVAILABLE'
            import json
            import os
            import re
            from datetime import datetime
            from pathlib import Path
            from urllib.request import Request, urlopen
            from urllib.error import HTTPError
            from zoneinfo import ZoneInfo
            day = datetime.now(ZoneInfo("Asia/Kamchatka")).date().isoformat()
            if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", day):
                print(json.dumps({"kind":"report_status_http_shape","result":"NO_DATE"}))
            else:
                yy, mm, dd = day.split("-")
                url = ("http://127.0.0.1:3000/api/report-releases?date="+
                       day+"&year="+yy+"&quarter="+str((int(mm)+2)//3))
                request = Request(url, headers={"Authorization": "Bearer "+os.environ.get("AEMR_API_KEY", "")})
                try:
                    with urlopen(request, timeout=25) as response:
                        status = response.status
                        data = json.loads(response.read(2*1024*1024))
                    selected = data.get("selected") if isinstance(data, dict) else None
                    attempt = data.get("attempt") if isinstance(data, dict) else None
                    required = ("release_id","snapshot_id","report_date","cutoff_at",
                                "published_at","model_sha256","rules_version",
                                "renderer_version","status","report_year","quarter")
                    missing = [k for k in required if isinstance(selected,dict) and k not in selected]
                    print(json.dumps({"kind":"report_status_http_shape",
                                      "http_status":status,"body_type":type(data).__name__,
                                      "selected_type":type(selected).__name__,
                                      "selected_missing_required":missing,
                                      "attempt_type":type(attempt).__name__},sort_keys=True))
                except HTTPError as e:
                    print(json.dumps({"kind":"report_status_http_shape","http_status":e.code,"result":"HTTP_ERROR"}))
                except Exception:
                    print(json.dumps({"kind":"report_status_http_shape","result":"READBACK_FAILED"}))
            PYREPORT
            # Caddy sees real requests; only aggregate HTTP statuses leave VPS.
            docker compose --env-file .env.production logs --since 90m --no-color caddy 2>/dev/null \
              | tail -n 2000 \
              | python3 -c 'import collections,json,re,sys; records=[l for l in sys.stdin if "/api/report-releases" in l]; matches=[re.search(r"(?i)(?:status|status_code)[^0-9]{0,10}([245][0-9][0-9])",l) or re.search(r"\b(200|202|400|401|403|404|429|500|502|503|504)\b",l) for l in records]; counts=collections.Counter(m.group(1) if m else "UNKNOWN" for m in matches); print(json.dumps({"kind":"caddy_report_access","matching_log_lines":len(records),"status_counts":dict(counts)},sort_keys=True))' || echo 'edge_log_probe=FAILED'
