name: CI

on:
  push:
    branches: [codex/release-observe-20261015]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [metadata, storage-census, release-progress, browser, proof-recovery, transport-probe, continue-check, continue-release, fresh-release, weekly-stage, monitoring-preview, registry-proof, registry-apply, api-timing, worker-observe, image-archive, image-retire]
        default: metadata
        description: "Read-only operational metadata or authenticated real-domain browser"
      browser_profile:
        type: choice
        options: [desktop, iphone]
        default: desktop
        description: "Browser interaction profile; iphone uses emulated WebKit, not a physical Safari claim"
      browser_scenario:
        type: choice
        options: [full, navigation, filters]
        default: full
        description: "Full acceptance or a bounded navigation-only diagnosis"
      browser_renderer:
        type: choice
        options: [headless, headed]
        default: headless
        description: "Linux WebKit: WPE headless or GTK headed under Xvfb; identical product actions"
      release_sha:
        description: "Exact 40-character main SHA to release"
        type: string
        required: true
      backup_root:
        description: "Absolute private backup directory outside repository and server_data"
        type: string
        required: true
      backup_name:
        description: "Previously verified immutable backup name in that directory"
        type: string
        required: true
      worker_acceptance:
        description: "Exact acceptance-<run>-<attempt> directory of the current worker observer"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
jobs:
  image-retire:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' && inputs.mode == 'image-retire' &&
      inputs.release_sha == 'ed3e4589a33a4b5bed3f4cab684ef1d519d0290d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      PENDING_SOURCE: ed3e4589a33a4b5bed3f4cab684ef1d519d0290d
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent roundtrip and root retirement contracts before SSH
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/image-retire"
          mkdir -m 700 "$private"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$PENDING_SOURCE"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39051472665" > "$private/archive-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39051472665/jobs?per_page=100" > "$private/archive-jobs.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-retire'
          run=json.loads((root/'archive-run.json').read_text())
          assert run['id']==39051472665 and run['head_sha']=='48bc5d648192f697bfca5965e009ed1af5af67b9'
          assert run['conclusion']=='success' and run['status']=='completed' and run['event']=='workflow_dispatch'
          jobs=[job for job in json.loads((root/'archive-jobs.json').read_text())['jobs'] if job['name']=='image-archive']
          assert len(jobs)==1 and jobs[0]['conclusion']=='success'
          PY
          git fetch --quiet --no-tags origin "$PENDING_SOURCE"
          git show "$PENDING_SOURCE:deploy/release_recovery.py" > "$private/release_recovery.py"
          sudo env IMAGE_ARCHIVE_RECOVERY_SOURCE="$private/release_recovery.py" \
            python3 -m unittest discover -s .github/ci -p 'test_image_archive.py' -v
      - name: Retire only the archived exact image while preserving running services
        run: |
          set -euo pipefail
          umask 077
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          private="$RUNNER_TEMP/image-retire"
          printf '%s\n' "$VPS_KEY" > "$private/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$private/known_hosts" 2>/dev/null
          test -s "$private/known_hosts"
          timeout --kill-after=5s 720s ssh -i "$private/key" \
            -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$private/known_hosts" -o StrictHostKeyChecking=yes \
            "$VPS_USER@193.233.91.162" 'sudo -n python3 -IB - --retire' < .github/ci/image_archive.py
      - name: Remove this runner's private transport files
        if: always()
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-retire'
          assert root.name=='image-retire' and not root.is_symlink()
          if root.exists():shutil.rmtree(root)
          PY
  image-archive:
    if: >-
      github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' && inputs.mode == 'image-archive' &&
      inputs.release_sha == 'ed3e4589a33a4b5bed3f4cab684ef1d519d0290d'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      PENDING_SOURCE: ed3e4589a33a4b5bed3f4cab684ef1d519d0290d
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require exact candidate CI and isolated root archive contracts
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/image-archive"
          mkdir -m 700 "$private"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$PENDING_SOURCE"
          git fetch --quiet --no-tags origin "$PENDING_SOURCE"
          git show "$PENDING_SOURCE:deploy/release_recovery.py" > "$private/release_recovery.py"
          git show "$PENDING_SOURCE:.github/ci/source_ci_gate.py" > "$private/source_ci_gate.py"
          ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PENDING_SOURCE&event=pull_request" \
            --jq '.workflow_runs | map(select(.name == "CI")) | first | .id')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" > "$private/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$private/jobs.json"
          python3 - <<'PY' | python3 "$private/source_ci_gate.py" "$PENDING_SOURCE"
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-archive'
          print(json.dumps({'run':json.loads((root/'run.json').read_text()),
                           'jobs':json.loads((root/'jobs.json').read_text())['jobs']}))
          PY
          sudo env IMAGE_ARCHIVE_RECOVERY_SOURCE="$private/release_recovery.py" \
            python3 -m unittest discover -s .github/ci -p 'test_image_archive.py' -v
      - name: Prepare private SSH transport
        run: |
          set -euo pipefail
          umask 077
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          private="$RUNNER_TEMP/image-archive"
          printf '%s\n' "$VPS_KEY" > "$private/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$private/known_hosts" 2>/dev/null
          test -s "$private/known_hosts"
          cat > "$private/ssh.sh" <<'SH'
          remote() {
            timeout --kill-after=5s 360s ssh -i "$RUNNER_TEMP/image-archive/key" \
              -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o UserKnownHostsFile="$RUNNER_TEMP/image-archive/known_hosts" -o StrictHostKeyChecking=yes \
              "$VPS_USER@193.233.91.162" "$@"
          }
          SH
      - name: Archive the exact unused image under maintenance EX without removing it
        run: |
          set -euo pipefail
          umask 077
          . "$RUNNER_TEMP/image-archive/ssh.sh"
          private="$RUNNER_TEMP/image-archive"
          if ! remote sudo -n python3 -IB - --prepare < .github/ci/image_archive.py > "$private/prepare.json"; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          for line in (Path(os.environ['RUNNER_TEMP'])/'image-archive/prepare.json').read_text().splitlines():
           try:value=json.loads(line)
           except ValueError:continue
           if value.get('state')=='FAILED':print(json.dumps(value))
          PY
            exit 2
          fi
          root=/root/codex-fixes/image-retirement/43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa
          remote sudo -n cat "$root/ready.json" > "$private/ready.json"
          remote sudo -n cat "$root/image-metadata.json" > "$private/original-image.json"
          remote sudo -n cat "$root/image.tar.gz" > "$private/image.tar.gz"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-archive';ready=json.loads((root/'ready.json').read_text())
          archive=root/'image.tar.gz'
          assert 0<archive.stat().st_size==ready['archive_bytes']<=512*1024**2
          with archive.open('rb') as stream:assert hashlib.file_digest(stream,'sha256').hexdigest()==ready['archive_sha256']
          assert hashlib.sha256((root/'original-image.json').read_bytes()).hexdigest()==ready['image_metadata_sha256']
          PY
      - name: Match the production image store for independent loading
        uses: docker/setup-docker-action@e43656e248c0bd0647d3f5c195d116aacf6fcaf4
        with:
          version: v29.1.3
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Load and compare the archived image on the independent daemon
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/image-archive"
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          docker info --format '{{json .DriverStatus}}' | python3 -c 'import json,sys;assert ["driver-type","io.containerd.snapshotter.v1"] in json.load(sys.stdin)'
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 4294967296
          timeout --kill-after=5s 180s bash -o pipefail -c 'gzip -dc "$1" | docker image load' \
            load-image "$private/image.tar.gz" > "$private/load.log" 2>&1
          docker image inspect aemr-server:release-43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa > "$private/loaded-image.json"
          python3 - <<'PY'
          import importlib.util,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-archive'
          spec=importlib.util.spec_from_file_location('archive_operator',Path('.github/ci/image_archive.py'))
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.verify_loaded_image(json.loads((root/'original-image.json').read_text()),
                                     json.loads((root/'loaded-image.json').read_text())[0])
          receipt={**json.loads((root/'ready.json').read_text()),'state':'IMAGE_ARCHIVE_ROUNDTRIP_VERIFIED',
                   'runner_engine_version':'29.1.3','run_id':os.environ['GITHUB_RUN_ID'],
                   'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ops_sha':os.environ['GITHUB_SHA']}
          module.check_receipt(json.loads((root/'ready.json').read_text()),receipt)
          (root/'roundtrip.json').write_text(json.dumps(receipt,sort_keys=True))
          PY
      - name: Save the independently verified archive receipt privately on the host
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/image-archive/ssh.sh"
          receipt=$(base64 -w0 "$RUNNER_TEMP/image-archive/roundtrip.json")
          remote "sudo -n python3 -IB - --receipt '$receipt'" < .github/ci/image_archive.py
      - name: Remove this runner's private transport files
        if: always()
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'image-archive'
          assert root.name=='image-archive' and not root.is_symlink()
          if root.exists():shutil.rmtree(root)
          PY
  renderer-diagnostic:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      github.event_name == 'push' &&
      github.event.head_commit.message == 'Compare WebKit renderer backends for candidate b13cd9e5'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b13cd9e596d6f0075b77a5ab42d1ed67e18b8e05
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the same synthetic fixture without production access
        run: |
          pnpm install --frozen-lockfile
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps webkit
          node scripts/build-navigation-qa.mjs --out "$RUNNER_TEMP/navigation-qa.html"
      - name: Compare WPE and GTK with unchanged real input and assertions
        run: |
          export DASH_HEADER_QA_HTML="$RUNNER_TEMP/navigation-qa.html"
          export BROWSER_ENGINE=webkit
          cp .github/ci/test_browser_header_controls.py "$RUNNER_TEMP/original-controls.py"
          failed=0
          sequence=0
          for backend in gtk wpe wpe gtk; do
            sequence=$((sequence+1))
            cp "$RUNNER_TEMP/original-controls.py" .github/ci/test_browser_header_controls.py
            if [ "$backend" = gtk ]; then
              python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/ci/test_browser_header_controls.py')
          text = path.read_text()
          assert text.count('.launch()') == 3
          path.write_text(text.replace('.launch()', '.launch(headless=False)'))
          PY
              result=0
              xvfb-run --auto-servernum python3 .github/ci/test_browser_header_controls.py > "$RUNNER_TEMP/backend.log" 2>&1 || result=$?
            else
              result=0
              python3 .github/ci/test_browser_header_controls.py > "$RUNNER_TEMP/backend.log" 2>&1 || result=$?
            fi
            cat "$RUNNER_TEMP/backend.log"
            printf 'RENDERER_COMPARISON sequence=%s backend=%s exit=%s\n' "$sequence" "$backend" "$result"
            if [ "$result" != 0 ]; then failed=1; fi
          done
          exit "$failed"
  weekly-preview:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/codex/release-observe-20261015' &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == 'Preview weekly retention for accepted 43f10742' ||
       github.event.head_commit.message == 'Prepare identity copy for accepted 43f10742' ||
       github.event.head_commit.message == 'Apply prepared identity metadata for accepted 43f10742' ||
       github.event.head_commit.message == 'Apply weekly retention for accepted 43f10742' ||
       github.event.head_commit.message == 'Verify retained publications for accepted 43f10742' ||
       github.event.head_commit.message == 'Finalize reviewed publications for accepted 43f10742' ||
       github.event.head_commit.message == 'Verify finalized publications for accepted 43f10742')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Bind reviewed read-only operator
        run: |
          python3 - <<'PY'
          import base64,hashlib,os
          from pathlib import Path
          body=Path('.github/ci/weekly_publication_operator.py').read_bytes()
          assert len(body)<=40960
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('WEEKLY_CODE='+base64.b64encode(body).decode()+'\n')
              target.write('WEEKLY_SHA='+hashlib.sha256(body).hexdigest()+'\n')
              check=Path('.github/ci/weekly_publication_readback.py').read_bytes();assert len(check)<=16384
              target.write('WEEKLY_READBACK_CODE='+base64.b64encode(check).decode()+'\n')
              target.write('WEEKLY_READBACK_SHA='+hashlib.sha256(check).hexdigest()+'\n')
          PY
      - name: Verify exact runtime and perform the explicitly selected metadata operation
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEEKLY_CODE: ${{ env.WEEKLY_CODE }}
          WEEKLY_SHA: ${{ env.WEEKLY_SHA }}
          WEEKLY_READBACK_CODE: ${{ env.WEEKLY_READBACK_CODE }}
          WEEKLY_READBACK_SHA: ${{ env.WEEKLY_READBACK_SHA }}
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: WEEKLY_CODE,WEEKLY_SHA,WEEKLY_READBACK_CODE,WEEKLY_READBACK_SHA
          command_timeout: 16m
          script: |
            set -euo pipefail
            sudo -n --preserve-env=WEEKLY_CODE,WEEKLY_SHA,WEEKLY_READBACK_CODE,WEEKLY_READBACK_SHA python3 -IB - <<'PY'
            import base64,hashlib,json,os,re,shutil,stat,subprocess
            from pathlib import Path
            def reviewed_finalize_token(proof):
                assert set(proof)=={'runtime_source','tool_source','plan_revision','readback_source_sha256','operator_run','result'}
                assert proof['runtime_source']=='43f10742c274777dc5b8e0ac5b7c97d0a78cf6fa'
                assert proof['tool_source']=='83b813ab250b4533d1b80ba9e306afaa8bc5f383'
                assert proof['operator_run']=='38903432153'
                assert proof['readback_source_sha256']=='c07bc2a5ab01a4f1f09e2b21b18443d9b7574084879f9be615b45c4255ec3921'
                revision='a9b010a8710e97634231f0beeb0086b7cf5986997dc91a598c67bf1af423db03'
                assert proof['plan_revision']==revision
                result=proof['result']
                assert set(result)=={'status','verified_roots','compacted_roots','protected_roots','word_artifacts','dashboard_artifacts','original_catalog_equivalent','journal_sha256','marker_sha256'}
                assert result['status']=='RETAINED_STATE_VERIFIED' and result['original_catalog_equivalent'] is True
                expected={'verified_roots':99,'compacted_roots':92,'protected_roots':7,'word_artifacts':249,'dashboard_artifacts':99}
                assert all(type(result[k]) is int and result[k]==v for k,v in expected.items())
                assert all(isinstance(result[k],str) and re.fullmatch('[a-f0-9]{64}',result[k]) for k in ('journal_sha256','marker_sha256'))
                return '83b813ab250b4533d1b80ba9e306afaa8bc5f383:'+revision+':'+result['journal_sha256']+':'+result['marker_sha256']
            def load_reviewed_finalize_token():
                proof_path=Path('/root/codex-fixes/weekly-38902081199/retained-readback-38903432153.json')
                for parent in proof_path.parents:
                    info=parent.lstat();assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
                with os.fdopen(os.open(proof_path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as stream:
                    info=os.fstat(stream.fileno())
                    assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=8192
                    return reviewed_finalize_token(json.load(stream))
            run='${{ github.run_id }}';assert run.isdigit()
            mode='${{ github.event.head_commit.message == 'Prepare identity copy for accepted 43f10742' && 'identity' || github.event.head_commit.message == 'Apply prepared identity metadata for accepted 43f10742' && 'identity-apply' || github.event.head_commit.message == 'Apply weekly retention for accepted 43f10742' && 'compaction-apply' || github.event.head_commit.message == 'Verify retained publications for accepted 43f10742' && 'readback' || github.event.head_commit.message == 'Finalize reviewed publications for accepted 43f10742' && 'finalize' || github.event.head_commit.message == 'Verify finalized publications for accepted 43f10742' && 'finalized-readback' || 'plan' }}'
            root=Path('/root/codex-fixes')/('weekly-check-'+run)
            root.mkdir(mode=0o700);os.umask(0o077)
            body=base64.b64decode(os.environ['WEEKLY_CODE'],validate=True)
            assert len(body)<=40960 and hashlib.sha256(body).hexdigest()==os.environ['WEEKLY_SHA']
            path=root/'operator.py';path.write_bytes(body);path.chmod(0o600)
            check=base64.b64decode(os.environ['WEEKLY_READBACK_CODE'],validate=True)
            assert len(check)<=16384 and hashlib.sha256(check).hexdigest()==os.environ['WEEKLY_READBACK_SHA']
            readback=root/'readback.py';readback.write_bytes(check);readback.chmod(0o600)
            stage=Path('/root/codex-fixes/weekly-38902081199')
            python=stage/'venv/bin/python'
            probe='import sysconfig;print(sysconfig.get_path("purelib"))'
            site=subprocess.check_output([str(python),'-IB','-c',probe],timeout=15,text=True).strip()
            assert re.fullmatch(re.escape(str(stage))+r'/venv/lib/python[0-9.]+/site-packages',site)
            unit='aemr-weekly-compaction-'+run+'.service'
            command=['systemd-run','--quiet','--wait','--unit',unit,'--property','Type=exec',
                '--property','KillMode=process','--property','ExitType=cgroup','--property','UMask=0077',
                '--property','RuntimeMaxSec=900','--property','TimeoutStopSec=10',
                '--property','MemoryMax=1G','--property','MemorySwapMax=256M','--property','CPUQuota=40%',
                '--property','Nice=19','--property','StandardOutput=append:'+str(root/'operator.log'),
                '--property','StandardError=append:'+str(root/'operator.log'),
                str(python),'-IB',str(path),'--operator-run',run,'--tree',str(stage/'source'),
                '--python',str(python),'--reader-package',site+'/procurement_engine',
                '--ci-evidence',str(stage/'ci.json'),'--source-receipt',str(stage/'source-receipt.json'),
                '--worker-acceptance','/var/lib/aemr/worker-quarantine/acceptance-38860353565-1/result.json',
                '--backup-reference','worker-38831492016/backup','--operation','apply','--expected-revision','live','--check']
            if mode in {'compaction-apply','finalize'}:
                # Measured361 CPU seconds exhausted900s at the old0.4 quota.
                # Low weight/nice preserve API priority; do not extend runtime.
                command[command.index('CPUQuota=40%')]='CPUQuota=100%'
                command[command.index(str(python)):command.index(str(python))]=['--property','CPUWeight=10']
            if mode in {'compaction-apply','readback','finalized-readback'}:
                # Bind only after successful private plan and independent review.
                revision='a9b010a8710e97634231f0beeb0086b7cf5986997dc91a598c67bf1af423db03'
                assert re.fullmatch('[a-f0-9]{64}',revision)
                if mode=='compaction-apply':command.remove('--check')
                else:command+=['--retained-readback',str(readback)]
                command[command.index('--expected-revision')+1]=revision
                if mode=='finalized-readback':command.append('--finalized-readback')
            if mode=='finalize':
                # Independent readback used the installed43 reader and staged83
                # tools. Keep its exact private receipt and source digest.
                token=load_reviewed_finalize_token()
                command.remove('--check')
                command[command.index('--operation')+1]='finalize'
                command[command.index('--expected-revision')+1]=token.split(':')[1]
                command+=['--finalize-review',token]
            if mode=='identity':command.append('--identity-copy')
            if mode=='identity-apply':command.remove('--check');command.append('--identity-apply')
            if mode=='finalized-readback':load_reviewed_finalize_token()
            free_before=shutil.disk_usage(root).free
            result=subprocess.run(command,capture_output=True,timeout=920,check=False)
            if mode=='finalize':print(json.dumps({'storage_free_before':free_before,'storage_free_after':shutil.disk_usage(root).free}))
            for line in (root/'operator.log').read_text().splitlines():
                if line in {'HOST_NATIVE_PREFLIGHT_PASS_NO_COMPACTION','HOST_NATIVE_PREFLIGHT_PASS','WEEKLY_OPERATOR_BLOCKED',
