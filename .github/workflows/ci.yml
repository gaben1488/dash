                    parts=Path(name).parts
                    if len(parts)>=4 and parts[:3]==('reports','published','releases'):roots.add('/'.join(parts[:4]))
                    if len(parts)>=3 and parts[:2]==('reports','archives') and parts[2].startswith('WEEKLY-'):roots.add('/'.join(parts[:3]))
                for root in roots:
                    tree=volume/root
                    actual={path.relative_to(volume).as_posix()+('/' if path.is_dir() else '') for path in [tree,*tree.rglob('*')]}
                    assert actual=={name for name in expected if name.startswith(root+'/')}
                for name,before in expected.items():
                    if not (name.startswith('reports/published/releases/') or name.startswith('reports/archives/WEEKLY-')):continue
                    path=volume/name;assert not path.is_symlink();info=path.stat()
                    after={'uid':info.st_uid,'gid':info.st_gid,'mode':stat.S_IMODE(info.st_mode)}
                    if before.get('kind')=='directory':assert path.is_dir();after.update(kind='directory',bytes=0)
