             r,plan=current_release_plan(accepted=True)
             assert plan['release_sha']=='af5b233502f30b36a0c049765e1ffdbec2877145'
             base=Path('/var/lib/aemr/worker-quarantine')/name
             if not os.path.lexists(base/'result.json'):
              print(json.dumps({'accepted_worker':False,'state':'NOT_ACCEPTED','reason':'CURRENT_RECEIPT_MISSING'}),flush=True)
              return
             def read(name,limit=8*1024*1024):
              path=base/name
              assert not any(parent.is_symlink() for parent in (path,*path.parents))
              with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK),'rb') as stream:
               info=os.fstat(stream.fileno());assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and 0<info.st_size<=limit
               body=stream.read(limit+1);assert len(body)<=limit
               return json.loads(body)
             result=read('result.json')
             assert result['state']=='TWO_AUTONOMOUS_CYCLES_VERIFIED' and result['source_sha']=='af5b233502f30b36a0c049765e1ffdbec2877145'
             assert result['native_word']=='PASS' and type(result['sealed_entries_verified']) is int
             observer_start=datetime.fromisoformat(result['observation_since']);worker_start=datetime.fromisoformat(result['worker_started_at'])
             cutoff=datetime.fromisoformat(result['eligibility_since'])
             assert all(value.tzinfo is not None for value in (observer_start,worker_start,cutoff))
             assert cutoff==max(observer_start,worker_start)
             worker=r.ReleaseRecovery(lock_fd=None)._records(plan,candidate=True)['report-worker']
             assert worker['State']['Status']=='running' and worker['Image']==plan['candidate_images']['report-worker']
             assert datetime.fromisoformat(worker['State']['StartedAt'])==worker_start
             print(json.dumps({'accepted_worker':True,'sealed_entries_verified':result['sealed_entries_verified'],
              'observer_armed_at':result['observation_since'],'worker_started_at':result['worker_started_at'],
              'eligibility_since':result['eligibility_since']}),flush=True)
             # Cycle files retain complete publication evidence. Project the
             # small attribution receipts and file metadata, not those payloads.
             for index in (1,2):
              info=(base/('cycle-'+str(index)+'.json')).lstat()
              print(json.dumps({'cycle_receipt':index,'bytes':info.st_size,'private_regular':stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600}),flush=True)
             attempts=result['attempt_ids']
             assert isinstance(attempts,list) and len(attempts)==2 and all(isinstance(v,str) and re.fullmatch('[a-f0-9]{32}',v) for v in attempts) and len(set(attempts))==2
             assert type(result['attempt_proofs_verified']) is int and result['attempt_proofs_verified']==2
             assert type(result['reference_attempts_verified']) is int and 0<=result['reference_attempts_verified']<=2
             def status_metadata(path):
              assert not any(parent.is_symlink() for parent in (path,*path.parents))
              info=path.lstat()
              assert stat.S_ISREG(info.st_mode) and info.st_uid==1000 and info.st_nlink==1 and not info.st_mode&0o022
              allocated=info.st_blocks*512
              assert 0<=info.st_size<=2**53-1 and 0<=allocated<=2**53-1
              return {'logical_bytes':info.st_size,'allocated_bytes':allocated}
             reports=Path('/var/lib/docker/volumes/aemr_server_data/_data/reports')
             references=0
             for index,attempt in enumerate(attempts,1):
              assert re.fullmatch('[a-f0-9]{32}',attempt)
              proof=read('attribution-'+attempt+'.json')
              assert proof['double_host_flock'] is True and len(proof['samples'])==2 and all(item['held'] is True for item in proof['samples'])
              assert re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9:.]+(?:Z|\+00:00)',proof['started_at'])
              assert datetime.fromisoformat(proof['started_at'])>=cutoff
              print(json.dumps({'accepted_attempt_id':attempt,'started_at':proof['started_at'],'double_host_flock':True}),flush=True)
              proof=read('attempt-proof-'+attempt+'.json',limit=4096)
              assert isinstance(proof,dict) and set(proof)=={'scope','format','coverage','proof_matches','global_compatible','retained_bytes','global_bytes'}
              assert proof['scope']=='SINGLE_RETAINED_ATTEMPT' and proof['coverage'] in {'OBSERVED','NOT_OBSERVED'} and proof['proof_matches'] is True
              observed=proof['coverage']=='OBSERVED';references+=observed
              assert proof['format']==('REFERENCE' if observed else 'INLINE') and proof['global_compatible'] is (True if observed else None)
              assert type(proof['retained_bytes']) is int and 0<proof['retained_bytes']<=32*1024*1024
              assert (type(proof['global_bytes']) is int and 0<proof['global_bytes']<=32*1024*1024) if observed else proof['global_bytes'] is None
              metadata=status_metadata(reports/'attempts'/attempt/'status.json')
              assert metadata['logical_bytes']==proof['retained_bytes']
              print(json.dumps({'accepted_attempt_proof':index,'proof':proof,'retained_status_logical_bytes':metadata['logical_bytes'],
               'retained_status_allocated_bytes':metadata['allocated_bytes'],'retained_status_content_reverified':False}),flush=True)
             assert references==result['reference_attempts_verified']
             print(json.dumps({'scope':'CURRENT_GLOBAL_LSTAT_ONLY',**status_metadata(reports/'status.json'),'content_reverified':False}),flush=True)

