                window=json.loads(r.read_owned(r.BACKUP_BASE/Path(plan['backup_reference']).parent/'release-window.json'))
                assert window.get('candidate')==sha and set(window['module_sha256'])=={'release-controller.py','release_recovery.py','release_trial.py','stateful_backup.py','source_ci_gate.py'}
                for name,pin in window['module_sha256'].items():assert r.digest(r.read_owned(tools/name,private=False))==pin
                m=types.ModuleType('accepted_worker_observation');m.__file__=str(tools/'accepted-worker-source.py')
                exec(compile(git('show',sha+':deploy/worker_recovery.py'),m.__file__,'exec'),m.__dict__)
                def readonly(args,*,timeout=45,**kwargs):
                    allowed=args[0] in {'inspect','ps','top'} or args[:2]==['volume','inspect']
                    allowed=allowed or args==['exec','aemr-server-1','/opt/report-env/bin/python','-m','procurement_engine.deployment_smoke']
                    assert allowed,'READ_ONLY_COMMAND_REQUIRED'
                    result=subprocess.run(['docker',*args],capture_output=True,text=True,timeout=timeout,check=False)
                    if result.returncode:raise m.RecoveryError('WORKER_OBSERVATION_IO_FAILED')
                    return result.stdout
                executor=r.ReleaseRecovery(command=readonly)
                baseline=executor._records(plan,candidate=True);volume=executor._volume(plan)
                worker_id=baseline['report-worker']['Id'];image=plan['candidate_images']['report-worker']
                started=json.loads(r.read_owned(r.STATE_DIR/'worker-quarantine/worker-start.json'))
                assert started=={'state':'REPAIRED_WORKER_STARTED_NOT_ACCEPTED','release_sha':sha,'worker':worker_id,'image':image}
                since=baseline['report-worker']['State']['StartedAt'];interval=900
                cmd=baseline['report-worker']['Config']['Cmd'];assert cmd[cmd.index('--interval-seconds')+1]=='900'
                session_created=False
                session=r.STATE_DIR/'worker-quarantine'/('acceptance-'+sys.argv[2]+'-'+sys.argv[3]);session.mkdir(mode=0o700);session_created=True
                def save(name,value):r.atomic_json(session/name,value)
                def stable(records):
                    return {role:{**{k:record[k] for k in ('Id','Image','Config','HostConfig','RestartCount')},
                        'Mounts':sorted(json.dumps(v,sort_keys=True) for v in record['Mounts']),
                        'started':record['State']['StartedAt']} for role,record in records.items()}
                def check():
                    assert not any(os.path.lexists(r.STATE_DIR/name) for name in ('pending-release.json','release-recovery-progress.json'))
                    assert not list(r.BACKUP_BASE.glob('*/quiescent'))
                    current=executor._records(plan,candidate=True);assert stable(current)==stable(baseline)
                    assert all(v['State']['Status']=='running' and not v['State']['OOMKilled'] for v in current.values())
                    assert current['server']['State'].get('Health',{}).get('Status')=='healthy'
                    top=readonly(['top','aemr-server-1'])
                    if re.search(r'proc-report\s+(?:run-google|worker)|procurement_engine.*(?:run-google|worker)',top):raise m.RecoveryError('WORKER_CONCURRENT_MANUAL_WRITER')
                def read_status():
                    path=volume/'reports/status.json'
                    assert not path.is_symlink() and path.stat().st_size<=64*1024*1024
                    return json.loads(path.read_bytes())
                samples=[]
                def holds_lock():
                    info=(volume/'reports/run.lock').stat();metadata=(os.major(info.st_dev),os.minor(info.st_dev),info.st_ino)
                    pids={int(value) for value in readonly(['top',worker_id,'-eo','pid']).splitlines()[1:]}
                    locks=Path('/proc/locks').read_text();held=m.worker_lock_held(locks,pids,*metadata)
                    samples.append({'observed_at':datetime.now(timezone.utc).isoformat(),'device_inode':metadata,'pids':sorted(pids),'held':held,'locks':locks})
                    samples[:]=samples[-2:]
                    if held:save('latest-double-lock-samples.json',samples)
                    return held
                def native_smoke():
                    result=json.loads(readonly(['exec','aemr-server-1','/opt/report-env/bin/python','-m','procurement_engine.deployment_smoke'],timeout=180))
                    if any(result.get(k)!='PASS' for k in ('context','snapshot','main','supplement','operational')):raise m.RecoveryError('WORKER_WORD_SMOKE_FAILED')
                observation_since=datetime.now(timezone.utc).isoformat()
                save('observation.json',{'worker_started_at':since,'observation_since':observation_since,'source_sha':sha})
                result=observe();check()
                manifest_body=r.read_owned(r.BACKUP_BASE/plan['backup_reference']/'manifest.json',limit=64*1024*1024)
                assert r.digest(manifest_body)==plan['manifest_sha256']
                expected=json.loads(manifest_body)['files'];count=0
                roots=set()
                for name in expected:
                    parts=Path(name).parts
                    if len(parts)>=4 and parts[:3]==('reports','published','releases'):roots.add('/'.join(parts[:4]))
                    if len(parts)>=3 and parts[:2]==('reports','archives') and parts[2].startswith('WEEKLY-'):roots.add('/'.join(parts[:3]))
                for root in roots:
                    tree=volume/root
                    actual={path.relative_to(volume).as_posix()+('/' if path.is_dir() else '') for path in [tree,*tree.rglob('*')]}
                    assert actual=={name for name in expected if name.startswith(root+'/')}
                for name,before in expected.items():
                    if not (name.startswith('reports/published/releases/') or name.startswith('reports/archives/WEEKLY-')):continue
                    path=volume/name;assert not path.is_symlink();info=path.stat()
                    after={'uid':info.st_uid,'gid':info.st_gid,'mode':stat.S_IMODE(info.st_mode)}
                    if before.get('kind')=='directory':assert path.is_dir();after.update(kind='directory',bytes=0)
                    else:
                        assert path.is_file()
                        with path.open('rb') as stream:digest=hashlib.file_digest(stream,'sha256').hexdigest()
                        after.update(bytes=info.st_size,sha256=digest)
                    assert after==before;count+=1
                assert count>0
                result.update(source_sha=sha,observer_sha='${{ github.sha }}',sealed_entries_verified=count)
                save('result.json',result);print('TWO_AUTONOMOUS_CYCLES_VERIFIED_AND_SEALED_HISTORY_UNCHANGED')
            except Exception as error:
                code=str(error) if type(error).__name__=='RecoveryError' and re.fullmatch('[A-Z_]{5,100}',str(error)) else 'WORKER_OBSERVATION_REJECTED'
                if globals().get('session_created'):save('pending.json',{'state':'NOT_ACCEPTED','reason':code})
                print(code);raise SystemExit(3 if code=='WORKER_TWO_CYCLES_TIMED_OUT' else 2) from None
            PYACCEPTCURRENT
