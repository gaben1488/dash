               'SYSTEMD_FAILED':r'Failed to start|Job failed|Result: failed'}
              exceptions={'AssertionError','CalledProcessError','ModuleNotFoundError','ImportError','FileNotFoundError','PermissionError','NotADirectoryError','MemoryError','OSError','ReadError','ExtractError','FilterError','TimeoutExpired'}
              return {'codes':sorted(code for code,pattern in patterns.items() if re.search(pattern,body)),
               'exceptions':sorted(exceptions&set(re.findall(r'\b[A-Za-z]+Error\b|\bTimeoutExpired\b',body))),
               'errnos':sorted({int(value) for value in re.findall(r'\[Errno ([0-9]{1,3})\]',body)}&{1,2,5,12,13,20,24,28,30,36,40,110})}
             base=Path('/root/codex-fixes/weekly-38835101809')
             for name,limit in [('setup.log',8*1024*1024),('setup.phase',64)]:
              path=base/name;row={'weekly_stage_file':name,'present':os.path.lexists(path)}
              try:
               assert not any(parent.is_symlink() for parent in (path,*path.parents))
               if row['present']:
                with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK),'rb') as file:
                 info=os.fstat(file.fileno());row['bytes']=info.st_size
                 assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1 and stat.S_IMODE(info.st_mode)==0o600 and info.st_size<=limit
                 body=file.read(limit+1);assert len(body)<=limit
                if name=='setup.log':row.update(project(body.decode('utf-8',errors='replace')))
                else:
                 phase=body.decode('ascii',errors='replace').strip();row['phase']=phase if phase in {'SOURCE_CI','PACKAGE','TRANSFER','HOST_SETUP','VERIFY'} else 'UNKNOWN'
              except (OSError,AssertionError) as error:
