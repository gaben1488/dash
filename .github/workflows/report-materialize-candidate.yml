name: Report candidate materialization
on:
  push:
    branches: [codex/report-root-causes-and-actions]
    paths: [.github/workflows/report-materialize-candidate.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply public code patch
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          parts=sorted(Path('.github/report-transfer').glob('chunk*.b64'))
          assert len(parts)==7
          data=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert len(data)==60572
          assert hashlib.sha256(data).hexdigest()=='3d3734bcc402f216ac6af2e2d1fb70b7309a91cad755e0ed2aade27d1f493d18'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='8a2cff3dc365281de393cfe23d2c79eb2847809c7e40adf1c7c7594075200208'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Run engine checks
        run: |
          python -m pip install -e 'packages/report-engine[test]'
          python -m ruff check packages/report-engine
          git diff --check
          mkdir -p evidence
          python -m pytest packages/report-engine/tests -q --junitxml=evidence/python-tests.xml
      - name: Save exact verified candidate tree without changing production refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from urllib.request import Request,urlopen
          names=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          names.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          names.discard('evidence/python-tests.xml')
          assert len(names)==50, sorted(names)
          entries=[]; hashes={}
          for name in sorted(names):
              assert name.startswith(('packages/report-engine/','packages/web/','packages/shared/','docs/decisions/')) or name=='.github/workflows/report-rehearsal.yml',name
              path=Path(name)
              assert path.is_file() and not path.is_symlink()
              content=path.read_bytes()
              hashes[name]=hashlib.sha256(content).hexdigest()
              entries.append({'path':name,'mode':'100644','type':'blob','content':content.decode('utf-8')})
          base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          request=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/trees',
              data=json.dumps({'base_tree':base_tree,'tree':entries}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urlopen(request,timeout=60) as response: tree=json.load(response)['sha']
          subprocess.run(['git','add','--',*sorted(names)],check=True)
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==expected,(tree,expected)
          Path('evidence/CANDIDATE_TREE.txt').write_text(tree+'\n')
          Path('evidence/SOURCE_SHA256.json').write_text(json.dumps(hashes,indent=2))
          print('CANDIDATE_TREE_SHA='+tree)
          with Path('evidence/source.tar.gz').open('wb') as stream:
              subprocess.run(['git','archive','--format=tar.gz','--prefix=dash/',tree],stdout=stream,check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: report-candidate-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 3
