name: Owner-authorized VPS build cache cleanup

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  cache-only:
    if: >-
      github.event.label.name == 'maintenance: build-cache-only' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prune regenerable cache and verify deployment state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:deploy/cleanup-build-cache.sh" > "$tool"
            bash "$tool"
