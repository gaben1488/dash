          docker build --label "org.opencontainers.image.revision=$RECOVERY_SHA" \
            -f deploy/Dockerfile.server -t "aemr-server:release-$RECOVERY_SHA" .
          docker build --label "org.opencontainers.image.revision=$RECOVERY_SHA" \
            -f deploy/Dockerfile.web -t "aemr-web:release-$RECOVERY_SHA" .
          docker image inspect "aemr-server:release-$RECOVERY_SHA" "aemr-web:release-$RECOVERY_SHA" \
            > "$RUNNER_TEMP/release/candidate-images.json"
      - name: Check real latest Word envelope with candidate schemas before downtime
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          # Raw response travels only over the private pipe; neither side logs it.
          program=$(cat <<'JSREPORT'
          (async()=>{
            const fail=code=>{console.log(code);process.exitCode=2;};
            let size=0;const parts=[];
            for await(const part of process.stdin){size+=part.length;if(size>33554432)return fail('LIVE_REPORT_BODY_TOO_LARGE');parts.push(part);}
            if(!size)return fail('LIVE_REPORT_BODY_EMPTY');
            let value;try{value=JSON.parse(Buffer.concat(parts).toString('utf8'));}catch{return fail('LIVE_REPORT_JSON_INVALID');}
            let shared;try{shared=await import('@aemr/shared');}catch{return fail('LIVE_REPORT_SCHEMA_IMPORT_FAILED');}
            if(typeof shared.ReportReleaseStatusSchema?.safeParse!=='function')return fail('LIVE_REPORT_SCHEMA_IMPORT_FAILED');
            if(value&&typeof value==='object'&&!Object.hasOwn(value,'latest'))return fail('LIVE_REPORT_LATEST_MISSING');
            if(value?.latest===null)return fail('LIVE_REPORT_LATEST_NULL');
            if(!shared.ReportReleaseStatusSchema.safeParse(value).success)return fail('LIVE_REPORT_SCHEMA_INVALID');
            console.log('LIVE_LATEST_REPORT_SCHEMA_PASS');
          })().catch(()=>{console.log('LIVE_REPORT_CHECK_FAILED');process.exitCode=2;});
          JSREPORT
          )
          set +e
          remote sudo -n docker exec -i aemr-server-1 python3 -I - 2> "$RUNNER_TEMP/release/live-envelope-read.log" <<'PY' | \
            docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m -i \
              --entrypoint node "aemr-server:release-$RECOVERY_SHA" --import tsx --eval "$program" \
              > "$RUNNER_TEMP/release/live-envelope-check.log" 2> "$RUNNER_TEMP/release/live-schema-runtime.log"
          import os,sys,urllib.request
          try:
           key=os.environ.get('AEMR_API_KEY','')
           if not key:raise ValueError('auth')
           request=urllib.request.Request('http://127.0.0.1:3000/api/report-releases',headers={'Authorization':'Bearer '+key})
           with urllib.request.urlopen(request,timeout=25) as response:
            if response.status!=200:raise ValueError('status')
            body=response.read(32*1024*1024+1)
           if len(body)>32*1024*1024:raise ValueError('size')
           sys.stdout.buffer.write(body)
          except Exception:
           print('LIVE_REPORT_READ_FAILED',file=sys.stderr);raise SystemExit(2) from None
          PY
          outcome=("${PIPESTATUS[@]}")
          set -e
          if test "${outcome[0]}" != 0; then echo LIVE_REPORT_READ_FAILED; fi
          if test "${outcome[1]}" != 0; then
            grep -E '^LIVE_REPORT_(BODY_TOO_LARGE|BODY_EMPTY|JSON_INVALID|SCHEMA_IMPORT_FAILED|LATEST_MISSING|LATEST_NULL|SCHEMA_INVALID|CHECK_FAILED)$' \
              "$RUNNER_TEMP/release/live-envelope-check.log" || echo LIVE_REPORT_NODE_BOOTSTRAP_FAILED
          fi
          test "${outcome[0]}:${outcome[1]}" = 0:0
          grep -Fx LIVE_LATEST_REPORT_SCHEMA_PASS "$RUNNER_TEMP/release/live-envelope-check.log"
      - name: Install reviewed recovery tools and stage actual unchanged runtime
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          # No checkout reset, runtime recreation, or business-state write here.
          remote git -C /home/aemr/dash fetch --quiet origin "$RECOVERY_SHA"
          git archive "$RECOVERY_SHA" deploy .github/ci/source_ci_gate.py | \
            remote "sudo -n install -d -m 700 /root/codex-fixes/release-$RECOVERY_RUN && sudo -n tar --no-same-owner -xf - -C /root/codex-fixes/release-$RECOVERY_RUN"
          docker save "aemr-server:release-$RECOVERY_SHA" "aemr-web:release-$RECOVERY_SHA" | gzip -1 | \
            remote sudo -n docker load > "$RUNNER_TEMP/release/image-load.log" 2>&1
          remote sudo -n bash "/root/codex-fixes/release-$RECOVERY_RUN/deploy/install-runtime-guard.sh" \
            /home/aemr/dash/deploy > "$RUNNER_TEMP/release/install.log" 2>&1 || { echo RELEASE_TOOL_INSTALL_FAILED; exit 2; }
          python3 - <<'PY' > "$RUNNER_TEMP/release/stage-request.json"
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'release';images=json.loads((p/'candidate-images.json').read_text())
          print(json.dumps({'release_sha':os.environ['RECOVERY_SHA'],
            'candidate_images':dict(zip(('server','web'),(x['Id'] for x in images),strict=True)),
            'source_ci':json.loads((p/'source-ci.json').read_text())}))
          PY
          remote "sudo -n bash -c '. /root/codex-fixes/release-$RECOVERY_RUN/deploy/maintenance-lock.sh; maintenance_lock_acquire; exec python3 -Es /usr/local/libexec/aemr/release-controller.py stage'" \
            < "$RUNNER_TEMP/release/stage-request.json" > "$RUNNER_TEMP/release/stage.log" 2>&1 || { echo RELEASE_RUNTIME_STAGE_FAILED; exit 2; }
          remote sudo -n cat /var/lib/aemr/release-runtime/stage.json > "$RUNNER_TEMP/release/stage.json"
          # Private exact previous images are loaded on runner before downtime.
          previous=$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'release/stage.json').read_text())
          print(' '.join(sorted(set(x['images'].values()))))
          PY
          )
          remote sudo -n docker save $previous | docker load > "$RUNNER_TEMP/release/previous-image-load.log" 2>&1
          # A restore trial cannot use a host-specific image identifier. Verify
          # actual previous images before the guardian stops any production writer.
          for identity in $previous; do
            test "$(sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin DOCKER_CONFIG=/etc/aemr/docker /usr/bin/docker image inspect "$identity" --format '{{.Id}}')" = "$identity"
          done
          # Read only the staged, hash-bound environment before any API freeze.
          remote sudo -n python3 -EsB - <<'PYENVBEFOREFREEZE'
          import json,sys
          sys.path.insert(0,'/usr/local/libexec/aemr')
          import release_recovery as r
          import release_trial as t
          stage=json.loads(r.read_owned(r.RUNTIME_DIR/'stage.json'))
          for kind in ('candidate','previous'):t.native_environment(stage,kind)
          print('RELEASE_NATIVE_ENVIRONMENT_ADMISSION_PASS')
          PYENVBEFOREFREEZE
          echo RELEASE_IMAGES_AND_CONFIGURATION_READY
      - name: Admit independent full-restore capacity before production downtime
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          # Drop only regenerable runner build cache. All immutable candidate and
          # previous images remain available for both directions of the trial.
          docker builder prune --all --force > "$RUNNER_TEMP/release/runner-cache.log" 2>&1
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          stage=json.loads((Path(os.environ['RUNNER_TEMP'])/'release/stage.json').read_text())
          for identity in set(stage['images'].values())|set(stage['candidate_images'].values()):
           actual=subprocess.check_output(['docker','image','inspect',identity,'--format','{{.Id}}'],text=True).strip()
           assert actual==identity
          PY
          remote sudo -n python3 -Es - <<'PYVPSCAPACITY' > "$RUNNER_TEMP/release/capacity-input.json"
          import fcntl,json,os,shutil,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'/usr/local/libexec/aemr')
          import release_recovery as recovery
          fd=os.open('/run/lock/aemr-maintenance.lock',os.O_RDWR|os.O_NOFOLLOW)
          with os.fdopen(fd,'r+') as lock:
           fcntl.flock(fd,fcntl.LOCK_EX|fcntl.LOCK_NB)
           stage=json.loads(recovery.read_owned(Path('/var/lib/aemr/release-runtime/stage.json')))
           source=recovery.ReleaseRecovery(lock_fd=fd)._volume(stage)
           size=int(subprocess.check_output(['du','--summarize','--bytes','--count-links','--',str(source)],text=True,timeout=90).split()[0])
           print(json.dumps({'source_bytes':size,'vps_backup_free_bytes':shutil.disk_usage('/home/aemr/.dash-private-backups').free}))
          PYVPSCAPACITY
          python3 - <<'PYRUNNERCAPACITY'
          import json,os,shutil
          from pathlib import Path
          budget=json.loads((Path(os.environ['RUNNER_TEMP'])/'release/capacity-input.json').read_text())
          if any(type(budget.get(k)) is not int or budget[k]<0 for k in ('source_bytes','vps_backup_free_bytes')):
           raise SystemExit('RELEASE_CAPACITY_INPUT_INVALID')
          if budget['vps_backup_free_bytes']<4*1024**3:raise SystemExit('BACKUP_SPACE_BUDGET_INSUFFICIENT')
          # The writer always retains 1 GiB on VPS, which bounds archive growth.
          # Include the entire uncompressed clone + archive + 2 GiB runner reserve.
          required=budget['source_bytes']+budget['vps_backup_free_bytes']-1024**3+2*1024**3
          free=shutil.disk_usage('/var/lib').free
          if free<required:raise SystemExit('RELEASE_INDEPENDENT_SCRATCH_INSUFFICIENT')
          print(json.dumps({'status':'RELEASE_INDEPENDENT_CAPACITY_ADMITTED','free_bytes':free,'required_bytes':required}))
          PYRUNNERCAPACITY
      - name: Freeze writers once and create fresh full private backup
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$RECOVERY_SHA"
          window prepare > "$RUNNER_TEMP/release/prepare.log" 2>&1 || { echo RELEASE_BACKUP_PREPARE_FAILED; exit 2; }
          remote sudo -n python3 -Es /usr/local/libexec/aemr/release-controller.py base-plan "$RECOVERY_RUN" \
            > "$RUNNER_TEMP/release/base-plan.log" 2>&1 || { echo RELEASE_BASE_PLAN_FAILED; exit 2; }
          window request-plan > "$RUNNER_TEMP/release/request-plan.log" 2>&1 || { echo RELEASE_PLAN_REQUEST_FAILED; exit 2; }
          ready=false
          for attempt in $(seq 1 180); do
            if remote sudo -n test -f "/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/plan-prepared.json"; then ready=true; break; fi
            remote sudo -n test -f "/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/quiescent" || break
            sleep 2
          done
          test "$ready" = true || { echo RELEASE_PLAN_NOT_PREPARED; exit 2; }
      - name: Independent one-clone candidate and previous runtime with actual complete restore
        run: |
          set -euo pipefail
          umask 077
          . "$RUNNER_TEMP/release/ssh.sh"
          backup="/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup"
          sudo install -d -m 700 /var/lib/aemr /var/lib/aemr/release-runtime \
            /var/lib/aemr/release-trial-clone /home/aemr/.dash-private-backups \
            "/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN" "$backup" /usr/local/libexec/aemr
          for file in manifest.json state.tar.gz; do
            remote sudo -n cat -- "$backup/$file" | sudo tee "$backup/$file" >/dev/null
            sudo chmod 600 "$backup/$file"
          done
          for file in compose.json candidate-compose.json .env.production Caddyfile candidate-Caddyfile source-ci.json trial-plan.json; do
            remote sudo -n cat -- "/var/lib/aemr/release-runtime/$file" | sudo tee "/var/lib/aemr/release-runtime/$file" >/dev/null
            sudo chmod 600 "/var/lib/aemr/release-runtime/$file"
          done
          sudo install -m 755 deploy/stateful_backup.py deploy/release_recovery.py deploy/release_trial.py \
            .github/ci/source_ci_gate.py /usr/local/libexec/aemr/
          sudo python3 - "$backup" <<'PY'
          import json,shutil,sys
          from pathlib import Path
          m=json.loads((Path(sys.argv[1])/'manifest.json').read_text())
          if type(m.get('bytes')) is not int or m['bytes']<0 or shutil.disk_usage('/var/lib/aemr').free<m['bytes']+2*1024**3:
           raise SystemExit('RELEASE_INDEPENDENT_SCRATCH_INSUFFICIENT')
          PY
          trial_status=0
          sudo env GITHUB_ACTIONS=true RUNNER_OS=Linux python3 -EsB .github/ci/frozen_trial_replay.py \
            "$RUNNER_TEMP/release/trial-private.json" --release-proof \
            > "$RUNNER_TEMP/release/trial-proof.json" 2> "$RUNNER_TEMP/release/trial.log" || trial_status=$?
          # Retain the existing proof unchanged on success; keep attribution only
          # in private failure evidence, before the runner removes its clone.
          if sudo test -f "$RUNNER_TEMP/release/trial-private.json"; then
            sudo cat "$RUNNER_TEMP/release/trial-private.json" > "$RUNNER_TEMP/release/trial-diagnostic.log"
          fi
          if test "$trial_status" != 0; then
            cp "$RUNNER_TEMP/release/trial-proof.json" "$RUNNER_TEMP/release/trial-phase.log"
            echo RELEASE_INDEPENDENT_TRIAL_FAILED; exit 2
          fi
          # Never upload primary data, the archive, env, logs, or private receipts as artifacts.
          remote "sudo -n install -m 600 /dev/stdin /var/lib/aemr/release-runtime/trial-proof.json" \
            < "$RUNNER_TEMP/release/trial-proof.json"
          echo RELEASE_FULL_RESTORE_CANDIDATE_AND_PREVIOUS_RUNTIME_PASS
      - name: Same guardian exact-SHA release with closed-ingress API and Word acceptance
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/release/ssh.sh"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/79 --jq .head.sha)" = "$RECOVERY_SHA"
