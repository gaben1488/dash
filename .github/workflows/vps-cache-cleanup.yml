        run: |
          set -euo pipefail
          case "$RECOVERY_SHA" in *[!0-9a-f]*|'') exit 2 ;; esac
          test "${#RECOVERY_SHA}" = 40
          # Wait only before the maintenance window; no service has been stopped.
          ready=false
          for attempt in $(seq 1 30); do
            ci_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&event=pull_request" \
              --jq '.workflow_runs | map(select(.name == "CI")) | first | .id // empty')
            if test -n "$ci_run"; then
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" > "$RUNNER_TEMP/source-run.json"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
              python3 - "$RUNNER_TEMP/source-run.json" "$RUNNER_TEMP/source-jobs.json" <<'PYSOURCE' > "$RUNNER_TEMP/source-proof.json"
          import json, sys
          print(json.dumps({'run': json.load(open(sys.argv[1])), 'jobs': json.load(open(sys.argv[2]))['jobs']}))
          PYSOURCE
              if python3 .github/ci/source_ci_gate.py "$RECOVERY_SHA" < "$RUNNER_TEMP/source-proof.json"; then
                ready=true
                break
              fi
            fi
            sleep 20
          done
          test "$ready" = true
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 32212254720
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/worker-backup"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/worker-backup/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$RUNNER_TEMP/worker-backup/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/worker-backup/known_hosts"
          # Admission uses the same root owner as the installed 0600 lock.
          ssh -i "$RUNNER_TEMP/worker-backup/key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes \
            "$VPS_USER@193.233.91.162" sudo -n test -w /run/lock/aemr-maintenance.lock
      - name: Quiesce writers and create private full compressed backup
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" sudo -n bash -s -- prepare "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups --quiesce-worker < deploy/report-backup-window.sh
      - name: Transfer privately and prove complete independent scratch restore
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/worker-backup/backup" "$RUNNER_TEMP/worker-backup/scratch"
          # The root-owned private session stays 0700; binary data goes only
          # to disposable private files, never to public logs/artifacts.
          for file in manifest.json state.tar.gz; do
            ssh -i "$RUNNER_TEMP/worker-backup/key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes \
              "$VPS_USER@193.233.91.162" \
              "sudo -n cat -- /home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup/$file" \
              > "$RUNNER_TEMP/worker-backup/backup/$file"
          done
          # Root is needed to reproduce original file UIDs/GIDs in disposable restore.
          sudo python3 deploy/stateful_backup.py verify             --backup "$RUNNER_TEMP/worker-backup/backup"             --scratch-parent "$RUNNER_TEMP/worker-backup/scratch"             > "$RUNNER_TEMP/worker-backup/restore.json"
          cat "$RUNNER_TEMP/worker-backup/restore.json"
      - name: Match still-quiesced original bytes after successful restore
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" sudo -n bash -s -- match-source "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups --quiesce-worker < deploy/report-backup-window.sh
          echo 'FULL_BACKUP_EXTERNAL_RESTORE_AND_SOURCE_MATCH_PASS'
      - name: Always resume original healthy API and authorized prior worker; retain private backup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/worker-backup/key"; then
            ssh -i "$RUNNER_TEMP/worker-backup/key"               -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes               "$VPS_USER@193.233.91.162" sudo -n bash -s -- resume "$RECOVERY_SHA" "$RECOVERY_RUN"               /home/aemr/dash /home/aemr/.dash-private-backups --quiesce-worker < deploy/report-backup-window.sh
          fi
      - name: Remove all private runner copies and credentials
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/worker-backup"
  current-worker-compat:
