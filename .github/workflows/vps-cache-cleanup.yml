name: Owner-authorized VPS build cache cleanup

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  runtime-readback:
    if: >-
      github.event.label.name == 'maintenance: runtime-readback' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Compare two read-only Docker state samples without cleanup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:deploy/runtime-state-probe.py" > "$tool"
            python3 -B "$tool"
            df -PB1 /
  identity-retention-proof:
    if: >-
      github.event.label.name == 'maintenance: identity-retention-proof' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prove historical identity recovery on private scratch restore
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 14m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            git archive "$candidate" packages/report-engine deploy/plan-weekly-publications.py \
              deploy/prove-weekly-identity-recovery.py | tar -x -C "$work"
            # This directory contains reviewed repository code only, no live data.
            chmod -R a+rX "$work"
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            data_volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/packages/server/data"}}{{if eq .Type "volume"}}{{.Name}}{{end}}{{end}}{{end}}' "$server")
            case "$data_volume" in ''|*[!A-Za-z0-9_.-]*) exit 2 ;; esac
            docker volume inspect "$data_volume" >/dev/null
            docker run --rm --network none --read-only \
              --mount type=volume,dst=/tmp \
              -v "$data_volume:/app/packages/server/data:ro" \
              -v "$work:/candidate:ro" \
              -e PYTHONPATH=/candidate/packages/report-engine/src \
              --entrypoint /opt/report-env/bin/python "$image" -B \
              /candidate/deploy/prove-weekly-identity-recovery.py --state /app/packages/server/data/reports
  weekly-census:
    if: >-
      github.event.label.name == 'maintenance: weekly-census' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Read-only weekly publication and identity census
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            catalog=$(mktemp)
            planner=$(mktemp)
            trap 'rm -f "$tool" "$catalog" "$planner"' EXIT
            git show "$candidate:packages/report-engine/src/procurement_engine/readonly_catalog.py" > "$catalog"
            git show "$candidate:deploy/plan-weekly-publications.py" > "$planner"
            python3 - "$catalog" "$planner" "$tool" <<'PYPROBE'
            import sys
            from pathlib import Path
            catalog, planner, output = map(Path, sys.argv[1:])
            bootstrap = "import sys, types\nmodule=types.ModuleType('procurement_engine.readonly_catalog')\n"
            bootstrap += "exec(compile(" + repr(catalog.read_text()) + ", '<reviewed-catalog>', 'exec'), module.__dict__)\n"
            bootstrap += "sys.modules[module.__name__]=module\n"
            output.write_text(bootstrap + "exec(compile(" + repr(planner.read_text()) + ", '<reviewed-weekly-plan>', 'exec'))\n")
            PYPROBE
            cd deploy
            df -PB1 /
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -B - \
              --state /app/packages/server/data/reports < "$tool"
  attempt-payloads:
    if: >-
      github.event.label.name == 'maintenance: transient-attempts' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Compact old transient payloads preserving weekly and current evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:packages/report-engine/src/procurement_engine/retention.py" > "$tool"
            cat >> "$tool" <<'PYCOMPACT'
            state = "/app/packages/server/data/reports"
            plan = plan_transient_attempt_retention(state, keep_full=2)
            print(json.dumps({"attempt_retention_plan": {k: plan.get(k) for k in (
                "status", "attempt_count", "compact_count", "bytes_reclaimable",
                "protected_unsealed_thursdays", "malformed_or_unsafe_entries")}}, sort_keys=True))
            result = apply_transient_attempt_retention(state, keep_full=2,
                expected_attempts=plan["compact_attempts"])
            print(json.dumps({"attempt_retention_result": {k: result.get(k) for k in (
                "status", "compacted", "bytes_reclaimed")}}, sort_keys=True))
            if result["status"] not in {"COMPACTED", "NO_ATTEMPTS"}:
                raise SystemExit(2)
            if result.get("compacted", 0) != plan.get("compact_count", 0):
                raise SystemExit(2)
            PYCOMPACT
            cd deploy
            df -PB1 /
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -B - < "$tool"
            df -PB1 /
  cache-only:
    if: >-
      github.event.label.name == 'maintenance: build-cache-only' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prune regenerable cache and verify deployment state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:deploy/cleanup-build-cache.sh" > "$tool"
            bash "$tool"
