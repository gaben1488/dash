name: Owner-authorized VPS maintenance

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  accepted-repaired-worker:
    if: >-
      github.event.label.name == 'maintenance: accepted-repaired-worker' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 79 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Require the accepted release to be the current candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/pulls/79 --jq .head.sha)" = '${{ github.event.pull_request.head.sha }}'
      - name: Start only the accepted repaired worker after native API and Word checks
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -euo pipefail
            sudo -n python3 -I - '${{ github.event.pull_request.head.sha }}' <<'PYWORKERSTART'
            import fcntl,hashlib,importlib.util,json,os,re,stat,sys
            from contextlib import ExitStack
            from pathlib import Path
            os.umask(0o077)
            state=Path('/var/lib/aemr');runtime=state/'release-runtime';tools=Path('/usr/local/libexec/aemr')
            old_image='sha256:a2b6a1b9a4726e620f77405468f877a20ba1de07c69b8ede4e16a52b46198bac'
            def read(path, *, private=True, owner=0, limit=1024*1024):
             assert not any(p.is_symlink() for p in (path,*path.parents))
             with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as file:
              info=os.fstat(file.fileno())
              assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid in ({0,1000} if owner is None else {owner})
              assert info.st_size<=limit
              if owner is not None:assert stat.S_IMODE(info.st_mode)==0o600 if private else not info.st_mode&0o022
              return file.read(limit+1)
            try:
             sha=sys.argv[1];assert os.geteuid()==0 and re.fullmatch('[a-f0-9]{40}',sha)
             for directory in (state,runtime,tools,tools.parent):
              assert not any(p.is_symlink() for p in (directory,*directory.parents))
              info=directory.lstat();assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and not info.st_mode&0o022
             fd=os.open('/run/lock/aemr-maintenance.lock',os.O_RDWR|os.O_NOFOLLOW)
             info=os.fstat(fd);assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1
             if fd!=9:os.dup2(fd,9);os.close(fd)
             with os.fdopen(9,'r+') as lock, ExitStack() as held:
              fcntl.flock(9,fcntl.LOCK_EX|fcntl.LOCK_NB)
              assert not any(os.path.lexists(state/name) for name in ('pending-release.json','release-recovery-progress.json'))
              assert not list(Path('/home/aemr/.dash-private-backups').glob('*/quiescent'))
              policy=json.loads(read(Path('/etc/aemr/runtime-policy.json')))
              assert policy.get('project')=='aemr' and policy.get('worker_enabled') is False
              quarantine=json.loads(read(state/'worker-quarantine/quarantine.json'))
              assert quarantine.get('state')=='WORKER_OOM_QUARANTINED' and quarantine.get('image')==old_image
              raw_plan=json.loads(read(runtime/'trial-plan.json'))
              reference=raw_plan.get('backup_reference')
              assert isinstance(reference,str) and re.fullmatch('worker-[0-9]+/backup',reference)
              window=json.loads(read(Path('/home/aemr/.dash-private-backups')/Path(reference).parent/'release-window.json'))
              assert window.get('format')=='aemr-release-window-v1' and window.get('candidate')==sha
              pins=window.get('module_sha256')
              names={'release-controller.py','release_recovery.py','release_trial.py','stateful_backup.py','source_ci_gate.py'}
              assert isinstance(pins,dict) and set(pins)==names
              for name,pin in pins.items():
               assert isinstance(pin,str) and re.fullmatch('[a-f0-9]{64}',pin)
               assert hashlib.sha256(read(tools/name,private=False)).hexdigest()==pin
              sys.path.insert(0,str(tools))
              import release_recovery as r
              plan=r.validate_plan(raw_plan)
              accepted=json.loads(read(state/'release-accepted.json'))
              assert set(accepted)=={'plan_sha256','acceptance'}
              assert accepted['plan_sha256']==r.digest(json.dumps(plan,sort_keys=True,separators=(',',':')).encode())
              executor=r.ReleaseRecovery()
              assert accepted['acceptance']==executor._acceptance(plan) and plan['release_sha']==sha
              assert plan['images']['server']==plan['images']['report-worker']==old_image
              assert plan['candidate_images']['server']==plan['candidate_images']['report-worker']!=old_image
              assert plan['original_running']['report-worker'] is False
              stage=json.loads(read(runtime/'stage.json'))
              assert stage['release_sha']==sha and stage['candidate_images']==plan['candidate_images'] and stage['config_sha256']==plan['config_sha256']
              assert stage['container_ids']['server']==quarantine['server'] and stage['container_ids']['report-worker']==quarantine['worker']
              _,config=executor._files(plan,candidate_runtime=True)
              # _files emits Compose input; decode its one literal-dollar boundary for inspect.
              config=json.loads(json.dumps(config).replace('$$','$'))
              spec=importlib.util.spec_from_file_location('approved_release_controller',tools/'release-controller.py')
              controller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)
              def check():
               records=executor._records(plan,candidate=True)
               controller.ReleaseController(executor)._saved_runtime({**plan,'images':plan['candidate_images']},records,config)
               assert records['server']['State']['Status']=='running' and records['server']['State'].get('Health',{}).get('Status')=='healthy'
               assert all(records[name]['State']['Status']=='running' for name in ('web','caddy'))
               for name in ('server','web'):
                image=json.loads(executor.command(['image','inspect',plan['candidate_images'][name]]))[0]
                assert (image.get('Config',{}).get('Labels') or {}).get('org.opencontainers.image.revision')==sha
               return records
              records=check()
              assert records['report-worker']['State']['Status'] in {'created','exited'}
              volume=executor._volume(plan)
              for path in (volume/'reports/run.lock',volume/'reports/archives/.weekly.lock'):
               read(path,private=False,owner=None)
               handle=held.enter_context(os.fdopen(os.open(path,os.O_RDWR|os.O_NOFOLLOW),'r+'))
               fcntl.flock(handle,fcntl.LOCK_EX|fcntl.LOCK_NB)
              assert json.loads(read(volume/'reports/status.json',private=False,owner=None,limit=32*1024*1024)).get('status') in {'NOT_ISSUED','VERIFIED','VERIFIED_WITH_WARNINGS','FAILED','PLAN_CHANGED'}
              executor._verify_api_word(plan,candidate=True)
              executor._verify_candidate_schema()
              assert check()['report-worker']['State']['Status'] in {'created','exited'}
              # No Compose/recreation or policy enable: only the already accepted new worker.
              executor.command(['start',records['report-worker']['Id']])
              assert check()['report-worker']['State']['Status']=='running'
              r.atomic_json(state/'worker-quarantine/worker-start.json',{'state':'REPAIRED_WORKER_STARTED_NOT_ACCEPTED',
               'release_sha':sha,'worker':records['report-worker']['Id'],'image':plan['candidate_images']['report-worker']})
             print('REPAIRED_WORKER_STARTED_NOT_ACCEPTED')
            except Exception as error:
             kind=type(error).__name__
             print('REPAIRED_WORKER_START_REJECTED')
             print(json.dumps({'kind':'worker_start_diagnostic','entry_line':error.__traceback__.tb_lineno,
              'exception_type':kind if kind in {'AssertionError','FileNotFoundError','PermissionError','BlockingIOError','KeyError','ValueError','RecoveryError','NameError'} else 'OtherError'}))
             sys.exit(2)
            PYWORKERSTART
  worker-oom-quarantine:
    if: >-
      github.event.label.name == 'maintenance: worker-oom-quarantine' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 79 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Quarantine only the proven old OOM worker without stopping the API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -euo pipefail
            sudo -n python3 -I - '${{ github.event.pull_request.head.sha }}' <<'PYQUARANTINE'
            import fcntl,hashlib,json,os,re,stat,subprocess,sys,time,types,uuid
            from contextlib import ExitStack
            from pathlib import Path
            os.umask(0o077)
            state=Path('/var/lib/aemr')
            session=state/'worker-quarantine'
            policy_path=Path('/etc/aemr/runtime-policy.json')
            volume=Path('/var/lib/docker/volumes/aemr_server_data/_data')
            image='sha256:a2b6a1b9a4726e620f77405468f877a20ba1de07c69b8ede4e16a52b46198bac'
            server='de0233d9a09c82cfc48c6813765e833bf60ff3e5b875b2efaad2a9ac62cd57f0'
            worker='f32669a940b4e2c74d6166d59600c398a067a297ed694deeb8cf80d259d2488d'
            def regular(path, *, private=False, owner=0, maximum=32*1024*1024):
             assert not any(p.is_symlink() for p in (path,*path.parents))
             info=path.lstat()
             assert stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid in ({0,1000} if owner is None else {owner})
             assert info.st_size<=maximum and (not private or stat.S_IMODE(info.st_mode)==0o600)
             return info
            def read(path, **kwargs):
             regular(path,**kwargs)
             with os.fdopen(os.open(path,os.O_RDONLY|os.O_NOFOLLOW),'rb') as file:return file.read(32*1024*1024+1)
            def atomic(path,value):
             temporary=path.with_name(path.name+'.'+uuid.uuid4().hex+'.tmp')
             fd=os.open(temporary,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
             with os.fdopen(fd,'w') as file:json.dump(value,file,sort_keys=True);file.flush();os.fsync(file.fileno())
             os.replace(temporary,path)
             fd=os.open(path.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
             try:os.fsync(fd)
             finally:os.close(fd)
            try:
             assert os.geteuid()==0 and re.fullmatch('[a-f0-9]{40}',sys.argv[1])
             source=Path('/root/codex-fixes/release-38687954214/deploy/worker_recovery.py')
             private=source.parents[1].lstat()
             assert stat.S_ISDIR(private.st_mode) and private.st_uid==0 and stat.S_IMODE(private.st_mode)==0o700
             body=read(source,maximum=1024*1024)
             assert hashlib.sha256(body).hexdigest()=='9d47851385b612d245aeeca108435c76208d74d69b35bd012feb77da1288b5a9'
             module=types.ModuleType('approved_worker_recovery')
             exec(compile(body,str(source),'exec'),module.__dict__)
             regular(Path('/run/lock/aemr-maintenance.lock'))
             fd=os.open('/run/lock/aemr-maintenance.lock',os.O_RDWR|os.O_NOFOLLOW)
             if fd!=9:os.dup2(fd,9);os.close(fd)
             with os.fdopen(9,'r+') as global_lock, ExitStack() as locks:
              fcntl.flock(9,fcntl.LOCK_EX|fcntl.LOCK_NB)
              assert not any(os.path.lexists(state/name) for name in ('pending-release.json','release-recovery-progress.json'))
              assert not list(Path('/home/aemr/.dash-private-backups').glob('*/quiescent'))
              policy=json.loads(read(policy_path,private=True,maximum=1024*1024))
              assert policy.get('project')=='aemr' and isinstance(policy.get('worker_enabled'),bool)
              assert set(policy.get('services',{}))=={'server','web','report-worker','caddy'}
              assert all(item.get('container')=='aemr-'+role+'-1' for role,item in policy['services'].items())
              held=[]
              deadline=time.monotonic()+150
              for path in (volume/'reports/run.lock',volume/'reports/archives/.weekly.lock'):
               regular(path,owner=None)
               handle=locks.enter_context(os.fdopen(os.open(path,os.O_RDWR|os.O_NOFOLLOW),'r+'))
               while True:
                try:
                 fcntl.flock(handle,fcntl.LOCK_EX|fcntl.LOCK_NB);break
                except BlockingIOError:
                 if time.monotonic()>=deadline:raise
                 time.sleep(1)
               held.append(handle.fileno())
              terminal={'NOT_ISSUED','VERIFIED','VERIFIED_WITH_WARNINGS','FAILED','PLAN_CHANGED'}
              assert json.loads(read(volume/'reports/status.json',owner=None)).get('status') in terminal
              assert not any(p.is_symlink() for p in (session,*session.parents))
              session.mkdir(mode=0o700,exist_ok=True)
              info=session.lstat();assert stat.S_ISDIR(info.st_mode) and info.st_uid==0 and stat.S_IMODE(info.st_mode)==0o700
              def call(args, *, timeout=100):
               # The actual open lock descriptions survive owner/SSH loss in Docker clients.
               result=subprocess.run(args,capture_output=True,timeout=timeout,check=False,pass_fds=(9,*held))
               with (session/'private-command.log').open('ab') as log:log.write(result.stderr)
               if result.returncode:raise module.RecoveryError('WORKER_COMMAND_FAILED')
               return result.stdout.decode()
              recovery=module.Recovery.__new__(module.Recovery)
              recovery.server,recovery.worker,recovery.call=server,worker,call
              def records():
               result={}
               for role,identity in (('server',server),('report-worker',worker)):
                value=recovery.inspect('aemr-'+role+'-1')
                assert value['Id']==identity and value['Name']=='/aemr-'+role+'-1' and value['Image']==image
                labels=value['Config'].get('Labels') or {}
                assert labels.get('com.docker.compose.project')=='aemr' and labels.get('com.docker.compose.service')==role
                mounts=[m for m in value.get('Mounts',[]) if m.get('Destination')=='/app/packages/server/data']
                assert len(mounts)==1 and mounts[0].get('Type')=='volume' and mounts[0].get('Name')=='aemr_server_data'
                result[role]=value
               assert result['server']['State']['Status']=='running' and result['server']['State'].get('Health',{}).get('Status')=='healthy'
               assert result['report-worker']['State']['Status'] in {'running','restarting','created','exited'}
               return result
              def stable(value):
               return {key:value.get(key) for key in ('Id','Name','Image','Config','Mounts','HostConfig')}
              before=records()
              assert type(before['report-worker'].get('RestartCount')) is int and before['report-worker']['RestartCount']>=3
              until=int(time.time());since=until-1800
              events=call(['docker','events','--since',str(since),'--until',str(until),'--filter','container='+worker,
               '--filter','event=oom','--filter','event=die','--format','{{json .}}'],timeout=30)
              assert len(events)<=1024*1024
              oom=[];died=[]
              for line in events.splitlines():
               event=json.loads(line);actor=event.get('Actor') or {};at=event.get('time')
               if event.get('Type')!='container' or actor.get('ID')!=worker or type(at) is not int or not since<=at<=until:continue
               if event.get('Action')=='oom':oom.append(at)
               if event.get('Action')=='die' and (actor.get('Attributes') or {}).get('exitCode')=='137':died.append(at)
              assert any(0<=death-at<=60 for at in oom for death in died)
              assert all(stable(value)==stable(before[role]) for role,value in records().items())
              assert json.loads(read(volume/'reports/status.json',owner=None)).get('status') in terminal
              # Explicit OOM quarantine is outside the release graceful-exit gate.
              recovery._stop_failed_worker_locked()
              after=records()
              assert all(stable(value)==stable(before[role]) for role,value in after.items())
              assert after['report-worker']['State']['Status'] in {'created','exited'}
              assert json.loads(read(policy_path,private=True))['worker_enabled'] is False
              atomic(session/'quarantine.json',{'state':'WORKER_OOM_QUARANTINED','source_sha':sys.argv[1],
               'server':server,'worker':worker,'image':image,'quarantined_at':int(time.time())})
             print('WORKER_OOM_QUARANTINED')
            except Exception as error:
             frame=error.__traceback__
             while frame.tb_next:frame=frame.tb_next
             print('WORKER_QUARANTINE_REJECTED')
             kind=type(error).__name__
             print(json.dumps({'kind':'worker_quarantine_diagnostic','line':frame.tb_lineno,'entry_line':error.__traceback__.tb_lineno,
              'exception_type':kind if kind in {'AssertionError','FileNotFoundError','PermissionError','BlockingIOError','KeyError','ValueError','RecoveryError','NameError'} else 'OtherError'}))
             sys.exit(2)
            PYQUARANTINE
  superseded-backup-archives:
    if: >-
      github.event.label.name == 'maintenance: superseded-backup-archives' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 79 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Verify accepted retained backup run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/38349415596 --jq .conclusion)" = success
      - name: Retire only the two named superseded archive blobs
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script: |
            set -euo pipefail
            sudo -n python3 -I - <<'PY'
            import fcntl,hashlib,json,os,shutil,stat
            from pathlib import Path
            base=Path('/home/aemr/.dash-private-backups')
            retained=base/'worker-38349415596'/'backup'
            def regular(path):
                assert not any(p.is_symlink() for p in (path,*path.parents))
                info=path.stat()
                assert stat.S_ISREG(info.st_mode) and info.st_nlink==1
                return info
            def digest(path):
                with path.open('rb') as source:return hashlib.file_digest(source,'sha256').hexdigest()
            lock=Path('/run/lock/aemr-maintenance.lock');regular(lock)
            with lock.open('r+') as handle:
                fcntl.flock(handle,fcntl.LOCK_EX|fcntl.LOCK_NB)
                assert not any((Path('/var/lib/aemr')/name).exists() or (Path('/var/lib/aemr')/name).is_symlink() for name in
                    ('pending-release.json','release-recovery-progress.json'))
                assert not list(base.glob('*/quiescent'))
                manifest_path=retained/'manifest.json';regular(manifest_path)
                manifest=json.loads(manifest_path.read_bytes())
                archive=retained/'state.tar.gz';info=regular(archive)
                assert manifest.get('format')==2 and info.st_size==manifest.get('archive_bytes')==4589649313
                assert digest(archive)==manifest.get('archive_sha256')
                # This cut passed full independent restore in run38349415596.
                # Preserve it and all audit receipts; retire only older blobs.
                targets=[]
                for run in ('worker-38171945386','worker-38178244703'):
                    target=base/run/'backup'/'state.tar.gz'
                    assert not any(p.is_symlink() for p in (target,*target.parents))
                    if not target.exists() and not target.is_symlink():continue
                    item=regular(target);assert item.st_ino!=info.st_ino
                    assert 2_000_000_000<item.st_size<3_000_000_000
                    targets.append((target,item.st_size))
                before=shutil.disk_usage(base).free
                for target,_ in targets:
                    target.unlink()
                    fd=os.open(target.parent,os.O_RDONLY|os.O_DIRECTORY)
                    try:os.fsync(fd)
                    finally:os.close(fd)
                assert regular(archive).st_size==info.st_size
                print(json.dumps({'status':'SUPERSEDED_BACKUP_BLOBS_RETIRED',
                    'removed':len(targets),'reclaimed_logical_bytes':sum(n for _,n in targets),
                    'free_before_bytes':before,'free_after_bytes':shutil.disk_usage(base).free,
                    'retained_accepted_run':38349415596}))
            PY
  release-tool-diagnostics:
    if: >-
      github.event.label.name == 'maintenance: release-tool-diagnostics' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.number == 79 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Read actual policy types and replay only the failed installer admission
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 2m
          script_stop: false
          script: |
            set -euo pipefail
            sudo -n python3 -I - <<'PY'
            import hashlib,json,os,re,shutil,stat,subprocess,sys
            from pathlib import Path
            source=Path('/root/codex-fixes/release-38687954214/deploy/install-runtime-guard.sh')
            assert not any(p.is_symlink() for p in (source,*source.parents))
            info=source.lstat()
            print(json.dumps({'kind':'release_diagnostic_source','uid':info.st_uid,
                'mode':oct(stat.S_IMODE(info.st_mode))}))
            # git archive may retain group-write bits inside its root-private
            # directory. Trust exact bytes, not those irrelevant outer bits.
            private=source.parents[1].lstat()
            assert stat.S_ISDIR(private.st_mode) and private.st_uid==0 and stat.S_IMODE(private.st_mode)==0o700
            assert stat.S_ISREG(info.st_mode) and info.st_uid==0 and info.st_nlink==1
            body=source.read_bytes()
            assert hashlib.sha256(body).hexdigest()=='13fa270b8a1392c3c09aa877537c2851cb7ec1267a5dc70cc90169db68378e41'
            policy_path=Path('/etc/aemr/runtime-policy.json')
            metadata=policy_path.lstat()
            assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid==0 and not policy_path.is_symlink() and metadata.st_size<=1024*1024
            policy=json.loads(policy_path.read_bytes())
            roles=('server','web','report-worker','caddy')
            capacity=os.statvfs('/')
            print(json.dumps({'kind':'host_capacity','free_bytes':shutil.disk_usage('/').free,
                'free_inodes':capacity.f_favail,'total_inodes':capacity.f_files}))
            for category,parent in [('backups','/home/aemr/.dash-private-backups'),
                    ('operational_scratch','/root/codex-fixes'),('temporary','/tmp'),
                    ('git_objects','/home/aemr/dash/.git'),
                    ('inactive_host_dependencies','/opt/aemr/node_modules'),
                    ('host_dependencies','/home/aemr/dash/node_modules'),
                    ('root_package_cache','/root/.npm'),('deploy_package_cache','/home/aemr/.npm'),
                    ('root_cache','/root/.cache'),('deploy_cache','/home/aemr/.cache'),
                    ('apt_cache','/var/cache/apt'),('host_journal','/var/log/journal')]:
                result=subprocess.run(['du','-s','--block-size=1',parent],capture_output=True,timeout=30)
                amount=result.stdout.split(maxsplit=1)[0] if result.returncode==0 else b''
