name: Owner-authorized VPS maintenance

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  full-worker-backup:
    if: >-
      github.event.label.name == 'maintenance: full-worker-backup' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      RECOVERY_SHA: ${{ github.event.pull_request.head.sha }}
      RECOVERY_RUN: ${{ github.run_id }}
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact-head CI and private scratch capacity
        run: |
          set -euo pipefail
          case "$RECOVERY_SHA" in *[!0-9a-f]*|'') exit 2 ;; esac
          test "${#RECOVERY_SHA}" = 40
          # Wait only before the maintenance window; no service has been stopped.
          ready=false
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&event=pull_request"               --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id' | grep -q .; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 32212254720
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/worker-backup"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/worker-backup/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$RUNNER_TEMP/worker-backup/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/worker-backup/known_hosts"
      - name: Quiesce writers and create private full compressed backup
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" bash -s -- prepare "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
      - name: Transfer privately and prove complete independent scratch restore
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/worker-backup/backup" "$RUNNER_TEMP/worker-backup/scratch"
          scp -q -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup/manifest.json" \
            "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup/state.tar.gz"             "$RUNNER_TEMP/worker-backup/backup/"
          # Root is needed to reproduce original file UIDs/GIDs in disposable restore.
          sudo python3 deploy/stateful_backup.py verify             --backup "$RUNNER_TEMP/worker-backup/backup"             --scratch-parent "$RUNNER_TEMP/worker-backup/scratch"             > "$RUNNER_TEMP/worker-backup/restore.json"
          cat "$RUNNER_TEMP/worker-backup/restore.json"
      - name: Match still-quiesced original bytes after successful restore
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" bash -s -- match-source "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
          echo 'FULL_BACKUP_EXTERNAL_RESTORE_AND_SOURCE_MATCH_PASS'
      - name: Always resume original server; never start worker or discard private backup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/worker-backup/key"; then
            ssh -i "$RUNNER_TEMP/worker-backup/key"               -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes               "$VPS_USER@193.233.91.162" bash -s -- resume "$RECOVERY_SHA" "$RECOVERY_RUN"               /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
          fi
      - name: Remove all private runner copies and credentials
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/worker-backup"
  worker-recovery-preflight:
    if: >-
      github.event.label.name == 'maintenance: worker-recovery-preflight' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Read-only worker image and full-state backup capacity
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 4m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:packages/report-engine/src/procurement_engine/monitoring_schema.py" > "$tool"
            candidate_schema=$(sha256sum "$tool" | cut -d' ' -f1)
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            worker=$(docker compose --env-file .env.production --profile reports ps --all --quiet report-worker)
            test -n "$server"
            test -n "$worker"
            server_image=$(docker inspect --format '{{.Image}}' "$server")
            worker_image=$(docker inspect --format '{{.Image}}' "$worker")
            volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/packages/server/data"}}{{if eq .Type "volume"}}{{.Name}}{{end}}{{end}}{{end}}' "$server")
            case "$volume" in ''|*[!A-Za-z0-9_.-]*) exit 2 ;; esac
            if [ "$server_image" = "$worker_image" ]; then echo 'worker_server_image_equal=true'; else echo 'worker_server_image_equal=false'; fi
            docker inspect --format 'worker_state={{.State.Status}} worker_exit={{.State.ExitCode}} worker_oom={{.State.OOMKilled}} worker_restarts={{.RestartCount}}' "$worker"
            for image in "$worker_image" "$server_image"; do
              installed_schema=$(docker run --rm --network none --read-only --entrypoint /opt/report-env/bin/python "$image" -B -c 'import hashlib; from pathlib import Path; import procurement_engine.monitoring_schema as m; print(hashlib.sha256(Path(m.__file__).read_bytes()).hexdigest())')
              if [ "$installed_schema" = "$candidate_schema" ]; then echo 'schema_matches_candidate=true'; else echo 'schema_matches_candidate=false'; fi
            done
            docker run --rm --network none --read-only --user 0               --mount "type=volume,src=$volume,dst=/source,readonly"               --entrypoint /opt/report-env/bin/python "$server_image" -B -c 'import json,shutil; from pathlib import Path; root=Path("/source"); paths=list(root.rglob("*")); print(json.dumps({"source_files":sum(p.is_file() for p in paths),"source_logical_bytes":sum(p.stat().st_size for p in paths if p.is_file()),"source_unsafe_entries":sum(p.is_symlink() or not(p.is_dir() or p.is_file()) for p in paths),"free_bytes":shutil.disk_usage(root).free},sort_keys=True))'
  runtime-readback:
    if: >-
      github.event.label.name == 'maintenance: runtime-readback' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Compare two read-only Docker state samples without cleanup
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 3m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:deploy/runtime-state-probe.py" > "$tool"
            python3 -B "$tool"
            df -PB1 /
  identity-retention-proof:
    if: >-
      github.event.label.name == 'maintenance: identity-retention-proof' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prove historical identity recovery on private scratch restore
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 14m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            git archive "$candidate" packages/report-engine deploy/plan-weekly-publications.py \
              deploy/prove-weekly-identity-recovery.py | tar -x -C "$work"
            # This directory contains reviewed repository code only, no live data.
            chmod -R a+rX "$work"
            cd deploy
            server=$(docker compose --env-file .env.production ps --status running --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            data_volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/packages/server/data"}}{{if eq .Type "volume"}}{{.Name}}{{end}}{{end}}{{end}}' "$server")
            case "$data_volume" in ''|*[!A-Za-z0-9_.-]*) exit 2 ;; esac
            docker volume inspect "$data_volume" >/dev/null
            docker run --rm --network none --read-only \
              --mount type=volume,dst=/tmp \
              -v "$data_volume:/app/packages/server/data:ro" \
              -v "$work:/candidate:ro" \
              -e PYTHONPATH=/candidate/packages/report-engine/src \
              --entrypoint /opt/report-env/bin/python "$image" -B \
              /candidate/deploy/prove-weekly-identity-recovery.py --state /app/packages/server/data/reports
  weekly-census:
    if: >-
      github.event.label.name == 'maintenance: weekly-census' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Read-only weekly publication and identity census
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            catalog=$(mktemp)
            planner=$(mktemp)
            trap 'rm -f "$tool" "$catalog" "$planner"' EXIT
            git show "$candidate:packages/report-engine/src/procurement_engine/readonly_catalog.py" > "$catalog"
            git show "$candidate:deploy/plan-weekly-publications.py" > "$planner"
            python3 - "$catalog" "$planner" "$tool" <<'PYPROBE'
            import sys
            from pathlib import Path
            catalog, planner, output = map(Path, sys.argv[1:])
            bootstrap = "import sys, types\nmodule=types.ModuleType('procurement_engine.readonly_catalog')\n"
            bootstrap += "exec(compile(" + repr(catalog.read_text()) + ", '<reviewed-catalog>', 'exec'), module.__dict__)\n"
            bootstrap += "sys.modules[module.__name__]=module\n"
            output.write_text(bootstrap + "exec(compile(" + repr(planner.read_text()) + ", '<reviewed-weekly-plan>', 'exec'))\n")
            PYPROBE
            cd deploy
            df -PB1 /
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -B - \
              --state /app/packages/server/data/reports < "$tool"
  attempt-payloads:
    if: >-
      github.event.label.name == 'maintenance: transient-attempts' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Compact old transient payloads preserving weekly and current evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:packages/report-engine/src/procurement_engine/retention.py" > "$tool"
            cat >> "$tool" <<'PYCOMPACT'
            state = "/app/packages/server/data/reports"
            plan = plan_transient_attempt_retention(state, keep_full=2)
            print(json.dumps({"attempt_retention_plan": {k: plan.get(k) for k in (
                "status", "attempt_count", "compact_count", "bytes_reclaimable",
                "protected_unsealed_thursdays", "malformed_or_unsafe_entries")}}, sort_keys=True))
            result = apply_transient_attempt_retention(state, keep_full=2,
                expected_attempts=plan["compact_attempts"])
            print(json.dumps({"attempt_retention_result": {k: result.get(k) for k in (
                "status", "compacted", "bytes_reclaimed")}}, sort_keys=True))
            if result["status"] not in {"COMPACTED", "NO_ATTEMPTS"}:
                raise SystemExit(2)
            if result.get("compacted", 0) != plan.get("compact_count", 0):
                raise SystemExit(2)
            PYCOMPACT
            cd deploy
            df -PB1 /
            docker compose --env-file .env.production exec -T server /opt/report-env/bin/python -B - < "$tool"
            df -PB1 /
  cache-only:
    if: >-
      github.event.label.name == 'maintenance: build-cache-only' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prune regenerable cache and verify deployment state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 6m
          script_stop: false
          script: |
            set -euo pipefail
            umask 077
            candidate='${{ github.event.pull_request.head.sha }}'
            case "$candidate" in *[!0-9a-f]*|'') exit 2 ;; esac
            test "${#candidate}" = 40
            cd /home/aemr/dash
            git fetch --quiet origin "$candidate"
            tool=$(mktemp)
            trap 'rm -f "$tool"' EXIT
            git show "$candidate:deploy/cleanup-build-cache.sh" > "$tool"
            bash "$tool"
