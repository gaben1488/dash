          PY
      - name: Always request same-owner resume without reverting an accepted release
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/release/ssh.sh"; then
            . "$RUNNER_TEMP/release/ssh.sh"
            window request-resume > "$RUNNER_TEMP/release/resume.log" 2>&1 || { echo RELEASE_RESUME_REQUEST_FAILED; exit 2; }
            closed=false
            for attempt in $(seq 1 150); do
              if remote sudo -n test ! -e "/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/quiescent"; then closed=true; break; fi
              sleep 2
            done
            test "$closed" = true || { echo RELEASE_RESUME_STILL_PENDING; exit 2; }
          fi
      - name: Preserve bounded private release failure evidence
        if: failure()
        run: |
          # Keep bounded failure evidence privately before removing the runner.
          # SSH keys and private configuration files are never copied or logged.
          if test -f "$RUNNER_TEMP/release/ssh.sh"; then
            . "$RUNNER_TEMP/release/ssh.sh"
            python3 - <<'PY'
          import ast,os
          from pathlib import Path
          allowed={'AEMR_MAINTENANCE_BUSY','AEMR_MAINTENANCE_LOCK_INVALID'}
          for name in ('deploy/release-controller.py','deploy/release_recovery.py','deploy/release_trial.py'):
              for node in ast.walk(ast.parse(Path(name).read_text())):
                  if isinstance(node,ast.Constant):
                      value=node.value
                      if isinstance(value,str) and value.startswith(('RELEASE_','BACKUP_')) and value.replace('_','').isalnum():
                          allowed.add(value)
          root=Path(os.environ['RUNNER_TEMP'])/'release'
          found=set()
          for path in root.glob('*.log'):
              if path.is_file() and not path.is_symlink():
                  found.update(line.strip() for line in path.read_bytes()[-131072:].decode('utf-8',errors='replace').splitlines()
                      if line.strip() in allowed)
          for code in sorted(found):print('PRIVATE_RELEASE_FAILURE_CODE='+code)
          PY
            remote sudo -n install -d -m 700 "/root/codex-fixes/release-$RECOVERY_RUN"
            python3 - <<'PY' | remote sudo -n tee "/root/codex-fixes/release-$RECOVERY_RUN/runner-diagnostics.json" >/dev/null
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'release'
          files=sorted(root.glob('*.log'),key=lambda p:(p.name!='trial-phase.log',p.name))[:32]
          print(json.dumps({p.name:p.read_bytes()[-131072:].decode('utf-8',errors='replace')
              for p in files if p.is_file() and not p.is_symlink()}))
          PY
          fi
      - name: Remove private runner state and credentials
        if: always()
        run: |
          sudo rm -rf "$RUNNER_TEMP/release" /var/lib/aemr/release-trial-clone \
            /var/lib/aemr/release-runtime "/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN"
