name: Owner-authorized VPS maintenance

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  actions: read

jobs:
  worker-failure-diagnostics:
    if: >-
      github.event.label.name == 'maintenance: worker-failure-diagnostics' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Read private failure categories and unchanged runtime only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 4m
          script_stop: false
          script: |
            set -euo pipefail
            python3 - <<'PYDIAG'
            import json, re, shlex, subprocess
            from pathlib import Path
            session=Path('/home/aemr/.dash-private-backups/recovery-38176811396')
            log=(session/'private-command.log').read_text(errors='replace')
            patterns={
              'MISSING_DEPLOYMENT_SMOKE_MODULE': r'No module named.*procurement_engine.deployment_smoke',
              'PERMISSION_DENIED': r'Permission denied',
              'DOCKER_DAEMON_UNAVAILABLE': r'Cannot connect to the Docker daemon',
              'DOCKER_CONTAINER_MISSING': r'No such container',
              'DOCKER_CONTAINER_STOPPED': r'container .* is not running',
              'COMPOSE_CONFIG_INVALID': r'(invalid compose|validating .*docker-compose|unsupported config)',
              'PYTHON_TRACEBACK': r'Traceback \(most recent call last\)',
            }
            print(json.dumps({'failure_categories': [key for key, pattern in patterns.items() if re.search(pattern,log,re.I)],
              'fixed_errors': sorted(set(re.findall(r'\b(?:REPORT_EXPORT|WORKER|BACKUP)_[A-Z0-9_]+\b',log))),
              'rollback_receipt': (session/'rollback.json').exists(), 'cycle1_receipt': (session/'cycle-1.json').exists()}))
            baseline=json.loads((session.parent/'worker-38171945386/runtime.json').read_text())
            server=json.loads(subprocess.check_output(['docker','inspect',baseline['server']]))[0]
            workers=subprocess.check_output(['docker','ps','--all','--quiet','--no-trunc','--filter',
              'label=com.docker.compose.project=aemr','--filter','label=com.docker.compose.service=report-worker'],text=True).split()
            worker=json.loads(subprocess.check_output(['docker','inspect',workers[0]]))[0]
            print(json.dumps({'server_state':server['State']['Status'], 'server_health':server['State'].get('Health',{}).get('Status'),
              'server_image_unchanged':server['Image']==baseline['image'], 'worker_state':worker['State']['Status'],
              'worker_image_equals_server':worker['Image']==server['Image'], 'worker_oom':worker['State']['OOMKilled'],
              'worker_restarts':worker['RestartCount']}))
            top=subprocess.run(['docker','top',baseline['server'],'-eo','args'],capture_output=True)
            default_top=subprocess.run(['docker','top',baseline['server']],capture_output=True)
            table=default_top.stdout.decode(errors='replace').splitlines()
            command_index=len(table[0].split())-1
            matches=[]
            for line in table[1:]:
              command=line.split(None,command_index)[-1]
              if re.search(r'proc-report\s+(?:run-google|worker)|procurement_engine.*(?:run-google|worker)',command):
                argv=shlex.split(command)
                names={'python','python3','node','proc-report','sh','bash'}
                executable=Path(argv[0]).name
                modules=[x for x in argv if re.fullmatch(r'procurement_engine\.[a-z_]+',x)]
                matches.append({'executable':executable if executable in names else 'OTHER',
                  'module':modules[0] if modules else 'NONE',
                  'standalone_writer_subcommand':any(x in {'worker','run-google'} for x in argv),
                  'is_python_inline_code':'-c' in argv})
            print(json.dumps({'matching_process_classes':matches}))
            pid_top=subprocess.run(['docker','top',baseline['server'],'-eo','pid'],capture_output=True)
            top_error=(top.stdout+top.stderr).decode(errors='replace')
            smoke=subprocess.run(['docker','exec',baseline['server'],'/opt/report-env/bin/python','-m',
              'procurement_engine.deployment_smoke'],capture_output=True,timeout=180)
            output=(smoke.stdout+smoke.stderr).decode(errors='replace')
            print(json.dumps({'private_command_stderr_bytes':len(log.encode()), 'process_probe_exit':top.returncode,
              'default_process_probe_exit':default_top.returncode, 'pid_process_probe_exit':pid_top.returncode,
              'process_error_categories':[name for name,pattern in {
                'PS_UNSUPPORTED_FORMAT':r'(unknown|invalid|unrecognized|unsupported).*(args|format|option)',
                'PS_EXECUTABLE_MISSING':r'(executable file not found|exec:.*ps.*not found)',
                'PS_EMPTY_FORMAT':r'(no argument|requires an argument|improper list)',
                'PS_UNKNOWN_USER':r'(unknown user|user name does not exist)',
                'PS_USAGE':r'(Usage:|usage:)'
              }.items() if re.search(pattern,top_error,re.I)],
              'native_word_probe_exit':smoke.returncode,
              'native_word_fixed_errors':sorted(set(re.findall(r'\bREPORT_EXPORT_[A-Z0-9_]+\b',output))),
              'native_word_pass_fields':[key for key in ('context','snapshot','main','supplement','operational')
                if '"'+key+'": "PASS"' in output]}))
            probe='''import importlib.util,json; from pathlib import Path
            spec=importlib.util.spec_from_file_location("backup_tool","/tool.py"); m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
            expected=json.loads(Path("/backup/manifest.json").read_text())["files"]
            current=m.inventory(Path("/source"),require_complete=False)
            rows=[]
            for name in sorted(set(expected)|set(current)):
                if name.startswith("reports/") and expected.get(name)!=current.get(name):
                    before,after=expected.get(name),current.get(name)
                    rows.append({"path":name,"change":"added" if before is None else "removed" if after is None else "modified",
                      "fields":[k for k in set(before or {})|set(after or {}) if (before or {}).get(k)!=(after or {}).get(k)]})
            print(json.dumps(rows))'''
            result=subprocess.run(['docker','run','--rm','-i','--network','none','--read-only','--user','0',
              '--mount','type=volume,src='+baseline['volume']+',dst=/source,readonly',
              '--mount','type=bind,src='+str(session.parent/'worker-38171945386/backup')+',dst=/backup,readonly',
              '--mount','type=bind,src='+str(session/'stateful_backup.py')+',dst=/tool.py,readonly',
              '--entrypoint','/opt/report-env/bin/python',baseline['image'],'-B','-'],
              input=probe.encode(),capture_output=True,timeout=600)
            if result.returncode: raise SystemExit('PRIVATE_SCOPE_COMPARISON_FAILED')
            rows=json.loads(result.stdout)
            (session/'scope-diff.json').write_text(json.dumps(rows))
            counts={}
            safe={'status.json','run.lock','ledger.json','registry.json','identity.sqlite',
              'identity.sqlite-wal','identity.sqlite-shm','publications.sqlite',
              'publications.sqlite-wal','publications.sqlite-shm'}
            for row in rows:
              path=Path(row['path']); group=path.parts[1] if len(path.parts)>1 else 'ROOT'
              key=path.name if path.name in safe else group
              counts[key+':'+row['change']]=counts.get(key+':'+row['change'],0)+1
            print(json.dumps({'private_scope_diff_saved':True,'report_scope_difference_classes':counts}))
            PYDIAG
  worker-acceptance-readback:
    if: >-
      github.event.label.name == 'maintenance: worker-acceptance-readback' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Independently read accepted cycles, preserved releases and web hotfix
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 11m
          script_stop: false
          script: |
            set -euo pipefail
            python3 - <<'PYACCEPT'
            import hashlib, json, stat, subprocess
            from pathlib import Path
            session=Path('/home/aemr/.dash-private-backups/recovery-38178313782')
            result=json.loads((session/'result.json').read_text())
            assert result['state']=='TWO_AUTONOMOUS_CYCLES_VERIFIED' and result['native_word']=='PASS'
            baseline=json.loads((session.parent/'worker-38178244703/runtime.json').read_text())
            assert result['worker_image']==baseline['image']
            ids=[]
            for number in (1,2):
                cycle=json.loads((session/f'cycle-{number}.json').read_text())
                assert cycle['status'] in {'VERIFIED','VERIFIED_WITH_WARNINGS'}
                assert cycle['snapshot_id']==cycle['publication']['snapshot_id']
                assert cycle['publication']['operational_available'] is True
                ids.append(cycle['attempt_id'])
            assert len(set(ids))==2 and sorted(ids)==result['attempt_ids']
            server=json.loads(subprocess.check_output(['docker','inspect',baseline['server']]))[0]
            assert server['Image']==baseline['image'] and server['State']['Status']=='running'
            assert server['State']['Health']['Status']=='healthy'
            workers=subprocess.check_output(['docker','ps','--all','--quiet','--no-trunc','--filter',
                'label=com.docker.compose.project=aemr','--filter','label=com.docker.compose.service=report-worker'],text=True).split()
            assert len(workers)==1
            worker=json.loads(subprocess.check_output(['docker','inspect',workers[0]]))[0]
            assert worker['State']['Status']=='running' and worker['Image']==baseline['image']
            assert not worker['State']['OOMKilled'] and worker['RestartCount']==0
            web=json.loads(subprocess.check_output(['docker','inspect','aemr-web-1']))[0]
            assert web['State']['Status']=='running'
            assert web['Image']=='sha256:43520e97cb59f2f27aeec7144fbf7d19ce9405ab883d0db6c62ced7d12f46334'
            probe="""import hashlib,json,stat;from pathlib import Path
            expected=json.loads(Path('/backup/manifest.json').read_text())['files']
            source=Path('/source'); count=0
            roots=set()
            for name in expected:
                parts=Path(name).parts
                if len(parts)>=4 and parts[:3]==('reports','published','releases'):roots.add('/'.join(parts[:4]))
                if len(parts)>=3 and parts[:2]==('reports','archives') and parts[2].startswith('WEEKLY-'):roots.add('/'.join(parts[:3]))
            for root in roots:
                tree=source/root
                actual={p.relative_to(source).as_posix()+('/' if p.is_dir() else '') for p in [tree,*tree.rglob('*')]}
                sealed={name for name in expected if name.startswith(root+'/')}
                assert actual==sealed
            for name,before in expected.items():
                if not (name.startswith('reports/published/releases/') or name.startswith('reports/archives/WEEKLY-')):continue
                path=source/name
                assert not path.is_symlink()
                meta=path.stat(); after={'uid':meta.st_uid,'gid':meta.st_gid,'mode':stat.S_IMODE(meta.st_mode)}
                if before.get('kind')=='directory':
                    assert path.is_dir();after.update(kind='directory',bytes=0)
                else:
                    assert path.is_file();digest=hashlib.sha256();size=0
                    with path.open('rb') as stream:
                        for block in iter(lambda:stream.read(1024*1024),b''):digest.update(block);size+=len(block)
                    after.update(sha256=digest.hexdigest(),bytes=size)
                assert after==before
                count+=1
            assert count>0
            print(json.dumps({'old_sealed_entries':count,'old_sealed_bytes_and_metadata':'PASS'}))"""
            checked=subprocess.run(['docker','run','--rm','-i','--network','none','--read-only','--user','0',
                '--mount','type=volume,src='+baseline['volume']+',dst=/source,readonly',
                '--mount','type=bind,src='+str(session.parent/'worker-38178244703/backup')+',dst=/backup,readonly',
                '--entrypoint','/opt/report-env/bin/python',baseline['image'],'-B','-'],
                input=probe.encode(),capture_output=True,timeout=360)
            assert checked.returncode==0, 'WORKER_OLD_SEALED_STATE_READBACK_FAILED'
            print(checked.stdout.decode())
            smoke=subprocess.run(['docker','exec',baseline['server'],'/opt/report-env/bin/python','-m',
                'procurement_engine.deployment_smoke'],capture_output=True,timeout=180)
            assert smoke.returncode==0, 'WORKER_NATIVE_WORD_READBACK_FAILED'
            fields=json.loads(smoke.stdout)
            assert all(fields.get(key)=='PASS' for key in ('context','snapshot','main','supplement','operational'))
            print(json.dumps({'accepted_timer_cycles':2,'worker_running':True,'server_healthy':True,
                'worker_image_pinned':True,'web_assurance_v2_hotfix_preserved':True,'native_three_word':'PASS'}))
            # Compile exact candidate public sources in memory, never import the
            # installed v1-only shared package or overwrite runtime source files.
            repo=Path('/home/aemr/dash')
            candidate='${{ github.event.pull_request.head.sha }}'
            assert len(candidate)==40 and all(c in '0123456789abcdef' for c in candidate)
            subprocess.run(['git','fetch','--quiet','origin',candidate],cwd=repo,check=True,capture_output=True)
            def public_source(name):
                return subprocess.check_output(['git','show',candidate+':'+name],cwd=repo,text=True)
            payload=json.dumps({'schemas':public_source('packages/shared/src/schemas.ts'),
                'registry':public_source('packages/shared/src/department-registry.ts')})
            program=public_source('.github/ci/report-schema-probe.cjs')
            program+='\nmain().catch(()=>{console.log("CANDIDATE_SCHEMA_PROBE_FAILED");process.exitCode=2;});'
            schema=subprocess.run(['docker','run','--rm','-i','--read-only','--network','aemr_aemr',
                '--env-file',str(repo/'deploy/.env.production'),
                '--mount','type=volume,src='+baseline['volume']+',dst=/app/packages/server/data,readonly',
                '--entrypoint','node',baseline['image'],'-e',program],
                input=payload.encode(),capture_output=True,timeout=180)
            try: summary=json.loads(schema.stdout)
            except ValueError: raise AssertionError('CANDIDATE_SCHEMA_PROBE_NO_PROOF') from None
            print(json.dumps({'candidate_sha':candidate,**summary}))
            assert schema.returncode==0 and summary['candidate_schema_history']=='PASS', 'CANDIDATE_SCHEMA_HISTORY_READBACK_FAILED'
            PYACCEPT
  restore-current-worker:
    if: >-
      github.event.label.name == 'maintenance: restore-current-worker' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      RECOVERY_SHA: ${{ github.event.pull_request.head.sha }}
      RECOVERY_RUN: ${{ github.run_id }}
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require reviewed exact-head CI and successful installed-image compatibility
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/worker-recovery"
          ready=false
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&event=pull_request" --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id' | grep -q .; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38172548530" > "$RUNNER_TEMP/worker-recovery/compat.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38178244703" > "$RUNNER_TEMP/worker-recovery/backup-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/38178244703/jobs" > "$RUNNER_TEMP/worker-recovery/backup-jobs.json"
          python3 - "$RUNNER_TEMP/worker-recovery" <<'PYGATE'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          compat = json.loads((root/'compat.json').read_text())
          assert compat['conclusion'] == 'success'
          assert compat['head_sha'] == 'fd40ae91919fee0cb36bca4f25a1193b209fffc3'
          assert compat['head_repository']['full_name'] == 'gaben1488/dash'
          assert compat['head_branch'] == 'codex/dash-audit-integrated-20261010'
          backup = json.loads((root/'backup-run.json').read_text())
          assert backup['status'] == 'completed' and backup['conclusion'] == 'success'
          assert backup['head_sha'] == 'd8a7dfa015a531f5653640427836bf535d87ff79'
          assert backup['head_repository']['full_name'] == 'gaben1488/dash'
          assert backup['head_branch'] == 'codex/dash-audit-integrated-20261010'
          jobs = json.loads((root/'backup-jobs.json').read_text())['jobs']
          job = next(j for j in jobs if j['name'] == 'full-worker-backup')
          assert job['status'] == 'completed' and job['conclusion'] == 'success'
          # Full copy, independent restore and source-match already passed.
          # Worker scope is rechecked while quiesced after Node has resumed.
          required = {'Quiesce writers and create private full compressed backup',
              'Transfer privately and prove complete independent scratch restore',
              'Match still-quiesced original bytes after successful restore',
              'Always resume original server; never start worker or discard private backup'}
          assert all(next(s for s in job['steps'] if s['name'] == name)['conclusion'] == 'success' for name in required)
          print('WORKER_ONLY_BACKUP_AND_INSTALLED_IMAGE_PRECONDITIONS_PASS')
          PYGATE
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 32212254720
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/worker-recovery/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$RUNNER_TEMP/worker-recovery/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/worker-recovery/known_hosts"
      - name: Independently restore exact private backup and exercise reports-only rollback
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/worker-recovery/backup" "$RUNNER_TEMP/worker-recovery/scratch"
          scp -q -i "$RUNNER_TEMP/worker-recovery/key" -o UserKnownHostsFile="$RUNNER_TEMP/worker-recovery/known_hosts" -o StrictHostKeyChecking=yes \
            "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-38178244703/backup/manifest.json" \
            "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-38178244703/backup/state.tar.gz" "$RUNNER_TEMP/worker-recovery/backup/"
          sudo python3 deploy/stateful_backup.py verify --backup "$RUNNER_TEMP/worker-recovery/backup" \
            --scratch-parent "$RUNNER_TEMP/worker-recovery/scratch" --trial-report-restore > "$RUNNER_TEMP/worker-recovery/restore.json"
          python3 - "$RUNNER_TEMP/worker-recovery" <<'PYRECEIPT'
          import json, sys
          from pathlib import Path
          root=Path(sys.argv[1])
          proof=json.loads((root/'restore.json').read_text())
          assert proof['state']=='VERIFIED_IN_SCRATCH' and proof['worker_scope_rollback']=='PASS'
          (root/'receipt.json').write_text(json.dumps({'full_restore':proof['state'], 'compatibility':'PASS',
              'backup_session':'/home/aemr/.dash-private-backups/worker-38178244703',
              'backup_sha':'d8a7dfa015a531f5653640427836bf535d87ff79',
              'manifest_sha256':proof['manifest_sha256']}))
          print('FULL_PRIVATE_RESTORE_AND_WORKER_SCOPE_ROLLBACK_PASS')
          PYRECEIPT
      - name: Recover only pinned worker and verify first attributed timer cycle and native Word
        run: |
          set -euo pipefail
          session="/home/aemr/.dash-private-backups/recovery-$RECOVERY_RUN"
          ssh_args=(-i "$RUNNER_TEMP/worker-recovery/key" -o UserKnownHostsFile="$RUNNER_TEMP/worker-recovery/known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" "umask 077; mkdir '$session'"
          scp -q "${ssh_args[@]}" deploy/worker_recovery.py deploy/stateful_backup.py \
            "$RUNNER_TEMP/worker-recovery/receipt.json" "$VPS_USER@193.233.91.162:$session/"
          # Detached remote supervisor survives a runner/SSH disconnect and
          # completes acceptance or rollback with a private terminal receipt.
          ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" \
            "umask 077; nohup python3 '$session/worker_recovery.py' --repo /home/aemr/dash --session '$session' </dev/null >'$session/supervisor.log' 2>&1 &"
          for attempt in $(seq 1 170); do
            outcome=$(ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" \
              "if test -f '$session/failure.json'; then echo FAILED; elif test -f '$session/cycle-1.json'; then echo FIRST; else echo PENDING; fi")
            if test "$outcome" = FIRST; then echo 'WORKER_FIRST_ATTRIBUTED_AUTONOMOUS_CYCLE_AND_THREE_WORDS_PASS'; exit 0; fi
            if test "$outcome" = FAILED; then
              ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" "grep -E '^WORKER_[A-Z0-9_]+$' '$session/supervisor.log' || true"
              echo 'WORKER_RECOVERY_FAILED_PRIVATE_RECEIPT_SAVED'; exit 2
            fi
            sleep 20
          done
          echo 'WORKER_RECOVERY_RECEIPT_NOT_YET_TERMINAL'; exit 2
      - name: Verify second attributed timer cycle and three native Word exports
        run: |
          set -euo pipefail
          session="/home/aemr/.dash-private-backups/recovery-$RECOVERY_RUN"
          ssh_args=(-i "$RUNNER_TEMP/worker-recovery/key" -o UserKnownHostsFile="$RUNNER_TEMP/worker-recovery/known_hosts" -o StrictHostKeyChecking=yes)
          for attempt in $(seq 1 170); do
            outcome=$(ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" \
              "if test -f '$session/failure.json'; then echo FAILED; elif test -f '$session/result.json'; then echo ACCEPTED; else echo PENDING; fi")
            if test "$outcome" = ACCEPTED; then echo 'WORKER_TWO_ATTRIBUTED_AUTONOMOUS_CYCLES_AND_THREE_WORDS_PASS'; exit 0; fi
            if test "$outcome" = FAILED; then
              ssh "${ssh_args[@]}" "$VPS_USER@193.233.91.162" "grep -E '^WORKER_[A-Z0-9_]+$' '$session/supervisor.log' || true"
              echo 'WORKER_RECOVERY_FAILED_PRIVATE_RECEIPT_SAVED'; exit 2
            fi
            sleep 20
          done
          echo 'WORKER_RECOVERY_RECEIPT_NOT_YET_TERMINAL'; exit 2
      - name: Remove private runner copies and credentials
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/worker-recovery"
  full-worker-backup:
    if: >-
      github.event.label.name == 'maintenance: full-worker-backup' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      RECOVERY_SHA: ${{ github.event.pull_request.head.sha }}
      RECOVERY_RUN: ${{ github.run_id }}
      VPS_USER: ${{ secrets.DEPLOY_USER }}
      VPS_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Require exact-head CI and private scratch capacity
        run: |
          set -euo pipefail
          case "$RECOVERY_SHA" in *[!0-9a-f]*|'') exit 2 ;; esac
          test "${#RECOVERY_SHA}" = 40
          # Wait only before the maintenance window; no service has been stopped.
          ready=false
          for attempt in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RECOVERY_SHA&event=pull_request"               --jq '.workflow_runs[] | select(.name == "CI" and .conclusion == "success") | .id' | grep -q .; then
              ready=true
              break
            fi
            sleep 20
          done
          test "$ready" = true
          test "$(df -PB1 "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -gt 32212254720
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/worker-backup"
          printf '%s\n' "$VPS_KEY" > "$RUNNER_TEMP/worker-backup/key"
          ssh-keyscan -T 10 -H 193.233.91.162 > "$RUNNER_TEMP/worker-backup/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/worker-backup/known_hosts"
      - name: Quiesce writers and create private full compressed backup
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" bash -s -- prepare "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
      - name: Transfer privately and prove complete independent scratch restore
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/worker-backup/backup" "$RUNNER_TEMP/worker-backup/scratch"
          scp -q -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup/manifest.json" \
            "$VPS_USER@193.233.91.162:/home/aemr/.dash-private-backups/worker-$RECOVERY_RUN/backup/state.tar.gz"             "$RUNNER_TEMP/worker-backup/backup/"
          # Root is needed to reproduce original file UIDs/GIDs in disposable restore.
          sudo python3 deploy/stateful_backup.py verify             --backup "$RUNNER_TEMP/worker-backup/backup"             --scratch-parent "$RUNNER_TEMP/worker-backup/scratch"             > "$RUNNER_TEMP/worker-backup/restore.json"
          cat "$RUNNER_TEMP/worker-backup/restore.json"
      - name: Match still-quiesced original bytes after successful restore
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/worker-backup/key"             -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes             "$VPS_USER@193.233.91.162" bash -s -- match-source "$RECOVERY_SHA" "$RECOVERY_RUN"             /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
          echo 'FULL_BACKUP_EXTERNAL_RESTORE_AND_SOURCE_MATCH_PASS'
      - name: Always resume original server; never start worker or discard private backup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/worker-backup/key"; then
            ssh -i "$RUNNER_TEMP/worker-backup/key"               -o UserKnownHostsFile="$RUNNER_TEMP/worker-backup/known_hosts" -o StrictHostKeyChecking=yes               "$VPS_USER@193.233.91.162" bash -s -- resume "$RECOVERY_SHA" "$RECOVERY_RUN"               /home/aemr/dash /home/aemr/.dash-private-backups < deploy/report-backup-window.sh
          fi
      - name: Remove all private runner copies and credentials
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/worker-backup"
  current-worker-compat:
    if: >-
      github.event.label.name == 'maintenance: current-worker-compat' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/dash-audit-integrated-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Prove installed server image can read current worker inputs without writing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 193.233.91.162
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 18m
          script_stop: false
          script: |
            set -euo pipefail
            cd /home/aemr/dash/deploy
            server=$(docker compose --env-file .env.production ps --all --quiet server)
            test -n "$server"
            image=$(docker inspect --format '{{.Image}}' "$server")
            volume=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/app/packages/server/data"}}{{if eq .Type "volume"}}{{.Name}}{{end}}{{end}}{{end}}' "$server")
            case "$volume" in ''|*[!A-Za-z0-9_.-]*) exit 2 ;; esac
            probe=$(mktemp)
            trap 'rm -f "$probe"' EXIT
            docker run -i --rm --read-only --network aemr_aemr --tmpfs /tmp:rw,nosuid \
              --env-file .env.production \
              --mount "type=volume,src=$volume,dst=/app/packages/server/data,readonly" \
              --entrypoint /opt/report-env/bin/python "$image" -B - >"$probe" 2>&1 <<'PYCOMPAT' || true
            import json
            from importlib.metadata import version
            from pathlib import Path
            from procurement_engine.google_adapter import GoogleReadClient, capture_google
            from procurement_engine.runtime_inputs import validate_inputs
            from procurement_engine.recommendation_history import issued_recommendations
            try:
                root = Path('/app/packages/server/data/reports/inputs')
                registry = json.loads((root/'registry.json').read_text())
                ledger = json.loads((root/'ledger.json').read_text())
                validate_inputs(registry, ledger)
                client = GoogleReadClient()
                from procurement_engine.recommendation_history import read_google_history
                current, _, metadata, package = read_google_history(client, issued_recommendations(ledger), include_package=True)
                capture = capture_google(registry, client)
                print(json.dumps({'installed_worker_capture': 'PASS',
                    'engine_version': version('aemo-procurement-report-engine'),
                    'source_count': len(registry['sources']), 'history_read': metadata is not None,
                    'report_date': capture['report_date']}))
            except Exception as exc:
                code = str(exc).split(':', 1)[0]
                permitted = {'MONITORING_SCHEMA_LIVE_GEOMETRY_MISMATCH',
                    'SOURCE_CHANGED_DURING_FREEZE', 'GOOGLE_AUTH_REFRESH_FAILED',
                    'GOOGLE_CREDENTIALS_REQUIRED', 'GOOGLE_SHEET_TITLE_CHANGED_REVIEW_CONTRACT'}
                print(json.dumps({'installed_worker_capture': 'BLOCKED',
                    'reason': code if code in permitted else 'OTHER_READ_OR_CONTRACT_FAILURE'}))
                raise SystemExit(2) from None
            PYCOMPAT
            python3 - "$probe" <<'PYRESULT'
            import json, sys
            from pathlib import Path
            result = None
            for line in Path(sys.argv[1]).read_text().splitlines():
                try:
                    item = json.loads(line)
                    if isinstance(item, dict) and item.get('installed_worker_capture') in {'PASS', 'BLOCKED'}:
                        result = item
                except ValueError:
                    pass
            if not result:
                print('INSTALLED_WORKER_CAPTURE_NO_PROOF')
                sys.exit(2)
            print(json.dumps(result))
            sys.exit(0 if result['installed_worker_capture'] == 'PASS' else 2)
            PYRESULT
