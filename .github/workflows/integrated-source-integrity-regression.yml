name: Integrated source-integrity regression (no VPS)

on:
  push:
    branches:
      - codex/integrated-durable-formula-state-20261022
  pull_request:
    branches:
      - codex/dash-audit-integrated-20261010

permissions:
  contents: read

jobs:
  verify-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preserve integrated types and dependencies
        run: pnpm typecheck
      - name: Focused no-Google regressions
        run: >
          pnpm --filter @aemr/server exec vitest run
          src/services/source-integrity-state.test.ts
          src/services/source-refresh-formulas.test.ts
          src/services/formula-sink.test.ts
          src/services/metadata-watch.test.ts
          src/routes/source-integrity.test.ts
          src/db/ddl.test.ts
      - name: Hybrid vanished procurement regressions (no Google or VPS)
        run: |
          pnpm --filter @aemr/core exec vitest run src/analytics/vanished-rows.test.ts src/changes/change-story.test.ts
          pnpm --filter @aemr/server exec vitest run src/routes/integrity.test.ts src/services/live-diff.test.ts
          pnpm --filter @aemr/web exec vitest run src/components/analytics-extra/useExtraSignals.test.tsx src/components/live/live-text.test.ts src/hooks/useLiveEvents.test.ts
      - name: Signal detector fail-closed and clock regression
        run: pnpm --filter @aemr/core exec vitest run src/pipeline/signal-detector-failure.test.ts
      - name: Lint
        run: pnpm lint
      - name: Production build, without any deployment
        run: pnpm build
