name: Hotfix validation (no deployment)

on:
  push:
    branches:
      - 'hotfix/**'
  pull_request:
    branches:
      - 'codex/dash-audit-integrated-20261010'

permissions:
  contents: read

jobs:
  verify:
    name: Lint, TypeScript, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify dependency security guard
        run: pnpm verify:braces-patch
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Full unit tests
        run: pnpm -r test
      - name: Build
        run: pnpm build

  targeted:
    name: Focused SVOD, text, and catalog regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SVOD 278 and budget formulas
        run: pnpm --filter @aemr/core exec vitest run src/pipeline/validate.test.ts
      - name: Russian correction and subordinate dictionary
        run: pnpm --filter @aemr/shared exec vitest run src/text-language.test.ts src/text-hygiene.test.ts
      - name: Text-hygiene API corrections
        run: pnpm --filter @aemr/server exec vitest run src/routes/text-hygiene.test.ts
      - name: Server dashboard and decision regressions
        run: pnpm --filter @aemr/server exec vitest run src/routes/dashboard-refresh.test.ts src/routes/dashboard-payload.test.ts src/routes/dashboard-period-block.test.ts src/services/issue-decisions.test.ts
      - name: Weekly comparison and webhook lifecycle regressions
        run: pnpm --filter @aemr/server exec vitest run src/routes/change-story.test.ts src/app-webhook-lifecycle.test.ts src/services/zz-bench.test.ts
      - name: Web event and theme regressions
        run: pnpm --filter @aemr/web exec vitest run src/hooks/useChangeStory.test.tsx src/lib/surface-borders.test.ts
