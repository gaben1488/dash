[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aemo-procurement-report-engine"
version = "1.5.0rc6"
description = "Procurement reporting engine with forensic kernel, traceability, publication history and evidence-bound narrative projections"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "google-auth[requests]>=2.40,<3"]

[project.scripts]
proc-report = "procurement_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff==0.16.9"]
