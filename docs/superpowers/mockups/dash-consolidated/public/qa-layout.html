<!doctype html><html lang="ru"><meta charset="utf-8"><title>ДЭШ — проверка размеров</title><style>body{margin:0;background:#343434;font:14px system-ui;color:white}header{padding:10px;display:flex;gap:12px}button{padding:8px}iframe{display:block;border:0;height:900px;max-width:none}select{padding:8px}</style><header><label>Ширина <select id="width"><option>1440</option><option>1280</option><option>1024</option><option>768</option><option>390</option></select></label><button id="double">Текст 200%</button></header><iframe title="Проверка компоновки" src="/" width="1440"></iframe><script>const f=document.querySelector('iframe');document.querySelector('select').onchange=e=>f.width=e.target.value;document.querySelector('button').onclick=()=>{const sizes=[...f.contentDocument.querySelectorAll('button,span,p,td,th,label,input,h1,h2,h3,small,strong')].map(e=>[e,parseFloat(f.contentWindow.getComputedStyle(e).fontSize)]);sizes.forEach(([e,size])=>e.style.fontSize=size*2+'px')};</script></html>
