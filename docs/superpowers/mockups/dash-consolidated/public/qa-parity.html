<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dash — контроль соответствия экранов</title>
<style>
:root{font:14px/1.48 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark light;--base:#111418;--panel:#1b2025;--border:#394149;--text:#e9ecef;--muted:#a7b0bb;--accent:#e5d2a9}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--base);color:var(--text)}button,a{font:inherit}button{cursor:pointer}a{color:var(--accent)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{padding:23px clamp(15px,3vw,40px);border-bottom:1px solid var(--border)}h1{font-size:clamp(20px,2.7vw,29px);line-height:1.2;margin:0 0 8px}h2{font-size:19px}p{margin:5px 0 9px}.muted{color:var(--muted)}.warning{max-width:960px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(190px,260px) minmax(0,1fr);min-height:calc(100vh - 140px)}nav{border-right:1px solid var(--border);padding:15px}nav button{display:flex;width:100%;align-items:center;justify-content:space-between;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 12px;color:var(--text);text-align:left}nav button[aria-current=page]{border-color:#7e735e;background:var(--panel);color:#f6e7c5}nav small{color:var(--muted);font-size:11px}.content{padding:clamp(15px,2.8vw,35px);min-width:0;max-width:1090px}.line{border-bottom:1px solid var(--border);padding:0 0 15px;margin-bottom:16px}.chip{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:3px 7px;border-radius:5px;display:inline-flex;margin-right:6px}.blocked{color:#ecc98f}.info{font-size:13px;color:var(--muted);margin:12px 0 22px;max-width:820px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}.mode{padding:10px 12px;min-height:56px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);text-align:left}.mode[aria-pressed=true]{border-color:var(--accent)}.mode small{display:block;font-size:11px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 28px}.actions a{border:1px solid var(--border);border-radius:7px;padding:9px 12px;text-decoration:none}.actions a:hover{background:var(--panel)}.qa-note{border-left:3px solid var(--accent);padding:7px 12px;color:var(--muted);background:var(--panel)}.bottom{color:var(--muted);font-size:12px;margin-top:30px}.current{color:#fff}
@media(max-width:680px){.layout{display:block}nav{display:flex;overflow-x:auto;gap:4px;border-right:none;border-bottom:1px solid var(--border)}nav button{white-space:nowrap;width:auto;flex:0 0 auto}nav small{display:none}.modes{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}}
@media(prefers-color-scheme:light){:root{--base:#f8f7f4;--panel:#fff;--border:#d5d0c8;--text:#252525;--muted:#5c6269;--accent:#775b25}.current{color:#252525}}
</style></head><body>
<header><h1>Контроль соответствия UI Dash</h1><p class="warning">Это интерактивная матрица приёмки, <strong>не новый дизайн интерфейса</strong>. Слева перечислены реальные разделы продукта. Переход в макет открывает демонстрационную оболочку, а не утверждённую копию страницы.</p></header>
<div class="layout"><nav id="pages" aria-label="Разделы Dash для проверки"></nav><main class="content" id="detail" aria-live="polite"></main></div>
<script type="application/json" id="ui-parity-source">[{"id":"dashboard","label":"Пульс","source":"packages/web/src/pages/Dashboard.tsx","preview":"Общая оболочка","status":"excluded","note":"Содержимое Пульса исключено из переделки. Его нельзя заменять демонстрационной страницей.","modes":[]},{"id":"report","label":"Отчёт","source":"packages/web/src/pages/Report.tsx","preview":"Упрощённый образец","status":"blocked","note":"Сохранить документную структуру, сверку, доказательства, историю срезов и все проверенные Word-выпуски. Образец не заменяет ReportPage.","modes":[{"id":"main","label":"Отчёт в Word","kind":"action","marker":"word.download('main')"},{"id":"extra","label":"Доп. отчёт в Word","kind":"action","marker":"word.download('extra')"},{"id":"operational","label":"Оперативный в Word","kind":"action","marker":"word.download('operational')"},{"id":"week-deltas","label":"Что изменилось за неделю","kind":"section","marker":"Что изменилось за неделю"}]},{"id":"svod","label":"Свод","source":"packages/web/src/pages/SvodView.tsx","preview":"Сокращённый пример","status":"blocked","note":"Сверять официальный СВОД с расчётами, не теряя кварталы, бюджеты, способы и исходные ячейки.","modes":[]},{"id":"data","label":"Реестр","source":"packages/web/src/pages/DataBrowser.tsx","preview":"Демонстрационная таблица","status":"blocked","note":"Восстановить настоящие столбцы, сортировку, виртуализацию, редактирование, выгрузку и карточку строки.","modes":[{"id":"browse","label":"Просмотр","kind":"tab","marker":"viewMode === 'browse'"},{"id":"editor","label":"Редактор таблиц","kind":"tab","marker":"viewMode === 'editor'"}]},{"id":"unfunded","label":"Не обеспеченные","source":"packages/web/src/pages/DataBrowser.tsx","preview":"Демонстрационный срез","status":"blocked","note":"Корзина определяется действующими правилами источника; отсутствие года в тестовом наборе не заменяет классификацию.","modes":[{"id":"browse","label":"Просмотр","kind":"tab","marker":"viewMode === 'browse'"},{"id":"editor","label":"Редактор таблиц","kind":"tab","marker":"viewMode === 'editor'"}]},{"id":"yearlong","label":"В течение года","source":"packages/web/src/pages/DataBrowser.tsx","preview":"Демонстрационный срез","status":"blocked","note":"Сохранить правила годовой категории, виды закупок, статусы и реальный редактор без фиктивных фильтров.","modes":[{"id":"browse","label":"Просмотр","kind":"tab","marker":"viewMode === 'browse'"},{"id":"editor","label":"Редактор таблиц","kind":"tab","marker":"viewMode === 'editor'"}]},{"id":"monitoring","label":"Мониторинг","source":"packages/web/src/pages/Monitoring.tsx","preview":"Демонстрация связей","status":"blocked","note":"Все режимы читают разные формы реестра процедур. Очередь, свод, связи, справочники и первоисточники не сводятся в один макетный список.","modes":[{"id":"work","label":"В работе","kind":"mode","marker":"label: 'В работе'","markerSource":"packages/web/src/lib/monitoring/modes.ts"},{"id":"all","label":"Реестр","kind":"mode","marker":"id: 'all'","markerSource":"packages/web/src/lib/monitoring/modes.ts"},{"id":"svod","label":"Обзор","kind":"mode","marker":"label: 'Обзор'","markerSource":"packages/web/src/lib/monitoring/modes.ts"},{"id":"journal","label":"Связи","kind":"mode","marker":"label: 'Связи'","markerSource":"packages/web/src/lib/monitoring/modes.ts"},{"id":"directory","label":"Справочники","kind":"mode","marker":"label: 'Справочники'","markerSource":"packages/web/src/lib/monitoring/modes.ts"}]},{"id":"economy","label":"Экономия","source":"packages/web/src/pages/Economy.tsx","preview":"Аналитический пример","status":"blocked","note":"Сохранить независимые виды экономии и AD-гейт; не пересчитывать экономию как план минус факт.","modes":[]},{"id":"competition","label":"Конкуренция","source":"packages/web/src/pages/Competition.tsx","preview":"Аналитический пример","status":"blocked","note":"Не подменять действующие сравнения КП и ЕП декоративной карточкой.","modes":[]},{"id":"discipline","label":"Дисциплина","source":"packages/web/src/pages/Discipline.tsx","preview":"Аналитический пример","status":"blocked","note":"Показать доказанные действия и последствия без придуманного рейтинга наказаний.","modes":[]},{"id":"analytics","label":"Аналитика","source":"packages/web/src/pages/Analytics.tsx","preview":"Аналитический пример","status":"blocked","note":"Сохранить реальные метрики, интерактивность, основание каждого числа и границы периода.","modes":[]},{"id":"quality","label":"Контроль","source":"packages/web/src/pages/Quality.tsx","preview":"Упрощённая очередь","status":"blocked","note":"Не прятать шесть рабочих разделов за одной демонстрационной таблицей.","modes":[{"id":"recon","label":"Сверка","kind":"tab","marker":"id: 'recon', label: 'Сверка'"},{"id":"trust","label":"Качество заполнения","kind":"tab","marker":"id: 'trust', label: 'Качество заполнения'"},{"id":"issues","label":"Замечания","kind":"tab","marker":"id: 'issues', label: 'Замечания'"},{"id":"scorecard","label":"Оценка управлений","kind":"tab","marker":"id: 'scorecard', label: 'Оценка управлений'"},{"id":"recs","label":"Рекомендации","kind":"tab","marker":"id: 'recs', label: 'Рекомендации'"},{"id":"journal","label":"Журнал","kind":"tab","marker":"id: 'journal', label: 'Журнал'"}]},{"id":"settings","label":"Система","source":"packages/web/src/pages/Settings.tsx","preview":"Настройки демонстрации","status":"blocked","note":"Реальные источники данных, соответствия ячеек и подключения нельзя заменять переключением палитр.","modes":[{"id":"sources","label":"Источники данных","kind":"tab","marker":"id: 'sources', label: 'Источники данных'"},{"id":"mapping","label":"Соответствие ячеек","kind":"tab","marker":"id: 'mapping', label: 'Соответствие ячеек'"},{"id":"connection","label":"Подключение","kind":"tab","marker":"id: 'connection', label: 'Подключение'"}]}]</script>
<script>
const PAGES=JSON.parse(document.getElementById('ui-parity-source').textContent);
const pages=document.getElementById('pages'),detail=document.getElementById('detail');
let selected=PAGES[0].id,submode=null;
const E=(name,attrs={},body)=>{const el=document.createElement(name);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);if(body!=null)el.textContent=body;return el;};
const safe=(x)=>String(x||'');
function render(){pages.replaceChildren();for(const p of PAGES){const b=E('button',{'type':'button','aria-current':p.id===selected?'page':'false'},p.label);const s=E('small',{},p.modes.length?String(p.modes.length):'—');b.append(s);b.onclick=()=>{selected=p.id;submode=null;render();};pages.append(b);}const p=PAGES.find(x=>x.id===selected);detail.replaceChildren();detail.append(E('div',{class:'line'},'Реальная страница: '+p.label));detail.append(E('h2',{},p.label));detail.append(E('span',{class:'chip blocked'},p.status==='excluded'?'Содержимое вне задачи':'Полное соответствие НЕ подтверждено'));detail.append(E('span',{class:'chip'},p.preview));detail.append(E('p',{class:'info'},p.note));detail.append(E('h3',{},'Реальные внутренние режимы и действия'));if(!p.modes.length){detail.append(E('p',{class:'info'},p.status==='excluded'?'В задаче проверяется только общая оболочка.':'В этой матрице не заявлены отдельные внутренние вкладки. Содержание исходной страницы всё равно подлежит приёмке.'));}else{const grid=E('div',{class:'modes'});for(const m of p.modes){const b=E('button',{type:'button','aria-pressed':String(submode===m.id),class:'mode'},m.label);b.append(E('small',{},m.kind==='action'?'Действие':m.kind==='section'?'Раздел':m.kind==='mode'?'Режим':'Подвкладка'));b.onclick=()=>{submode=m.id;render();};grid.append(b);}detail.append(grid);}if(submode){const m=p.modes.find(x=>x.id===submode);if(m)detail.append(E('p',{class:'qa-note'},'Выбрано для проверки: '+m.label+'. Это не переключение реальной подвкладки. Откройте существующую страницу или её код и сравните содержание, расчёты и поведение.'));}const links=E('div',{class:'actions'});const preview=E('a',{href:'./index.html#/page/'+p.id,target:'_blank',rel:'noopener noreferrer'},'Открыть существующий макет');const source=E('a',{href:'https://github.com/gaben1488/dash/blob/main/'+p.source,target:'_blank',rel:'noopener noreferrer'},'Посмотреть рабочий компонент');links.append(preview,source);detail.append(links);detail.append(E('p',{class:'bottom'},'Чтобы допустить экран к реализации, нужны: совпадение компоновки с действующей страницей, все реальные режимы и действия, сохранение данных и фильтров, клавиатура, контраст и проверка на трёх ширинах. Пока проверка не завершена, экран не считается 1:1.'));}
render();
</script></body></html>
